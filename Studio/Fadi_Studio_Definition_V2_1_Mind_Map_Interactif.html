></g><rect x="1490" y="989" width="620" height="492" rx="35" fill="#162A41"/><text x="1800" y="1069" font-size="74" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="5">FADI</text><text x="1800" y="1128" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" >STUDIO DE CONCEPTION</text><text x="1800" y="1172" font-size="32" font-weight="700" fill="#fff" text-anchor="middle" >ARCHITECTURALE</text><line x1="1560" y1="1211" x2="2040" y2="1211" stroke="#567087" stroke-width="1.5"/><text x="1800" y="1267" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" >CHARTE PRODUIT</text><text x="1800" y="1315" font-size="24" font-weight="400" fill="#D6E2EC" text-anchor="middle" >8 sections de référence</text><text x="1800" y="1365" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" >4 domaines · 2 planches</text><text x="1800" y="1434" font-size="22" font-weight="400" fill="#9EB3C8" text-anchor="middle" >1 workflow transversal</text><text x="1800" y="870" font-size="24" font-weight="700" fill="#344861" text-anchor="middle" >Autonomie des planches</text><text x="1800" y="910" font-size="20" font-weight="400" fill="#64748B" text-anchor="middle" >Personnalisation sans perte d’autorité</text><text x="1800" y="1572" font-size="22" font-weight="700" fill="#344861" text-anchor="middle" >Centraliser la gestion, pas l’exécution.</text><text x="1800" y="1610" font-size="21" font-weight="400" fill="#64748B" text-anchor="middle" >Conception, intégrité et traçabilité.</text><line x1="80" y1="2288" x2="3520" y2="2288" stroke="#DCE4EE" stroke-width="2"/><text x="80" y="2333" font-size="20" font-weight="400" fill="#64748B" text-anchor="start" >Source : Fadi_Studio_Definition_Officielle_Reference_V2_1.docx</text><text x="3520" y="2333" font-size="22" font-weight="400" fill="#64748B" text-anchor="end" >Vue 1/1 · cliquer sur une carte pour ouvrir le détail</text></g></svg></div></div>

<script id="documentsData" type="application/json">[{"key":"definition","source":"Fadi_Studio_Definition_Officielle_Reference_V2_1.docx","sha256":"5ad8bb2bc78c7eada33cfdaed571131b8966c6a4a4584786966acae9efd1c958","children":[{"label":"01  Mission et périmètre","children":[{"label":"Le Studio de conception architecturale est un module autonome et natif de Fadi. Il réunit les moyens pour concevoir, dessiner, modéliser, renseigner, visualiser, coordonner, contrôler et documenter une conception architecturale, de la première exploration jusqu’à l’approbation et la publication d’un dossier de conception.","kind":"text","block":"P007","id":"definition-0-0"},{"label":"Le Studio est accessible sans passage obligatoire par les 21 étapes du Parcours. Il échange avec les autres modules Fadi sans constituer une application isolée, une seconde base de données métier ou une duplication des services généraux.","kind":"text","block":"P008","id":"definition-0-1"},{"label":"Son périmètre couvre les études, variantes, dessins, modèles, informations BIM, visualisations, métrés, observations et décisions relatifs à la conception. Il exclut la gestion commerciale, la comptabilité, les ressources humaines, la direction quotidienne des travaux et l’exploitation du bâtiment.","kind":"text","block":"P009","id":"definition-0-2"}],"kind":"chapter","source":"§ 01  Mission et périmètre","block":"P006","id":"definition-0","number":"01","title":"Mission et périmètre","tag":"CHARTE PRODUIT · SECTION","color":"#52647C","bullets":["Module autonome et natif de Fadi","Accès sans passer par les 21 étapes du Parcours","De l’exploration au dossier approuvé et publié","Conception : études, modèles, BIM et décisions","Hors gestion d’entreprise, travaux et exploitation"]},{"label":"02  Organisation fonctionnelle","children":[{"label":"L’organisation de référence comprend quatre domaines fonctionnels, dont les responsabilités restent stables quelle que soit la personnalisation de l’interface.","kind":"text","block":"P011","id":"definition-1-0"},{"label":"Tableau — DOMAINE / RESPONSABILITÉ","children":[{"label":"01 · Dessin et modélisation","children":[{"label":"RESPONSABILITÉ : Concevoir et modifier dans Planche 2D ⇄ Planche 3D.","kind":"text","id":"definition-1-1-0-0"}],"kind":"row","id":"definition-1-1-0"},{"label":"02 · BIM et coordination","children":[{"label":"RESPONSABILITÉ : Structurer les informations et contrôler la cohérence des modèles.","kind":"text","id":"definition-1-1-1-0"}],"kind":"row","id":"definition-1-1-1"},{"label":"03 · Visualisation, rendu et immersion","children":[{"label":"RESPONSABILITÉ : Examiner et présenter les solutions architecturales.","kind":"text","id":"definition-1-1-2-0"}],"kind":"row","id":"definition-1-1-2"},{"label":"04 · Documentation, métrés et collaboration","children":[{"label":"RESPONSABILITÉ : Produire les documents, quantités, observations, revues et publications.","kind":"text","id":"definition-1-1-3-0"}],"kind":"row","id":"definition-1-1-3"}],"kind":"table","block":"T012","id":"definition-1-1"},{"label":"Le premier domaine contient deux planches de travail complètes : Planche 2D et Planche 3D. Chacune permet de créer et modifier une conception indépendamment de l’autre. Elles peuvent aussi agir sur les mêmes objets architecturaux associés, à travers une communication bidirectionnelle régie par des identités et des règles de propagation explicites.","kind":"text","block":"P014","id":"definition-1-2"},{"label":"Trois relations sont distinguées : objet associé, référence liée et copie indépendante. Une projection ou une coupe calculée n’est pas une seconde définition de l’objet source. Aucune géométrie libre n’acquiert automatiquement une signification BIM.","kind":"text","block":"P015","id":"definition-1-3"}],"kind":"chapter","source":"§ 02  Organisation fonctionnelle","block":"P010","id":"definition-1","number":"02","title":"Organisation fonctionnelle","tag":"CHARTE PRODUIT · SECTION","color":"#176CAE","bullets":["Quatre domaines aux responsabilités stables","Planche 2D et Planche 3D autonomes ou associées","Objets associés · références liées · copies indépendantes","Une projection ne redéfinit pas son objet source","La géométrie libre ne devient pas du BIM par défaut"]},{"label":"03  Personnalisation et système d’outils","children":[{"label":"Les quatre domaines forment le profil standard. L’utilisateur peut adopter un profil métier ou composer des espaces personnels : barres d’outils, favoris, groupes, raccourcis et panneaux. L’interface s’adapte à la pratique ; les responsabilités métier, les droits et les données du projet ne changent pas.","kind":"text","block":"P017","id":"definition-2-0"},{"label":"Le Tool Registry est le catalogue central des capacités et de leurs contrats versionnés : identité, finalité, compatibilité 2D/3D, dépendances, conditions d’utilisation et qualité attendue. Le Tool Manager assure leur découverte, leur recherche, leur activation, leur organisation et leur chargement progressif. Il n’est ni un moteur de géométrie ni l’autorité de validation des modifications.","kind":"text","block":"P018","id":"definition-2-1"},{"label":"Les ressources sont activées proportionnellement au besoin : catalogue et profil léger au démarrage ; moteur et outils courants à l’ouverture d’une planche ; dépendances spécialisées au premier usage. Un outil masqué reste recherchable s’il est autorisé. Une barre de vingt outils ne doit pas entraîner, sans justification technique, l’initialisation de tous les outils lourds.","kind":"text","block":"P019","id":"definition-2-2"},{"label":"Le Studio prévoit un socle utilisable hors connexion et la possibilité de conserver localement les outils nécessaires à un profil. La disponibilité hors ligne est affichée sans ambiguïté : un outil inscrit au catalogue mais absent du cache n’est pas considéré utilisable hors réseau. Les validations centrales restent soumises à une nouvelle vérification lors de la reconnexion.","kind":"text","block":"P020","id":"definition-2-3"}],"kind":"chapter","source":"§ 03  Personnalisation et système d’outils","block":"P016","id":"definition-2","number":"03","title":"Personnalisation et système d’outils","tag":"CHARTE PRODUIT · SECTION","color":"#176CAE","bullets":["Profils standard, métier et espaces personnels","Tool Registry : catalogue et contrats versionnés","Tool Manager : découverte, activation et chargement","Trois temps : démarrage, planche, premier usage","Hors connexion : capacités réellement présentes"]},{"label":"04  Moteurs mutualisés et qualité d’exécution","children":[{"label":"La gestion des outils est centralisée, pas leur exécution. Les gestes interactifs et les aperçus courts peuvent être traités localement ; les tâches coûteuses utilisent au besoin des Web Workers et des noyaux WASM ; les services Fadi restent responsables des transactions et validations partagées. Un ordonnanceur de calcul peut gérer les priorités, annulations et résultats périmés.","kind":"text","block":"P022","id":"definition-3-0"},{"label":"Les données de référence (dessin 2D indépendant, géométrie 3D libre, objets associés) sont séparées des projections de scène, des index spatiaux, des caches techniques et des représentations livrées. Le rendu, le snapping, le picking et les actualisations partielles sont optimisés uniquement après mesures sur des profils d’usage représentatifs.","kind":"text","block":"P023","id":"definition-3-1"},{"label":"Toute optimisation est subordonnée à la non-régression : elle doit conserver, dans les tolérances spécifiées, les accrochages, sélections, contraintes, dimensions, volumes et géométries exportées. Les gains de latence ou de mémoire ne justifient aucune altération du résultat métier. Les moteurs actuels de Fadi sont conservés, adaptés ou remplacés sur preuve, jamais par automatisme.","kind":"text","block":"P024","id":"definition-3-2"}],"kind":"chapter","source":"§ 04  Moteurs mutualisés et qualité d’exécution","block":"P021","id":"definition-3","number":"04","title":"Moteurs mutualisés et qualité d’exécution","tag":"CHARTE PRODUIT · SECTION","color":"#52647C","bullets":["Gestion centralisée, exécution locale ou déléguée","Workers / WASM pour les tâches coûteuses","Données de référence ≠ scènes, index et caches","Mesures de rendu, snapping, picking et mémoire","Non-régression dans les tolérances spécifiées"]},{"label":"05  Invariants, sécurité et réversibilité","children":[{"label":"Les garanties ci-dessous s’imposent à tous les outils, qu’ils soient activés depuis une planche, un profil personnalisé ou une interface IA :","kind":"text","block":"P026","id":"definition-4-0"},{"label":"Autorité et identité. Une définition architecturale associée conserve une source de vérité ; une copie indépendante ne propage aucune modification vers son origine.","kind":"text","block":"P027","id":"definition-4-1"},{"label":"Intégrité transactionnelle. Une opération refusée ne laisse aucune modification partielle des données de référence. Les prévisualisations et états provisoires sont annulés conformément au contrat de l’outil.","kind":"text","block":"P028","id":"definition-4-2"},{"label":"Exigences distinctes. Modifier le résultat dessiné ne modifie pas automatiquement le programme ou les exigences approuvées.","kind":"text","block":"P029","id":"definition-4-3"},{"label":"Révisions et décisions. Une approbation désigne le contenu effectivement examiné ; un résultat calculé sur une ancienne révision n’écrase pas le résultat courant.","kind":"text","block":"P030","id":"definition-4-4"},{"label":"Réversibilité et concurrence. L’annulation ou le rétablissement respecte les commandes et historiques validés et ne supprime pas silencieusement les modifications d’autrui.","kind":"text","block":"P031","id":"definition-4-5"},{"label":"Sécurité. Les vérifications des permissions, des entrées, des préconditions, des révisions et de l’intégrité restent actives côté serveur ; une validation statique du Registry ne les remplace jamais.","kind":"text","block":"P032","id":"definition-4-6"}],"kind":"chapter","source":"§ 05  Invariants, sécurité et réversibilité","block":"P025","id":"definition-4","number":"05","title":"Invariants, sécurité et réversibilité","tag":"CHARTE PRODUIT · SECTION","color":"#218471","bullets":["Identité et autorité · copies sans propagation","Refus : aucune mutation canonique partielle","Exigence approuvée ≠ résultat dessiné","Révisions, approbations et résultats périmés","Réversibilité, concurrence et validation serveur"]},{"label":"06  Études, workflow et publications","children":[{"label":"Les quatre domaines partagent un contexte commun : Projet Fadi → Étude → Variante → Révision. La séparation des études et variantes autorise l’exploration de solutions distinctes, sans propagation implicite entre copies.","kind":"text","block":"P034","id":"definition-5-0"},{"label":"Le workflow de conception est : Cadrer → Explorer → Concevoir → Contrôler → Coordonner et corriger → Approuver → Publier. Il s’applique à des révisions ou dossiers identifiés, et ne remplace pas la méthode des 21 étapes du Parcours.","kind":"text","block":"P035","id":"definition-5-1"},{"label":"Une publication conserve un manifeste des versions coordonnées des modèles, dessins, références, métrés et documents qu’elle contient. L’approbation de cet ensemble et sa diffusion sont des actes distincts. Une révision approuvée demeure identifiable même lorsque le travail se poursuit.","kind":"text","block":"P036","id":"definition-5-2"}],"kind":"chapter","source":"§ 06  Études, workflow et publications","block":"P033","id":"definition-5","number":"06","title":"Études, workflow et publications","tag":"CHARTE PRODUIT · SECTION","color":"#B26A31","bullets":["Projet → Étude → Variante → Révision","Cadrer → Explorer → Concevoir → Contrôler","Coordonner et corriger → Approuver → Publier","Manifeste des versions coordonnées","Approbation et diffusion : deux actes distincts"]},{"label":"07  Intelligence artificielle et extensions","children":[{"label":"Un adaptateur MCP facultatif peut exposer certaines capacités du Studio à des agents IA. Il utilise les mêmes contrats de commandes, droits, confirmations et journaux que les actions humaines. Il ne transforme pas le déplacement du pointeur, l’accrochage ou le rendu image par image en appels réseau.","kind":"text","block":"P038","id":"definition-6-0"},{"label":"L’ajout de capacités ou d’extensions reste soumis aux exigences de version, de compatibilité, de sécurité, d’origine et de maintenance fixées par le référentiel complet. La découverte d’une capacité n’équivaut pas à son autorisation.","kind":"text","block":"P039","id":"definition-6-1"}],"kind":"chapter","source":"§ 07  Intelligence artificielle et extensions","block":"P037","id":"definition-6","number":"07","title":"Intelligence artificielle et extensions","tag":"CHARTE PRODUIT · SECTION","color":"#8E59A6","bullets":["Adaptateur MCP facultatif pour les agents IA","Mêmes droits, commandes, confirmations et journaux","Aucun appel réseau pour les gestes de CAO","Extensions : origine, version, sécurité, maintenance","Découvrir une capacité ne l’autorise pas"]},{"label":"08  Hiérarchie documentaire, décisions et traçabilité","children":[{"label":"La présente définition est le document maître de niveau 1 pour la finalité, les limites et les principes du Studio. Le Référentiel complet Studio — Concept consolidé V2 décrit les contrats et règles de niveau 2 et le plan de validation du niveau 3. Ses éventuelles synthèses ne constituent pas une seconde définition officielle ; toute divergence doit être arbitrée et synchronisée.","kind":"text","block":"P041","id":"definition-7-0"},{"label":"Les choix technologiques, seuils de performance, formats, stratégies de stockage, politiques de cache et décisions de réutilisation des moteurs restent des options à qualifier, non des faits approuvés par leur simple présence dans un document. Une capacité non vérifiée ne peut être déclarée conforme.","kind":"text","block":"P042","id":"definition-7-1"},{"label":"Les travaux documentaires doivent assurer une traçabilité bidirectionnelle : exigence identifiée ↔ contrat de fonctionnement ↔ composant Fadi ↔ scénario de test ↔ preuve de résultat ↔ décision d’architecture. Les éléments sans preuve ou décision restent explicitement ouverts.","kind":"text","block":"P043","id":"definition-7-2"},{"label":"La démarche retenue est : concevoir la cible → comparer l’existant → compléter et qualifier les écarts → décider de l’implémentation. Les preuves de faisabilité et les décisions d’architecture précèdent toute intervention autorisée sur le code de production.","kind":"text","block":"P044","id":"definition-7-3"},{"label":"Finalité. Faire du Studio un environnement de conception personnalisable, performant, extensible et cohérent, dans lequel chaque utilisateur mobilise les outils utiles à sa pratique sans compromettre la précision, l’intégrité, la réversibilité ou la traçabilité des projets.","kind":"text","block":"P045","id":"definition-7-4"},{"label":"Document de référence associé","children":[{"label":"Fadi_Studio_Concept_V2_Outils_Modulaires_Performance.md — Référentiel complet, 10 chapitres et 3 annexes. Les seuils, contrats, tests, preuves et 18 décisions ouvertes y sont détaillés ; ils ne sont pas reproduits dans la présente charte.","kind":"text","block":"P047","id":"definition-7-5-0"},{"label":"Contrôle documentaire : une seule définition produit officielle ; spécifications et validation conservées dans un référentiel distinct, sans duplication concurrente.","kind":"text","block":"P048","id":"definition-7-5-1"}],"kind":"section","source":"§ Document de référence associé","block":"P046","id":"definition-7-5"}],"kind":"chapter","source":"§ 08  Hiérarchie documentaire, décisions et traçabilité","block":"P040","id":"definition-7","number":"08","title":"Hiérarchie documentaire, décisions et traçabilité","tag":"CHARTE PRODUIT · SECTION","color":"#52647C","bullets":["Charte de niveau 1 : définition produit unique","Spécifications et plan de preuves : niveaux 2 et 3","Choix techniques ouverts, non approuvés par défaut","Exigence ↔ contrat ↔ composant ↔ test ↔ preuve ↔ décision","Concevoir → comparer → qualifier → décider"]}],"preamble":[{"label":"CHARTE PRODUIT  /  DOCUMENT DIRECTEUR","kind":"text","block":"P000","id":"definition-pre-0"},{"label":"Studio de conception\narchitecturale","kind":"text","block":"P001","id":"definition-pre-1"},{"label":"Définition consolidée — version de référence officielle proposée","kind":"text","block":"P002","id":"definition-pre-2"},{"label":"Informations documentaires","children":[{"label":"ÉDITION : V2.1 · 17 octobre 2026 · NIVEAU DOCUMENTAIRE : 1 · Concept et charte produit · STATUT : Texte de référence à adopter","kind":"text","id":"definition-pre-3-0"}],"kind":"table","block":"T003","id":"definition-pre-3"},{"label":"Portée. Le présent document constitue la définition unique proposée comme référence officielle du produit Studio. Il en fixe la finalité, les limites et les principes non négociables. Il n’est ni un cahier des charges détaillé, ni une preuve de faisabilité, ni une autorisation de développement. Les contrats, les matrices, les décisions techniques et les essais sont portés par le référentiel complet (niveaux 2 et 3).","kind":"text","block":"P005","id":"definition-pre-4"}],"sourceParagraphs":45,"sourceTables":2,"nodeCount":50,"sourceBase64":"UEsDBBQAAAAIAJQRUV0uF+EAqAEAAMoHAAATAAAAW0NvbnRlbnRfVHlwZXNdLnhtbLWVTW/TQBCG7/wKyxcfkL0pB4RQnB6gHKESQXDd7I7jbfdLO5O2+ffMOo2FSopT0lwiOTPv+zz+kueXD84Wd5DQBN9WF82sKsCroI1ft9WP5Zf6Q1UgSa+lDR7aagtYXS7ezJfbCFhw2GNb9kTxoxCoenASmxDB86QLyUniw7QWUapbuQbxbjZ7L1TwBJ5qyh3lYv4ZOrmxVFw98N+DSHkTYV0Wn3aLmdWWxuWCYSAOZhJYfJKRMVqjJPFc3Hn9xKx+tGo4OexgbyK+5YVnCHnyPOAx942vZjIaimuZ6Kt0vCXUBim4X84KQ+CuU4h40fy77YBu6DqjQAe1cRxpxtLcB4kMjO6HHDg3gAVTTmZDvigadB1fxlYhwcvh+/uU00cS70PSYtQ99XRzG3MVIPKL4WwzTpw0ftKjY/JSrux/nPqUyFh9hEQgSKc/dgcUcvEkvwepz8LfFU/y/catIHHk9Q3G6kkJBCLew9d32DdPK9DWw }
function downloadBlob(raw,name,type){
 const blob=new Blob([raw],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function downloadWord(){
 const d=current(),raw=atob(d.sourceBase64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
 downloadBlob(bytes,d.source,'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
 announce('Document Word source exporté.');
}
function openSource(){
 lastFocused=document.activeElement;selected=null;panelMode='source';panel.hidden=false;panel.classList.add('source-only');main.classList.add('panel-open');
 $('panelTitle').textContent='Document source et lecture';$('chapterSelect').value='';updateSelection();tree.replaceChildren();
 const p=document.createElement('p');p.className='first-note';p.textContent=current().note;tree.append(p);
 const h=document.createElement('h3');h.className='subtle-title';h.textContent='Fichier Word original intégré';tree.append(h);
 const t=document.createElement('p');t.className='summary-note';t.textContent='Le panneau de détail reprend le texte et les tableaux du Word. Les cartes affichent une synthèse. Les numéros et identifiants du document source sont conservés. Le téléchargement ci-dessous restitue le fichier original, sans modification.';tree.append(t);
 const actions=document.createElement('div');actions.className='source-actions';const b=document.createElement('button');b.textContent='Télécharger le Word source';b.onclick=downloadWord;actions.append(b);tree.append(actions);
 const ht=document.createElement('h3');ht.className='subtle-title';ht.textContent='Empreinte SHA-256 du document source';tree.append(ht);
 const code=document.createElement('p');code.className='reference-hash';code.textContent=current().sha256;tree.append(code);
 const hp=document.createElement('h3');hp.className='subtle-title';hp.textContent='Portée et préambule du document';tree.append(hp);
 for(const n of current().preamble)tree.append(createNode(n,0,''));
 const ref=document.createElement('p');ref.className='ref';ref.textContent='Modèle visuel et interactions : Studio_Concept_Mind_Map.html fourni. Cette page est une aide de lecture, pas un outil de validation du code ni un suivi d’implémentation automatiquement synchronisé.';tree.append(ref);
 tree.scrollTop=0;syncHash();announce('Document source affiché.');
}
function setPage(p){if(p<0||p>=current().pages.length)return;closeDetails(false);renderMap(p);announce(`Vue ${p+1} sur ${current().pages.length}.`);}
function showFromHash(hash){
 const parts=hash.replace(/^#/,'').split('/'),di=DOCS.findIndex(d=>d.key===parts[0]);
 if(di<0)return;configureDocument(di);
 if(parts[1]==='plan')openDetails(null);else if(parts[1]==='source')openSource();
 else if(parts[1]!==undefined&&/^\d+$/.test(parts[1]))openDetails(Number(parts[1]));
}
DOCS.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.className='doc-tab';b.textContent=d.short;b.setAttribute('aria-pressed',String(i===0));b.onclick=()=>configureDocument(i);$('docTabs').append(b);});
if(DOCS.length===1)document.body.classList.add('single-doc');
$('chapterSelect').onchange=e=>{if(e.target.value==='')closeDetails();else openDetails(Number(e.target.value));};
$('outline').onclick=()=>openDetails(null);
$('close').onclick=()=>closeDetails();$('backMap').onclick=()=>closeDetails();
$('fit').onclick=()=>{fit();announce('Carte ajustée.');};$('in').onclick=()=>zoom(1.35);$('out').onclick=()=>zoom(1/1.35);
$('mapSelect').onchange=e=>setPage(Number(e.target.value));$('pagePrev').onclick=()=>setPage(pageIndex-1);$('pageNext').onclick=()=>setPage(pageIndex+1);
$('search').oninput=renderTree;$('scope').onchange=renderTree;
$('expand').onclick=()=>{tree.querySelectorAll('details').forEach(d=>{d.open=true;openNodes.set(d.dataset.node,true);});announce('Branches dépliées.');};
$('collapse').onclick=()=>{tree.querySelectorAll('details').forEach(d=>{d.open=false;openNodes.set(d.dataset.node,false);});announce('Branches repliées.');};
$('sourceButton').onclick=openSource;
$('download').onclick=()=>{downloadBlob(current().maps[pageIndex],`Fadi_Studio_${current().key}_Mind_Map_vue_${pageIndex+1}.svg`,'image/svg+xml;charset=utf-8');announce('Carte vectorielle exportée.');};
// Pointer input: keep the tap target separate from pointer capture to avoid double activation.
function gesture(){const a=[...pointers.values()];if(!a.length)return null;if(a.length===1)return {x:a[0].x,y:a[0].y,d:0};return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};}
stage.addEventListener('pointerdown',e=>{
 if(e.button!==0)return;
 if(!pointers.size){gestureMoved=false;const hit=e.target.closest('.chapter');gestureOrigin={x:e.clientX,y:e.clientY,section:hit?Number(hit.dataset.section):null};}
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>1)gestureMoved=true;previous=gesture();
 try{stage.setPointerCapture(e.pointerId);}catch(_){}stage.classList.add('dragging');
});
stage.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const g=gesture();
 if(gestureOrigin&&Math.hypot(e.clientX-gestureOrigin.x,e.clientY-gestureOrigin.y)>6)gestureMoved=true;
 const matrix=svg?.getScreenCTM();
 if(previous&&matrix&&gestureMoved){
  const inv=matrix.inverse(),dx=g.x-previous.x,dy=g.y-previous.y;
  view.x-=dx*inv.a+dy*inv.c;view.y-=dx*inv.b+dy*inv.d;draw();
  if(g.d&&previous.d)zoom(g.d/previous.d,g.x,g.y);
 }
 previous=g;
});
function endPointer(e,cancelled){
 if(!pointers.has(e.pointerId))return;
 const origin=gestureOrigin,wasMoved=gestureMoved;
 pointers.delete(e.pointerId);previous=gesture();
 try{if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId);}catch(_){}
 if(!pointers.size){
  stage.classList.remove('dragging');ignoreClickUntil=performance.now()+400;
  const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.chapter');
  if(!cancelled&&!wasMoved&&origin?.section!==null&&hit&&Number(hit.dataset.section)===origin.section)openDetails(origin.section);
  gestureOrigin=null;
 }
}
stage.addEventListener('pointerup',e=>endPointer(e,false));
stage.addEventListener('pointercancel',e=>{gestureMoved=true;endPointer(e,true);});
stage.addEventListener('lostpointercapture',e=>{if(pointers.has(e.pointerId)){pointers.delete(e.pointerId);previous=gesture();if(!pointers.size)stage.classList.remove('dragging');}});
stage.addEventListener('click',e=>{if(performance.now()<ignoreClickUntil)return;const c=e.target.closest('.chapter');if(c)openDetails(Number(c.dataset.section));});
stage.addEventListener('keydown',e=>{
 const c=e.target.closest('.chapter');
 if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDetails(Number(c.dataset.section));return;}
 if(e.key==='+'||e.key==='='){e.preventDefault();zoom(1.35);}else if(e.key==='-'){e.preventDefault();zoom(1/1.35);}else if(e.key==='0'){e.preventDefault();fit();}
 else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
  e.preventDefault();const s=view.w*.06;if(e.key==='ArrowLeft')view.x-=s;if(e.key==='ArrowRight')view.x+=s;if(e.key==='ArrowUp')view.y-=s;if(e.key==='ArrowDown')view.y+=s;draw();
 }
});
stage.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0014),e.clientX,e.clientY);},{passive:false});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&panelMode!=='closed'){e.preventDefault();closeDetails();}
 if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();openDetails(null,{focus:true});}
});
window.addEventListener('hashchange',()=>showFromHash(location.hash));
const initialHash=location.hash;configureDocument(0);if(initialHash)showFromHash(initialHash);

</script></body></html>
