el('matchCount').textContent=count+' tâche'+(count!==1?'s':'')+' affichée'+(count!==1?'s':'')+' · 630 au total';if(!count)container.append(node('div',{class:'empty',text:'Aucune tâche ne correspond aux filtres. Modifiez la recherche ou les filtres pour afficher des résultats.'}));}
function sHasInfo(s){return Boolean(s.notesHtml||s.tasks.length)}
function render(){nav();const target=el('mainArea');target.replaceChildren();target.append(node('div',{class:'print-head',text:'Fadi / Studio — STUDIO-TASKS-001'}));window.__searchInput=window.__searchInput||'';
if(chapter===0){el('crumb').textContent='Studio / Vue d’ensemble';renderOverview(target)}else{const p=DATA.find(x=>x.id===chapter);el('crumb').textContent=chapter===-1?'Studio / Toutes les tâches':'Studio / '+p.title;target.append(topHead('Checklist d’exécution · V1.1',chapter===-1?'Toutes les tâches':p.title,chapter===-1?'Vue transversale des 630 tâches.':p.count+' tâches à suivre · STUDIO-TASKS-001'));
if(p&&p.introHtml){let text=node('div',{class:'chapter-intro'});text.innerHTML=p.introHtml;target.append(text)}renderFilters(target);drawResults(el('results'))}
target.append(node('div',{class:'footnote',text:'Suivi local · Données initiales non vérifiées · Les cases cochées ne déclenchent aucune commande dans le dépôt, la CI ou la production.'}));refreshStats()}
function csvQuote(value){const s=String(value??'');return '"'+s.replaceAll('"','""')+'"'}
function download(filename,type,data){const blob=new Blob([data],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Fichier généré : '+filename)}
function exportJSON(){download('Fadi_Studio_Suivi_630_Taches.json','application/json;charset=utf-8',JSON.stringify({schema:'STUDIO-TASKS-001',version:2,exportedAt:new Date().toISOString(),tasks:Object.fromEntries(TASKS.map(t=>[t.id,get(t.id)]))},null,2))}
function exportCSV(){const columns=['id','chapitre','section','description','priorite','cochee','date_cloture','code_valide','date_code','review_chatgpt','date_review_chatgpt','review_admin','date_review_admin','etat_travail','perimetre','verdict_conformite','etat_test','responsable','dependances','issue_pr','composant','tests_associes','preuve','decision','notes'];let rows=[columns.map(csvQuote).join(';')];for(const t of TASKS){let r=get(t.id);rows.push([t.id,DATA[t.part-1].title,t.section,t.text,t.priority,r.checked?'oui':'non',r.date,r.codeDone?'oui':'non',r.codeDate,r.chatgptReviewed?'oui':'non',r.chatgptDate,r.adminReviewed?'oui':'non',r.adminDate,r.status,r.scope,r.verdict,r.testState,r.owner,r.deps||t.suggestedDeps,r.issue,r.component,r.tests,r.proof,r.decision,r.notes].map(csvQuote).join(';'))}download('Fadi_Studio_Suivi_630_Taches.csv','text/csv;charset=utf-8','\ufeff'+rows.join('\r\n'))}
function exportMarkdown(){let out=['# Fadi — Studio · Checklist d’exécution suivie','',`**Document :** STUDIO-TASKS-001 · Export du ${new Date().toLocaleString('fr-FR')}`,'','> Les cases cochées correspondent à une tâche clôturée dans ce suivi ; elles ne constituent pas une certification globale.',''];for(let p of DATA){out.push('## '+p.title,'');for(let sec of p.sections){out.push('### '+sec.title,'');for(const t of sec.tasks){let r=get(t.id);out.push('- ['+(r.checked?'x':' ')+'] **'+t.id+'** — '+t.text);
for(const stage of REVIEW_STAGES)out.push('  - ['+(r[stage.key]?'x':' ')+'] '+stage.label+(r[stage.dateKey]?' ('+r[stage.dateKey]+')':''));
let infos=[['État',r.status],['Périmètre',r.scope],['Verdict',r.verdict],['Test',r.testState],['Responsable',r.owner],['Dépendances',r.deps||t.suggestedDeps],['Issue/PR',r.issue],['Composant',r.component],['Tests associés',r.tests],['Preuve',r.proof],['Décision',r.decision],['Notes',r.notes],['Date clôture',r.date]].filter(([key,val])=>val&&!(key==='État'&&val==='À définir')&&!(key==='Périmètre'&&val==='Inclus')&&!(key==='Verdict'&&val==='Non évaluée')&&!(key==='Test'&&val==='Non exécuté'));for(const [k,v]of infos)out.push('  - '+k+' : '+String(v).replaceAll('\n',' | '));}out.push('')}}download('Fadi_Studio_Checklist_Suivie.md','text/markdown;charset=utf-8',out.join('\n'))}
async function importJSON(file){if(!file)return;let obj;try{obj=JSON.parse(await file.text())}catch(e){toast('Import impossible : JSON invalide.',true);return}if(!obj||obj.schema!=='STUDIO-TASKS-001'||!obj.tasks||typeof obj.tasks!=='object'||Array.isArray(obj.tasks)){toast('Import refusé : format STUDIO-TASKS-001 attendu.',true);return}let ids=Object.keys(obj.tasks).filter(id=>TASKMAP.has(id));if(!ids.length){toast('Aucun identifiant reconnu dans le fichier.',true);return}if(!confirm('Restaurer '+ids.length+' tâches depuis ce fichier ? Les entrées correspondantes de votre suivi actuel seront remplacées.'))return;for(const id of ids){let row=obj.tasks[id];if(!row||typeof row!=='object'||Array.isArray(row))continue;const clean={};for(const k of ['checked','status','scope','verdict','testState','owner','deps','issue','component','tests','proof','decision','notes','date','codeDone','codeDate','chatgptReviewed','chatgptDate','adminReviewed','adminDate']){if(!(k in row))continue;clean[k]=['checked','codeDone','chatgptReviewed','adminReviewed'].includes(k)?Boolean(row[k]):String(row[k]??'').slice(0,20000)}state[id]=sanitizeRow(clean)}save();render();toast(ids.length+' tâches restaurées depuis votre sauvegarde.')}
function setup(){load();el('exportJSON').addEventListener('click',exportJSON);el('exportCSV').addEventListener('click',exportCSV);el('exportMD').addEventListener('click',exportMarkdown);el('importFile').addEventListener('change',async e=>{await importJSON(e.target.files[0]);e.target.value=''});el('print').addEventListener('click',()=>window.print());el('allTasks').addEventListener('click',()=>navigate(-1));el('overview').addEventListener('click',()=>navigate(0));const deep=decodeURIComponent(location.hash.slice(1));let t=deep.startsWith('t-')?TASKMAP.get(deep.slice(2)):null;chapter=t?t.part:0;render();if(t){setTimeout(()=>{const e=document.getElementById('t-'+t.id);if(e){e.scrollIntoView();e.classList.add('active-detail')}},60)} }
setup();
})();
</script>
