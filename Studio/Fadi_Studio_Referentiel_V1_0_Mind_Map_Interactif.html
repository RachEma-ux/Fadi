<script id="documentsData" type="application/json">[{"key":"technique","source":"Fadi_Studio_Referentiel_Technique_Detaille_V1_0.docx","sha256":"98479152a8fd31b5871bc8bb3fe72aeeb5beb5929190b04a0e9ff167dbf91b5d","children":[{"label":"0. Statut, conventions et règles de lecture","children":[{"label":"0.1. Hiérarchie documentaire","children":[{"label":"Tableau — Niveau / Document / Portée et autorité","children":[{"label":"1 — Charte produit","children":[{"label":"Document : Définition officielle V2.1","kind":"text","id":"technique-0-0-0-0-0"},{"label":"Portée et autorité : Finalité, périmètre, quatre domaines, deux planches et invariants. Elle prévaut en cas de contradiction de principe.","kind":"text","id":"technique-0-0-0-0-1"}],"kind":"row","id":"technique-0-0-0-0"},{"label":"2 — Référentiel technique (présent document)","children":[{"label":"Document : STUDIO-RT-001","kind":"text","id":"technique-0-0-0-1-0"},{"label":"Portée et autorité : Obligations fonctionnelles et techniques proposées, modèles logiques, interfaces, critères d’acceptation et options explicitement ouvertes.","kind":"text","id":"technique-0-0-0-1-1"}],"kind":"row","id":"technique-0-0-0-1"},{"label":"3 — Dossier de validation","children":[{"label":"Document : Matrices et rapports à produire","kind":"text","id":"technique-0-0-0-2-0"},{"label":"Portée et autorité : Scénarios exécutés, métriques, preuves, conformité et décisions approuvées. Un test prescrit ne constitue pas une preuve d’exécution.","kind":"text","id":"technique-0-0-0-2-1"}],"kind":"row","id":"technique-0-0-0-2"},{"label":"Information non normative","children":[{"label":"Document : Audits du dépôt, benchmarks historiques","kind":"text","id":"technique-0-0-0-3-0"},{"label":"Portée et autorité : État observé sur un commit ; ne devient pas automatiquement une exigence ni une preuve de conformité de la cible.","kind":"text","id":"technique-0-0-0-3-1"}],"kind":"row","id":"technique-0-0-0-3"}],"kind":"table","block":"T016","id":"technique-0-0-0"},{"label":"Le présent document est la seule spécification technique de travail. Il ne crée pas de deuxième charte produit. Les divergences avec le niveau 1 sont consignées et arbitrées, sans modification silencieuse d’un principe. Les décisions non instruites restent ouvertes.","kind":"text","block":"P018","id":"technique-0-0-1"}],"kind":"section","source":"§ 0.1. Hiérarchie documentaire","block":"P015","id":"technique-0-0"},{"label":"0.2. Légende normative et identifiants","children":[{"label":"EX-xxx : exigence cible à vérifier ; « doit » exprime une obligation si la cible est approuvée, pas un constat de fonctionnalité déjà livrée.","kind":"text","block":"P020","id":"technique-0-1-0"},{"label":"INV-xxx : invariant de données ou de comportement à préserver à tout moment.","kind":"text","block":"P021","id":"technique-0-1-1"},{"label":"IF-xxx : contrat d’interface ou d’échange ; son format concret (REST, événement, interface TS) peut rester ouvert.","kind":"text","block":"P022","id":"technique-0-1-2"},{"label":"AC-xxx : critère d’acceptation observable ; son exécution future doit être documentée.","kind":"text","block":"P023","id":"technique-0-1-3"},{"label":"TEST-xxx : scénario reproductible à réaliser ; un résultat « prévu » n’est pas un résultat « réussi ».","kind":"text","block":"P024","id":"technique-0-1-4"},{"label":"DEC-xx : décision d’architecture ouverte, avec preuve ou arbitrage exigé.","kind":"text","block":"P025","id":"technique-0-1-5"},{"label":"OBS-xx : observation historique issue des sources ; non normative et à reverifier sur le commit de réalisation.","kind":"text","block":"P026","id":"technique-0-1-6"},{"label":"Statuts de vérification : non spécifié, à instruire, spécifié, implémenté non vérifié, vérifié conforme, partiellement conforme, défectueux, incompatible, non applicable justifié. Les statuts de conformité métier (conforme, non conforme, non testé, non applicable) restent différents des statuts d’exécution (en attente, en cours, échec, annulé).","kind":"text","block":"P027","id":"technique-0-1-7"},{"label":"Convention de seuil : un objectif chiffré inconnu est noté « à fixer après mesure », jamais remplacé par une valeur arbitraire. Les exemples de schémas ci-après sont des contrats logiques illustratifs, pas la description d’une API déjà implantée. Les unités sont explicites, les coordonnées possèdent un repère et une précision définis par contrat.","kind":"text","block":"P028","id":"technique-0-1-8"}],"kind":"section","source":"§ 0.2. Légende normative et identifiants","block":"P019","id":"technique-0-1"},{"label":"0.3. Critères de décision et portes de qualité","children":[{"label":"Porte G0 — cadrage : la charte produit est approuvée et les usages prioritaires sont identifiés. G1 — spécification : invariants, modèles, interfaces et risques critiques sont décrits. G2 — preuves : POC ciblés, tests de non-régression et mesures représentatives sont disponibles. G3 — architecture : arbitrages, migrations, dépendances et retour arrière sont décidés. G4 — livraison : la version testée satisfait les critères d’acceptation et possède une décision d’autorisation distincte.","kind":"text","block":"P030","id":"technique-0-2-0"},{"label":"Une validation de concept ne vaut ni acceptation d’un risque technique, ni autorisation de déploiement. Un résultat performant qui corrompt des références géométriques ou modifie le contenu approuvé est éliminatoire, même si la moyenne des mesures est favorable.","kind":"text","block":"P031","id":"technique-0-2-1"}],"kind":"section","source":"§ 0.3. Critères de décision et portes de qualité","block":"P029","id":"technique-0-2"}],"kind":"chapter","source":"§ 0. Statut, conventions et règles de lecture","block":"P014","id":"technique-0","number":"00","title":"Statut, conventions et règles de lecture","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#52647C","bullets":["Hiérarchie documentaire","Légende normative et identifiants","Critères de décision et portes de qualité","Exigences, contrats, tests et décisions identifiés","Une prescription de test n’est pas une preuve"]},{"label":"1. Périmètre du produit et architecture des domaines","children":[{"label":"1.1. Mission et autonomie","children":[{"label":"EX-001 — Autonomie native. Le Studio permet de créer, ouvrir, modifier, contrôler et documenter une étude rattachée à un projet Fadi sans suivre préalablement les 21 étapes du Parcours. Il réutilise les services généraux autorisés de Fadi plutôt que de créer une deuxième gestion d’utilisateurs, une deuxième base métier ou un deuxième annuaire de documents.","kind":"text","block":"P034","id":"technique-1-0-0"},{"label":"EX-002 — Périmètre. Les objets traités concernent la conception architecturale : dessin, modèles, BIM, rendu, métrés, coordination, observations, révisions et livrables. La comptabilité, la gestion RH, le commerce, la direction quotidienne des travaux, les réserves de chantier et l’exploitation restent hors responsabilité du Studio.","kind":"text","block":"P035","id":"technique-1-0-1"},{"label":"EX-003 — Contexte constant. Toute surface de travail ou action persistante porte les identifiants projectId, studyId, variantId et la version de base. Le projet et l’étude peuvent exister avant la première variante, mais aucune géométrie éditée ne doit être dépourvue de variante propriétaire.","kind":"text","block":"P036","id":"technique-1-0-2"}],"kind":"section","source":"§ 1.1. Mission et autonomie","block":"P033","id":"technique-1-0"},{"label":"1.2. Quatre domaines, deux planches, un workflow","children":[{"label":"Tableau — Domaine / Responsabilité propriétaire / Contenus produits / Frontière à ne pas franchir","children":[{"label":"D1 Dessin et modélisation","children":[{"label":"Responsabilité propriétaire : Création et modification du dessin 2D, de la géométrie 3D et des objets architecturaux.","kind":"text","id":"technique-1-1-0-0-0"},{"label":"Contenus produits : Dessins 2D indépendants, modèles 3D libres, objets associés, annotations de travail.","kind":"text","id":"technique-1-1-0-0-1"},{"label":"Frontière à ne pas franchir : Ne crée pas de copie BIM autoritaire ni une feuille d’impression considérée comme planche.","kind":"text","id":"technique-1-1-0-0-2"}],"kind":"row","id":"technique-1-1-0-0"},{"label":"D2 BIM et coordination","children":[{"label":"Responsabilité propriétaire : Propriétés techniques, classification, références, exigences, contrôles et constats.","kind":"text","id":"technique-1-1-0-1-0"},{"label":"Contenus produits : Données sémantiques, rapports, résultats de contrôle et observations identifiées.","kind":"text","id":"technique-1-1-0-1-1"},{"label":"Frontière à ne pas franchir : Ne devient pas un moteur géométrique concurrent.","kind":"text","id":"technique-1-1-0-1-2"}],"kind":"row","id":"technique-1-1-0-1"},{"label":"D3 Visualisation, rendu et immersion","children":[{"label":"Responsabilité propriétaire : Apparence, caméra, scène, éclairage, rendu et illustration.","kind":"text","id":"technique-1-1-0-2-0"},{"label":"Contenus produits : Configurations de présentation et médias versionnés.","kind":"text","id":"technique-1-1-0-2-1"},{"label":"Frontière à ne pas franchir : Ne déduit pas les dimensions ou propriétés constructives de pixels.","kind":"text","id":"technique-1-1-0-2-2"}],"kind":"row","id":"technique-1-1-0-2"},{"label":"D4 Documentation, métrés et collaboration","children":[{"label":"Responsabilité propriétaire : Vues, feuilles, dossiers, quantités, annotations, tâches, revues et publications.","kind":"text","id":"technique-1-1-0-3-0"},{"label":"Contenus produits : Livrables et décisions attachés à des sources.","kind":"text","id":"technique-1-1-0-3-1"},{"label":"Frontière à ne pas franchir : Ne modifie pas implicitement les objets architecturaux depuis des documents dérivés.","kind":"text","id":"technique-1-1-0-3-2"}],"kind":"row","id":"technique-1-1-0-3"}],"kind":"table","block":"T038","id":"technique-1-1-0"},{"label":"Les quatre domaines sont des responsabilités fonctionnelles, non quatre bases indépendantes. Un outil peut être invoqué de plusieurs endroits sans dupliquer son opération ni l’objet auquel elle s’applique.","kind":"text","block":"P040","id":"technique-1-1-1"},{"label":"EX-004 — Planche 2D. Éditeur autonome de géométries planes, côtes, contraintes, calques et annotations. Aucun modèle 3D n’est requis pour produire et publier un dessin indépendant.","kind":"text","block":"P041","id":"technique-1-1-2"},{"label":"EX-005 — Planche 3D. Éditeur autonome de géométries spatiales, faces, solides, groupes et objets architecturaux. Sa saisie n’exige pas d’esquisse 2D préalable ; ce n’est pas une simple visionneuse.","kind":"text","block":"P042","id":"technique-1-1-3"},{"label":"EX-006 — Conception associée. Les deux planches peuvent agir sur une même définition architecturale au moyen de commandes validées. Les trois relations — associé, référence liée, copie indépendante — sont visibles et explicites.","kind":"text","block":"P043","id":"technique-1-1-4"},{"label":"EX-007 — Workflow transversal. Le cycle Cadrer → Explorer → Concevoir → Contrôler → Coordonner et corriger → Approuver → Publier traverse les domaines sans devenir un cinquième module et sans remplacer le Parcours de Fadi.","kind":"text","block":"P044","id":"technique-1-1-5"}],"kind":"section","source":"§ 1.2. Quatre domaines, deux planches, un workflow","block":"P037","id":"technique-1-1"},{"label":"1.3. Intégration avec les modules Fadi","children":[{"label":"Tableau — Module Fadi / Fournit au Studio / Reçoit du Studio / Règle d’intégration","children":[{"label":"Projets et sources","children":[{"label":"Fournit au Studio : Projet, site, fichiers et références.","kind":"text","id":"technique-1-2-0-0-0"},{"label":"Reçoit du Studio : Références des études et livrables.","kind":"text","id":"technique-1-2-0-0-1"},{"label":"Règle d’intégration : Le Studio n’invente pas un projet parallèle.","kind":"text","id":"technique-1-2-0-0-2"}],"kind":"row","id":"technique-1-2-0-0"},{"label":"Parcours","children":[{"label":"Fournit au Studio : Contexte méthodologique facultatif.","kind":"text","id":"technique-1-2-0-1-0"},{"label":"Reçoit du Studio : Résultats exploitables par une étape, si demandés.","kind":"text","id":"technique-1-2-0-1-1"},{"label":"Règle d’intégration : Passage aux 21 étapes non obligatoire.","kind":"text","id":"technique-1-2-0-1-2"}],"kind":"row","id":"technique-1-2-0-1"},{"label":"Programmation","children":[{"label":"Fournit au Studio : Exigences, surfaces-cibles, versions.","kind":"text","id":"technique-1-2-0-2-0"},{"label":"Reçoit du Studio : Surfaces calculées et écarts sourcés.","kind":"text","id":"technique-1-2-0-2-1"},{"label":"Règle d’intégration : Une modification dessinée ne réécrit pas l’exigence.","kind":"text","id":"technique-1-2-0-2-2"}],"kind":"row","id":"technique-1-2-0-2"},{"label":"Analyses métier","children":[{"label":"Fournit au Studio : Règles de calcul, contrôles transverses.","kind":"text","id":"technique-1-2-0-3-0"},{"label":"Reçoit du Studio : Résultats identifiés et versions.","kind":"text","id":"technique-1-2-0-3-1"},{"label":"Règle d’intégration : Aucune seconde formule contradictoire.","kind":"text","id":"technique-1-2-0-3-2"}],"kind":"row","id":"technique-1-2-0-3"},{"label":"Documents","children":[{"label":"Fournit au Studio : Catalogue et stockage documentaire commun.","kind":"text","id":"technique-1-2-0-4-0"},{"label":"Reçoit du Studio : Vues, feuilles, fichiers et manifestes.","kind":"text","id":"technique-1-2-0-4-1"},{"label":"Règle d’intégration : Aucun export « orphelin ».","kind":"text","id":"technique-1-2-0-4-2"}],"kind":"row","id":"technique-1-2-0-4"},{"label":"Collaboration","children":[{"label":"Fournit au Studio : Comptes, autorisations, notifications, journaux.","kind":"text","id":"technique-1-2-0-5-0"},{"label":"Reçoit du Studio : Observations, tâches et décisions métier.","kind":"text","id":"technique-1-2-0-5-1"},{"label":"Règle d’intégration : Des droits Studio peuvent préciser, pas remplacer, les droits Fadi.","kind":"text","id":"technique-1-2-0-5-2"}],"kind":"row","id":"technique-1-2-0-5"}],"kind":"table","block":"T046","id":"technique-1-2-0"},{"label":"IF-001 — Interface de rattachement projet. Entrée : projet autorisé, site/sources/version, acteur ; sortie : contexte d’étude validé et identifiant stable. Échec : projet inaccessible, source non disponible, conflit de version, droits insuffisants. Le contrat physique demeure à choisir.","kind":"text","block":"P048","id":"technique-1-2-1"}],"kind":"section","source":"§ 1.3. Intégration avec les modules Fadi","block":"P045","id":"technique-1-2"},{"label":"1.4. Parcours métiers de référence","children":[{"label":"Tableau — Parcours / Déclencheur / Production minimale / Absence d’effet parasite","children":[{"label":"A — Dessin 2D indépendant","children":[{"label":"Déclencheur : Nouvelle étude / Planche 2D.","kind":"text","id":"technique-1-3-0-0-0"},{"label":"Production minimale : Géométrie, cote, texte, sauvegarde, vue et feuille.","kind":"text","id":"technique-1-3-0-0-1"},{"label":"Absence d’effet parasite : Aucun volume 3D fictif créé.","kind":"text","id":"technique-1-3-0-0-2"}],"kind":"row","id":"technique-1-3-0-0"},{"label":"B — Modélisation 3D indépendante","children":[{"label":"Déclencheur : Nouvelle étude / Planche 3D.","kind":"text","id":"technique-1-3-0-1-0"},{"label":"Production minimale : Arêtes/faces, extrusion, sauvegarde, coupe ou vue 2D dérivée.","kind":"text","id":"technique-1-3-0-1-1"},{"label":"Absence d’effet parasite : Aucune signification BIM implicite.","kind":"text","id":"technique-1-3-0-1-2"}],"kind":"row","id":"technique-1-3-0-1"},{"label":"C — Conception associée","children":[{"label":"Déclencheur : Création ou sélection d’un objet architectural.","kind":"text","id":"technique-1-3-0-2-0"},{"label":"Production minimale : Modification via 2D et 3D, métrés révisés, contrôle, observation et publication.","kind":"text","id":"technique-1-3-0-2-1"},{"label":"Absence d’effet parasite : Aucune copie concurrente de l’objet.","kind":"text","id":"technique-1-3-0-2-2"}],"kind":"row","id":"technique-1-3-0-2"}],"kind":"table","block":"T050","id":"technique-1-3-0"}],"kind":"section","source":"§ 1.4. Parcours métiers de référence","block":"P049","id":"technique-1-3"}],"kind":"chapter","source":"§ 1. Périmètre du produit et architecture des domaines","block":"P032","id":"technique-1","number":"01","title":"Périmètre du produit et architecture des domaines","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#52647C","bullets":["Mission et autonomie","Quatre domaines, deux planches, un workflow","Intégration avec les modules Fadi","Parcours métiers de référence","Autonomie sans passage obligatoire par le Parcours"]},{"label":"2. Architecture logique, responsabilités et flux","children":[{"label":"2.1. Décomposition en couches","children":[{"label":"Tableau — Couche / Responsabilité positive / Interdiction / limite","children":[{"label":"Interface Studio","children":[{"label":"Responsabilité positive : Quatre domaines, planches, panneaux et profils.","kind":"text","id":"technique-2-0-0-0-0"},{"label":"Interdiction / limite : Ne valide pas seule les opérations centrales.","kind":"text","id":"technique-2-0-0-0-1"}],"kind":"row","id":"technique-2-0-0-0"},{"label":"Tool Registry","children":[{"label":"Responsabilité positive : Métadonnées, contrats, versions, dépendances.","kind":"text","id":"technique-2-0-0-1-0"},{"label":"Interdiction / limite : Ne contient pas les objets métier ni la géométrie courante.","kind":"text","id":"technique-2-0-0-1-1"}],"kind":"row","id":"technique-2-0-0-1"},{"label":"Tool Manager","children":[{"label":"Responsabilité positive : Recherche, profil, activation, chargement, dispatch et cycle de vie.","kind":"text","id":"technique-2-0-0-2-0"},{"label":"Interdiction / limite : Ne reproduit ni le noyau de calcul ni le validateur métier.","kind":"text","id":"technique-2-0-0-2-1"}],"kind":"row","id":"technique-2-0-0-2"},{"label":"Machine d’outil","children":[{"label":"Responsabilité positive : Événements, étapes du geste, aperçu, intentions de commande.","kind":"text","id":"technique-2-0-0-3-0"},{"label":"Interdiction / limite : N’écrit pas directement dans la base et ne publie pas un état visuel comme modèle.","kind":"text","id":"technique-2-0-0-3-1"}],"kind":"row","id":"technique-2-0-0-3"},{"label":"Commandes et transactions","children":[{"label":"Responsabilité positive : Validation, permissions, idempotence, effets, version, historique.","kind":"text","id":"technique-2-0-0-4-0"},{"label":"Interdiction / limite : Aucun écrasement last-write-wins par défaut sur conflit.","kind":"text","id":"technique-2-0-0-4-1"}],"kind":"row","id":"technique-2-0-0-4"},{"label":"Modèles canoniques","children":[{"label":"Responsabilité positive : Dessin 2D, géométrie 3D, objets associés, contraintes et références.","kind":"text","id":"technique-2-0-0-5-0"},{"label":"Interdiction / limite : Ne dépendent pas du format de rendu.","kind":"text","id":"technique-2-0-0-5-1"}],"kind":"row","id":"technique-2-0-0-5"},{"label":"Projection de scène","children":[{"label":"Responsabilité positive : Géométrie visible, index, sélection, caches, invalidation.","kind":"text","id":"technique-2-0-0-6-0"},{"label":"Interdiction / limite : Reconstruisible ; jamais autorité métier.","kind":"text","id":"technique-2-0-0-6-1"}],"kind":"row","id":"technique-2-0-0-6"},{"label":"Moteurs","children":[{"label":"Responsabilité positive : Rendu, calcul, intersection, modélisation exacte et documentaire.","kind":"text","id":"technique-2-0-0-7-0"},{"label":"Interdiction / limite : Ne modifient pas seuls la définition architecturale.","kind":"text","id":"technique-2-0-0-7-1"}],"kind":"row","id":"technique-2-0-0-7"},{"label":"Services Fadi","children":[{"label":"Responsabilité positive : Persistance, droits, révisions, publications, collaboration.","kind":"text","id":"technique-2-0-0-8-0"},{"label":"Interdiction / limite : Ne considèrent pas un profil utilisateur comme une permission.","kind":"text","id":"technique-2-0-0-8-1"}],"kind":"row","id":"technique-2-0-0-8"},{"label":"Adaptateur MCP (facultatif)","children":[{"label":"Responsabilité positive : Traduction de demandes IA en intentions contrôlées.","kind":"text","id":"technique-2-0-0-9-0"},{"label":"Interdiction / limite : Pas d’aller-retour réseau par mouvement de pointeur.","kind":"text","id":"technique-2-0-0-9-1"}],"kind":"row","id":"technique-2-0-0-9"}],"kind":"table","block":"T054","id":"technique-2-0-0"},{"label":"EX-008 — Sens de dépendance. Les interfaces invoquent les capacités, les capacités produisent des intentions, les commandes autorisées modifient le modèle canonique, puis les projections dérivées se recalculent. Une modification de scène graphique ne crée pas un changement métier sans commande.","kind":"text","block":"P056","id":"technique-2-0-1"},{"label":"EX-009 — Propriété des données. Pour chaque classe d’information, un service logique propriétaire est désigné ; les interfaces des autres domaines consomment des références et appels de commande. Un modèle ne doit pas exister en deux exemplaires autoritaires simplement parce que deux planches l’affichent.","kind":"text","block":"P057","id":"technique-2-0-2"}],"kind":"section","source":"§ 2.1. Décomposition en couches","block":"P053","id":"technique-2-0"},{"label":"2.2. Flux interactif et flux lourd","children":[{"label":"IF-002 — Geste rapide (exemple Ligne). ① réception pointeur/clavier ; ② lecture de la projection/index correspondant à la révision active ; ③ calcul de snapping ; ④ affichage d’aperçu transitoire ; ⑤ confirmation ; ⑥ intention géométrique validée ; ⑦ commande idempotente ; ⑧ réponse acceptation/conflit/refus ; ⑨ invalidation limitée des données dérivées.","kind":"text","block":"P059","id":"technique-2-1-0"},{"label":"IF-003 — Calcul lourd (exemple booléen). ① collecte des paramètres ; ② capture immuable de l’identifiant de révision ; ③ soumission au gestionnaire de tâches ; ④ worker/WASM ou service serveur ; ⑤ retour résultat + révision source + métriques ; ⑥ vérification du contexte et des droits ; ⑦ engagement transactionnel explicite ; ⑧ mise à jour des projections. Un résultat ancien peut être conservé à titre historique, pas appliqué à une révision plus récente.","kind":"text","block":"P060","id":"technique-2-1-1"}],"kind":"section","source":"§ 2.2. Flux interactif et flux lourd","block":"P058","id":"technique-2-1"},{"label":"2.3. Modèle d’événement et d’invalidation","children":[{"label":"EX-010 — Événements d’effets. Chaque commande acceptée doit identifier autant que possible : objets créés, modifiés ou supprimés ; références/contraintes modifiées ; domaines dérivés invalidés ; révision de sortie et origine de la modification.","kind":"text","block":"P062","id":"technique-2-2-0"},{"label":"EX-011 — Actualisation. Les projections consomment ces effets pour régénérer la portée minimale correcte, avec possibilité de repli vers une reconstruction plus large si l’invalidation exacte n’est pas sûre. Une actualisation partielle erronée n’est jamais acceptée au nom des performances.","kind":"text","block":"P063","id":"technique-2-2-1"}],"kind":"section","source":"§ 2.3. Modèle d’événement et d’invalidation","block":"P061","id":"technique-2-2"},{"label":"2.4. Invariants de référence","children":[{"label":"Tableau — ID / Invariant testable","children":[{"label":"INV-001","children":[{"label":"Invariant testable : Une approbation référence exactement les éléments présentés à la décision.","kind":"text","id":"technique-2-3-0-0-0"}],"kind":"row","id":"technique-2-3-0-0"},{"label":"INV-002","children":[{"label":"Invariant testable : Une définition architecturale associée possède une autorité unique.","kind":"text","id":"technique-2-3-0-1-0"}],"kind":"row","id":"technique-2-3-0-1"},{"label":"INV-003","children":[{"label":"Invariant testable : Une copie indépendante ne propage pas vers son origine.","kind":"text","id":"technique-2-3-0-2-0"}],"kind":"row","id":"technique-2-3-0-2"},{"label":"INV-004","children":[{"label":"Invariant testable : Une exigence approuvée reste distincte du résultat de conception.","kind":"text","id":"technique-2-3-0-3-0"}],"kind":"row","id":"technique-2-3-0-3"},{"label":"INV-005","children":[{"label":"Invariant testable : Une opération rejetée ne modifie pas partiellement les données canoniques.","kind":"text","id":"technique-2-3-0-4-0"}],"kind":"row","id":"technique-2-3-0-4"},{"label":"INV-006","children":[{"label":"Invariant testable : Un résultat dérivé ancien est identifiable et n’écrase pas le résultat courant.","kind":"text","id":"technique-2-3-0-5-0"}],"kind":"row","id":"technique-2-3-0-5"},{"label":"INV-007","children":[{"label":"Invariant testable : Une optimisation préserve les résultats métier dans les tolérances déclarées.","kind":"text","id":"technique-2-3-0-6-0"}],"kind":"row","id":"technique-2-3-0-6"},{"label":"INV-008","children":[{"label":"Invariant testable : Un cache/index/projection est reconstruisible depuis la donnée de référence.","kind":"text","id":"technique-2-3-0-7-0"}],"kind":"row","id":"technique-2-3-0-7"},{"label":"INV-009","children":[{"label":"Invariant testable : Un profil personnalisé ne change ni données, ni droits, ni révision de conception.","kind":"text","id":"technique-2-3-0-8-0"}],"kind":"row","id":"technique-2-3-0-8"},{"label":"INV-010","children":[{"label":"Invariant testable : Une requête IA ou extension passe par les mêmes validations centrales qu’une action humaine.","kind":"text","id":"technique-2-3-0-9-0"}],"kind":"row","id":"technique-2-3-0-9"},{"label":"INV-011","children":[{"label":"Invariant testable : Les annulations concurrentes ne détruisent pas silencieusement le travail d’un autre acteur.","kind":"text","id":"technique-2-3-0-10-0"}],"kind":"row","id":"technique-2-3-0-10"},{"label":"INV-012","children":[{"label":"Invariant testable : Une publication antérieure n’est pas réécrite par la création d’une nouvelle publication.","kind":"text","id":"technique-2-3-0-11-0"}],"kind":"row","id":"technique-2-3-0-11"},{"label":"INV-013","children":[{"label":"Invariant testable : Une annotation référencée à une face modifiée est conservée avec correspondance vérifiée ou marquée « à résoudre ».","kind":"text","id":"technique-2-3-0-12-0"}],"kind":"row","id":"technique-2-3-0-12"},{"label":"INV-014","children":[{"label":"Invariant testable : Le mode hors connexion différencie travail local, confirmation serveur et droits à reverifier.","kind":"text","id":"technique-2-3-0-13-0"}],"kind":"row","id":"technique-2-3-0-13"},{"label":"INV-015","children":[{"label":"Invariant testable : Un outil masqué reste retrouvable s’il est autorisé, et n’est pas désinstallé implicitement.","kind":"text","id":"technique-2-3-0-14-0"}],"kind":"row","id":"technique-2-3-0-14"}],"kind":"table","block":"T065","id":"technique-2-3-0"},{"label":"Chaque invariant doit recevoir au moins un test positif, un test d’échec et un identifiant de preuve. La matrice du chapitre 20 en fixe les premières correspondances.","kind":"text","block":"P067","id":"technique-2-3-1"}],"kind":"section","source":"§ 2.4. Invariants de référence","block":"P064","id":"technique-2-3"}],"kind":"chapter","source":"§ 2. Architecture logique, responsabilités et flux","block":"P052","id":"technique-2","number":"02","title":"Architecture logique, responsabilités et flux","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#52647C","bullets":["Décomposition en couches","Flux interactif et flux lourd","Modèle d’événement et d’invalidation","Invariants de référence","Autorité des objets et projections séparées"]},{"label":"3. Modèle canonique et versionnement","children":[{"label":"3.1. Entités et identités","children":[{"label":"Les champs ci-dessous constituent un schéma logique minimal proposé. La forme physique, les index et le découpage SQL restent des choix à instruire (DEC-01 à DEC-03). Les identifiants sont stables dans leur espace de noms et jamais réutilisés à une autre fin.","kind":"text","block":"P070","id":"technique-3-0-0"},{"label":"Tableau — Entité / Champs logiques minimaux / Règles","children":[{"label":"Projet Fadi","children":[{"label":"Champs logiques minimaux : projectId, droits et sources.","kind":"text","id":"technique-3-0-1-0-0"},{"label":"Règles : Propriétaire de rattachement ; projet existant non dupliqué.","kind":"text","id":"technique-3-0-1-0-1"}],"kind":"row","id":"technique-3-0-1-0"},{"label":"Étude","children":[{"label":"Champs logiques minimaux : studyId, projectId, objet, sources, hypothèses, référents.","kind":"text","id":"technique-3-0-1-1-0"},{"label":"Règles : Peut être cadrée sans variante.","kind":"text","id":"technique-3-0-1-1-1"}],"kind":"row","id":"technique-3-0-1-1"},{"label":"Variante","children":[{"label":"Champs logiques minimaux : variantId, studyId, lignée éventuelle, nom, état courant.","kind":"text","id":"technique-3-0-1-2-0"},{"label":"Règles : Copie de variante = nouvelles identités, pas de propagation implicite.","kind":"text","id":"technique-3-0-1-2-1"}],"kind":"row","id":"technique-3-0-1-2"},{"label":"Révision","children":[{"label":"Champs logiques minimaux : revisionId, variantId, auteur, date, parents, références de contenus et empreintes.","kind":"text","id":"technique-3-0-1-3-0"},{"label":"Règles : Immuable une fois enregistrée comme référence.","kind":"text","id":"technique-3-0-1-3-1"}],"kind":"row","id":"technique-3-0-1-3"},{"label":"Objet géométrique 2D","children":[{"label":"Champs logiques minimaux : objectId, documentId, primitive, repère, contraintes, calque.","kind":"text","id":"technique-3-0-1-4-0"},{"label":"Règles : Peut exister sans objet 3D.","kind":"text","id":"technique-3-0-1-4-1"}],"kind":"row","id":"technique-3-0-1-4"},{"label":"Objet géométrique 3D","children":[{"label":"Champs logiques minimaux : objectId, modelId, représentation exacte ou paramétrique, repère.","kind":"text","id":"technique-3-0-1-5-0"},{"label":"Règles : Peut exister sans géométrie 2D source.","kind":"text","id":"technique-3-0-1-5-1"}],"kind":"row","id":"technique-3-0-1-5"},{"label":"Objet architectural","children":[{"label":"Champs logiques minimaux : objectId, type, paramètres, hôtes, relations, provenance.","kind":"text","id":"technique-3-0-1-6-0"},{"label":"Règles : Une définition partagée pour les planches associées.","kind":"text","id":"technique-3-0-1-6-1"}],"kind":"row","id":"technique-3-0-1-6"},{"label":"Association","children":[{"label":"Champs logiques minimaux : associationId, kind, source/cible, contraintes, état, provenance.","kind":"text","id":"technique-3-0-1-7-0"},{"label":"Règles : associated, linked-reference, independent-copy.","kind":"text","id":"technique-3-0-1-7-1"}],"kind":"row","id":"technique-3-0-1-7"},{"label":"Référence topologique","children":[{"label":"Champs logiques minimaux : topoRefId, source, rôle et critères de correspondance.","kind":"text","id":"technique-3-0-1-8-0"},{"label":"Règles : Ambiguïté explicite après modification géométrique.","kind":"text","id":"technique-3-0-1-8-1"}],"kind":"row","id":"technique-3-0-1-8"},{"label":"Vue et scène","children":[{"label":"Champs logiques minimaux : viewId, révisions sources, caméra/repère, styles, annotations propres.","kind":"text","id":"technique-3-0-1-9-0"},{"label":"Règles : Projection, pas autorité sur les objets sources.","kind":"text","id":"technique-3-0-1-9-1"}],"kind":"row","id":"technique-3-0-1-9"},{"label":"Exigence","children":[{"label":"Champs logiques minimaux : requirementId, contenu, unité, version, approbation éventuelle.","kind":"text","id":"technique-3-0-1-10-0"},{"label":"Règles : Indépendante des valeurs calculées.","kind":"text","id":"technique-3-0-1-10-1"}],"kind":"row","id":"technique-3-0-1-10"},{"label":"Constat/observation","children":[{"label":"Champs logiques minimaux : issueId, règles, source, objets, vue, auteur, état, liens de recontrôle.","kind":"text","id":"technique-3-0-1-11-0"},{"label":"Règles : Identité unique entre BIM et collaboration.","kind":"text","id":"technique-3-0-1-11-1"}],"kind":"row","id":"technique-3-0-1-11"},{"label":"Document/livrable","children":[{"label":"Champs logiques minimaux : documentId, format, source, version, méthode, stockage.","kind":"text","id":"technique-3-0-1-12-0"},{"label":"Règles : Version et état d’actualité identifiables.","kind":"text","id":"technique-3-0-1-12-1"}],"kind":"row","id":"technique-3-0-1-12"},{"label":"Publication","children":[{"label":"Champs logiques minimaux : publicationId, manifeste, empreintes, décisions, usage et statut de diffusion.","kind":"text","id":"technique-3-0-1-13-0"},{"label":"Règles : Ensemble figé et coordonné.","kind":"text","id":"technique-3-0-1-13-1"}],"kind":"row","id":"technique-3-0-1-13"},{"label":"Profil d’outils","children":[{"label":"Champs logiques minimaux : profileId, propriétaire, version, widgets, raccourcis, contexte.","kind":"text","id":"technique-3-0-1-14-0"},{"label":"Règles : Préférence indépendante des révisions métier.","kind":"text","id":"technique-3-0-1-14-1"}],"kind":"row","id":"technique-3-0-1-14"},{"label":"Déclaration d’outil","children":[{"label":"Champs logiques minimaux : toolId, version, contrats, dépendances, compatibilités.","kind":"text","id":"technique-3-0-1-15-0"},{"label":"Règles : Donnée de catalogue, distincte du code exécuté.","kind":"text","id":"technique-3-0-1-15-1"}],"kind":"row","id":"technique-3-0-1-15"},{"label":"Tâche de calcul","children":[{"label":"Champs logiques minimaux : jobId, nature, paramètres, révision source, état, résultat, métadonnées.","kind":"text","id":"technique-3-0-1-16-0"},{"label":"Règles : Résultat tardif marqué périmé si le contexte a changé.","kind":"text","id":"technique-3-0-1-16-1"}],"kind":"row","id":"technique-3-0-1-16"}],"kind":"table","block":"T071","id":"technique-3-0-1"}],"kind":"section","source":"§ 3.1. Entités et identités","block":"P069","id":"technique-3-0"},{"label":"3.2. Identité, appartenance et provenance","children":[{"label":"EX-012 — Immuabilité des révisions. Une révision de référence ne change pas rétroactivement lorsque la variante évolue. Une correction de contenu produit un nouvel état ; une annulation collaborative constitue elle-même une nouvelle opération vérifiée.","kind":"text","block":"P074","id":"technique-3-1-0"},{"label":"EX-013 — Clonage. Lors du clonage d’une variante, les objets issus de la copie sont identifiés dans la nouvelle variante ; leur provenance peut pointer vers leurs sources, sans établir une propagation automatique. Les composants partagés explicitement versionnés font l’objet d’un contrat de mise à jour séparé.","kind":"text","block":"P075","id":"technique-3-1-1"},{"label":"EX-014 — Provenance et unités. Chaque source externe porte auteur/fournisseur lorsqu’il est connu, format, horodatage, version, unités, repère, transformation, restrictions d’utilisation et empreinte du contenu si calculable.","kind":"text","block":"P076","id":"technique-3-1-2"},{"label":"EX-015 — Références topologiques. Le système ne reconstitue jamais une relation entre une cote et une face découpée sur la seule proximité spatiale si plusieurs cibles plausibles existent. Il la conserve avec correspondance démontrée ou signale une rupture à résoudre.","kind":"text","block":"P077","id":"technique-3-1-3"}],"kind":"section","source":"§ 3.2. Identité, appartenance et provenance","block":"P073","id":"technique-3-1"},{"label":"3.3. Autorité et actualité des contenus","children":[{"label":"Tableau — Contenu / Autorité / Conséquence en cas de modification","children":[{"label":"Dessin 2D indépendant","children":[{"label":"Autorité : Document 2D et primitives","kind":"text","id":"technique-3-2-0-0-0"},{"label":"Conséquence en cas de modification : Mise à jour des vues/feuilles qui le citent.","kind":"text","id":"technique-3-2-0-0-1"}],"kind":"row","id":"technique-3-2-0-0"},{"label":"Géométrie 3D libre","children":[{"label":"Autorité : Modèle 3D libre","kind":"text","id":"technique-3-2-0-1-0"},{"label":"Conséquence en cas de modification : Mise à jour des projections, mesures et exports qui en dépendent.","kind":"text","id":"technique-3-2-0-1-1"}],"kind":"row","id":"technique-3-2-0-1"},{"label":"Objet architectural associé","children":[{"label":"Autorité : Définition sémantique commune","kind":"text","id":"technique-3-2-0-2-0"},{"label":"Conséquence en cas de modification : Mise à jour 2D, 3D, BIM et métrés dépendants.","kind":"text","id":"technique-3-2-0-2-1"}],"kind":"row","id":"technique-3-2-0-2"},{"label":"Vue ou coupe dérivée","children":[{"label":"Autorité : Objets sources","kind":"text","id":"technique-3-2-0-3-0"},{"label":"Conséquence en cas de modification : Vue à recalculer ; annotations propres conservées.","kind":"text","id":"technique-3-2-0-3-1"}],"kind":"row","id":"technique-3-2-0-3"},{"label":"Matériau visuel","children":[{"label":"Autorité : Configuration de présentation","kind":"text","id":"technique-3-2-0-4-0"},{"label":"Conséquence en cas de modification : Aucune mutation de la composition constructive.","kind":"text","id":"technique-3-2-0-4-1"}],"kind":"row","id":"technique-3-2-0-4"},{"label":"Exigence programme","children":[{"label":"Autorité : Version de l’exigence","kind":"text","id":"technique-3-2-0-5-0"},{"label":"Conséquence en cas de modification : Écart visible ; le dessin ne la « corrige » pas.","kind":"text","id":"technique-3-2-0-5-1"}],"kind":"row","id":"technique-3-2-0-5"},{"label":"Publication","children":[{"label":"Autorité : Manifeste et décisions signées/traçables","kind":"text","id":"technique-3-2-0-6-0"},{"label":"Conséquence en cas de modification : Reste historique même si nouvelle révision apparaît.","kind":"text","id":"technique-3-2-0-6-1"}],"kind":"row","id":"technique-3-2-0-6"}],"kind":"table","block":"T079","id":"technique-3-2-0"},{"label":"EX-016 — Fraîcheur. Les contenus dérivés doivent afficher à jour pour révision R, à recalculer, en calcul, échec ou non applicable, selon leur contrat. « Dernière image produite » ne signifie pas nécessairement « état courant ».","kind":"text","block":"P081","id":"technique-3-2-1"}],"kind":"section","source":"§ 3.3. Autorité et actualité des contenus","block":"P078","id":"technique-3-2"},{"label":"3.4. Transactions et concurrence","children":[{"label":"IF-004 — Précondition de version. Toute intention qui modifie un objet en environnement collaboratif référence baseRevisionId et, lorsque nécessaire, les versions individuelles des objets et relations touchés. En cas de divergence incompatible : refus et proposition de résolution ou nouveau calcul sur la base courante.","kind":"text","block":"P083","id":"technique-3-3-0"},{"label":"EX-017 — Atomicité. Les modifications canoniques d’une même opération sont engagées ensemble ou pas du tout. Les rafraîchissements de cache peuvent être différés et signalés, mais ne constituent pas des modifications canoniques validées.","kind":"text","block":"P084","id":"technique-3-3-1"},{"label":"EX-018 — Idempotence. Une même commande répétée après une interruption, avec son requestId et le même périmètre, n’est pas appliquée deux fois. Une nouvelle commande distincte exige une nouvelle identité.","kind":"text","block":"P085","id":"technique-3-3-2"}],"kind":"section","source":"§ 3.4. Transactions et concurrence","block":"P082","id":"technique-3-3"},{"label":"3.5. Stockage physique et migration","children":[{"label":"Le modèle logique n’impose pas de multiplier les schémas SQL. Il est recommandé d’évaluer l’adaptation de PostgreSQL/PostGIS déjà présent, avec transaction côté serveur, index appropriés, tables de révisions et stockage de blobs référencés. Cette préférence est une hypothèse d’architecture : volume, migration, historisation et performance doivent être mesurés.","kind":"text","block":"P087","id":"technique-3-4-0"},{"label":"EX-019 — Évolutivité des schémas. Chaque document/commande persistant porte sa version de schéma. Toute migration doit fournir une transformation documentée, des tests aller-retour lorsque réalisables, une conservation des données inconnues ou un rapport des pertes, et un retour arrière ou une récupération explicitement prévue.","kind":"text","block":"P088","id":"technique-3-4-1"}],"kind":"section","source":"§ 3.5. Stockage physique et migration","block":"P086","id":"technique-3-4"}],"kind":"chapter","source":"§ 3. Modèle canonique et versionnement","block":"P068","id":"technique-3","number":"03","title":"Modèle canonique et versionnement","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#52647C","bullets":["Entités et identités","Identité, appartenance et provenance","Autorité et actualité des contenus","Transactions et concurrence","Stockage physique et migration"]},{"label":"4. Planche 2D, Planche 3D et associations","children":[{"label":"4.1. Contrats des deux éditeurs","children":[{"label":"Tableau — Capacité / Planche 2D / Planche 3D","children":[{"label":"Objets primaires","children":[{"label":"Planche 2D : Segments, courbes, régions, cotes, textes, calques.","kind":"text","id":"technique-4-0-0-0-0"},{"label":"Planche 3D : Sommets, arêtes, faces, volumes, groupes, composants.","kind":"text","id":"technique-4-0-0-0-1"}],"kind":"row","id":"technique-4-0-0-0"},{"label":"Saisie","children":[{"label":"Planche 2D : Coordonnées en plan, contraintes, guides, accrochage 2D.","kind":"text","id":"technique-4-0-0-1-0"},{"label":"Planche 3D : Repères 3D, axes, plans de construction, inférences.","kind":"text","id":"technique-4-0-0-1-1"}],"kind":"row","id":"technique-4-0-0-1"},{"label":"Sélection","children":[{"label":"Planche 2D : Cliquez/encadrez/filtrez et sélectionnez des primitives.","kind":"text","id":"technique-4-0-0-2-0"},{"label":"Planche 3D : Raycasting et sélection de géométrie spatiale et d’objets.","kind":"text","id":"technique-4-0-0-2-1"}],"kind":"row","id":"technique-4-0-0-2"},{"label":"Autonomie","children":[{"label":"Planche 2D : Document complet sans modèle 3D.","kind":"text","id":"technique-4-0-0-3-0"},{"label":"Planche 3D : Modèle complet sans dessin 2D préalable.","kind":"text","id":"technique-4-0-0-3-1"}],"kind":"row","id":"technique-4-0-0-3"},{"label":"Liaison","children":[{"label":"Planche 2D : Commandes vers les objets architecturaux associés.","kind":"text","id":"technique-4-0-0-4-0"},{"label":"Planche 3D : Commandes vers les mêmes objets et leurs dépendances.","kind":"text","id":"technique-4-0-0-4-1"}],"kind":"row","id":"technique-4-0-0-4"},{"label":"Sorties","children":[{"label":"Planche 2D : Vues de dessin, détails indépendants, plans annotés.","kind":"text","id":"technique-4-0-0-5-0"},{"label":"Planche 3D : Vues/coupes dérivées, rendus, maillages autorisés.","kind":"text","id":"technique-4-0-0-5-1"}],"kind":"row","id":"technique-4-0-0-5"},{"label":"Limite","children":[{"label":"Planche 2D : Un trait ne devient pas un mur automatiquement.","kind":"text","id":"technique-4-0-0-6-0"},{"label":"Planche 3D : Une forme libre ne devient pas un objet BIM automatiquement.","kind":"text","id":"technique-4-0-0-6-1"}],"kind":"row","id":"technique-4-0-0-6"}],"kind":"table","block":"T091","id":"technique-4-0-0"},{"label":"EX-020 — Indépendance forte. Un dessin 2D doit pouvoir être sérialisé, restauré, édité et exporté sans reconstruction d’un modèle 3D « de substitution ». Les extrusions ou transferts créent un objet 3D nouveau ou une association déclarée.","kind":"text","block":"P093","id":"technique-4-0-1"},{"label":"EX-021 — Correspondance explicite. Une commande sur un objet architectural depuis l’une des planches cible le même objectId et les mêmes relations. Les deux planches ne doivent pas maintenir leurs propres versions autoritaires du mur.","kind":"text","block":"P094","id":"technique-4-0-2"}],"kind":"section","source":"§ 4.1. Contrats des deux éditeurs","block":"P090","id":"technique-4-0"},{"label":"4.2. Types de transfert","children":[{"label":"Tableau — Type / Source d’autorité / Effet des modifications / Action utilisateur attendue","children":[{"label":"Associé","children":[{"label":"Source d’autorité : Objet canonique unique","kind":"text","id":"technique-4-1-0-0-0"},{"label":"Effet des modifications : Recalcul des vues dépendantes ; édition sous les contraintes communes.","kind":"text","id":"technique-4-1-0-0-1"},{"label":"Action utilisateur attendue : Association clairement indiquée.","kind":"text","id":"technique-4-1-0-0-2"}],"kind":"row","id":"technique-4-1-0-0"},{"label":"Référence liée","children":[{"label":"Source d’autorité : Contenu externe/interne source","kind":"text","id":"technique-4-1-0-1-0"},{"label":"Effet des modifications : La référence peut être rafraîchie après réception/acceptation de version.","kind":"text","id":"technique-4-1-0-1-1"},{"label":"Action utilisateur attendue : Choisir la version et le mode de mise à jour.","kind":"text","id":"technique-4-1-0-1-2"}],"kind":"row","id":"technique-4-1-0-1"},{"label":"Copie indépendante","children":[{"label":"Source d’autorité : Nouvelle copie","kind":"text","id":"technique-4-1-0-2-0"},{"label":"Effet des modifications : Aucun lien de modification, provenance seulement.","kind":"text","id":"technique-4-1-0-2-1"},{"label":"Action utilisateur attendue : Confirmation de la rupture.","kind":"text","id":"technique-4-1-0-2-2"}],"kind":"row","id":"technique-4-1-0-2"}],"kind":"table","block":"T096","id":"technique-4-1-0"},{"label":"EX-022 — Propagation limitée. Toute propagation est définie par le type d’association et la dépendance. L’extraction d’une coupe ne confère pas à ses segments le pouvoir universel de modifier le volume ; une cote associée ne modifie pas automatiquement sa cible.","kind":"text","block":"P098","id":"technique-4-1-1"}],"kind":"section","source":"§ 4.2. Types de transfert","block":"P095","id":"technique-4-1"},{"label":"4.3. Matrice d’opérations critiques","children":[{"label":"Tableau — Action / Écriture canonique / Invalidation et erreur à prévoir","children":[{"label":"Mur modifié en 2D","children":[{"label":"Écriture canonique : Paramètres de l’objet associé.","kind":"text","id":"technique-4-2-0-0-0"},{"label":"Invalidation et erreur à prévoir : 3D, métrés, dessins et contrôles dépendants ; incompatibilité d’ouverture à résoudre.","kind":"text","id":"technique-4-2-0-0-1"}],"kind":"row","id":"technique-4-2-0-0"},{"label":"Mur modifié en 3D","children":[{"label":"Écriture canonique : Même objet/paramètres.","kind":"text","id":"technique-4-2-0-1-0"},{"label":"Invalidation et erreur à prévoir : Plans, cotes et documents ; revalidation des contraintes.","kind":"text","id":"technique-4-2-0-1-1"}],"kind":"row","id":"technique-4-2-0-1"},{"label":"Profil 2D extrudé","children":[{"label":"Écriture canonique : Nouveau volume ou dépendance explicitement liée.","kind":"text","id":"technique-4-2-0-2-0"},{"label":"Invalidation et erreur à prévoir : Calcul de direction/hauteur ; aucune conversion implicite.","kind":"text","id":"technique-4-2-0-2-1"}],"kind":"row","id":"technique-4-2-0-2"},{"label":"Profil lié modifié","children":[{"label":"Écriture canonique : Profil propriétaire.","kind":"text","id":"technique-4-2-0-3-0"},{"label":"Invalidation et erreur à prévoir : Extrusion recalculée ou marquée invalide.","kind":"text","id":"technique-4-2-0-3-1"}],"kind":"row","id":"technique-4-2-0-3"},{"label":"Coupe 3D créée","children":[{"label":"Écriture canonique : Vue/document dérivé.","kind":"text","id":"technique-4-2-0-4-0"},{"label":"Invalidation et erreur à prévoir : Révision source, annotation indépendante et provenance.","kind":"text","id":"technique-4-2-0-4-1"}],"kind":"row","id":"technique-4-2-0-4"},{"label":"Copie détachée","children":[{"label":"Écriture canonique : Nouvel objet autonome.","kind":"text","id":"technique-4-2-0-5-0"},{"label":"Invalidation et erreur à prévoir : Aucune mise à jour par l’original.","kind":"text","id":"technique-4-2-0-5-1"}],"kind":"row","id":"technique-4-2-0-5"},{"label":"Cote sur face divisée","children":[{"label":"Écriture canonique : Cote et référence topologique.","kind":"text","id":"technique-4-2-0-6-0"},{"label":"Invalidation et erreur à prévoir : Correspondance testée ou statut « à résoudre ».","kind":"text","id":"technique-4-2-0-6-1"}],"kind":"row","id":"technique-4-2-0-6"},{"label":"Résultat de job périmé","children":[{"label":"Écriture canonique : Aucun remplacement silencieux du courant.","kind":"text","id":"technique-4-2-0-7-0"},{"label":"Invalidation et erreur à prévoir : Résultat lié à l’ancienne révision, relance proposée.","kind":"text","id":"technique-4-2-0-7-1"}],"kind":"row","id":"technique-4-2-0-7"}],"kind":"table","block":"T100","id":"technique-4-2-0"}],"kind":"section","source":"§ 4.3. Matrice d’opérations critiques","block":"P099","id":"technique-4-2"},{"label":"4.4. Précision, coordonnées et sélection","children":[{"label":"EX-023 — Repères et unités. Toute primitive possède un système de coordonnées identifiable : document 2D, local d’objet, système de projet et, le cas échéant, système géographique référencé. Les transformations sont versionnées et vérifiées, avec unités explicites ; la projection graphique en pixels ne constitue jamais l’unité de référence.","kind":"text","block":"P103","id":"technique-4-3-0"},{"label":"EX-024 — Gestes réversibles. Un geste peut afficher un aperçu approché sans écrire d’objet permanent. La confirmation produit une commande, soumise aux contrôles et à une restitution fidèle aux tolérances contractuelles ; annuler l’aperçu ne laisse aucune mutation canonique.","kind":"text","block":"P104","id":"technique-4-3-1"},{"label":"EX-025 — Accrochage stable. Les types d’accrochage, priorités, tolérances et règles de sélection sont définis par contexte. Une accélération spatiale ou une baisse des effets graphiques n’est pas autorisée à substituer silencieusement un point différent à celui du calcul de référence.","kind":"text","block":"P105","id":"technique-4-3-2"}],"kind":"section","source":"§ 4.4. Précision, coordonnées et sélection","block":"P102","id":"technique-4-3"},{"label":"4.5. Exemple : mur et ouverture (test de référence)","children":[{"label":"Mur de longueur 6,00 m, hauteur 3,00 m, épaisseur 0,20 m ; ouverture traversante de 1,00 × 2,10 m ; aucune autre déduction. Volume brut = 3,600 m³ ; déduction = 0,420 m³ ; volume net = 3,180 m³. L’ouverture passe ensuite à 1,20 m depuis l’autre planche : volume net attendu = 3,096 m³. La règle n’est qu’un cas d’essai géométrique simplifié, pas une méthode de métré universelle.","kind":"text","block":"P107","id":"technique-4-4-0"},{"label":"AC-001. Le objectId du mur reste stable ; l’ouverture reste reliée au bon hôte ; les deux planches reflètent la même définition ; les métrés sont mis à jour ou marqués périmés ; undo/redo et réouverture retrouvent les valeurs ; un dossier publié conserve la version examinée.","kind":"text","block":"P108","id":"technique-4-4-1"}],"kind":"section","source":"§ 4.5. Exemple : mur et ouverture (test de référence)","block":"P106","id":"technique-4-4"}],"kind":"chapter","source":"§ 4. Planche 2D, Planche 3D et associations","block":"P089","id":"technique-4","number":"04","title":"Planche 2D, Planche 3D et associations","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#176CAE","bullets":["Contrats des deux éditeurs","Types de transfert","Matrice d’opérations critiques","Précision, coordonnées et sélection","Exemple : mur et ouverture (test de référence)"]},{"label":"5. Tool Registry — spécification du catalogue","children":[{"label":"5.1. Mission et séparation des rôles","children":[{"label":"EX-026 — Registre. Le Tool Registry décrit les capacités activables, leurs contextes, versions, contrats, permissions et dépendances. Il est consultable sans télécharger tous les moteurs ni instancier leurs machines. Son manifeste léger est utilisable pour la recherche hors ligne.","kind":"text","block":"P111","id":"technique-5-0-0"},{"label":"EX-027 — Identifiants uniques. Les capacités portent des identifiants globalement non ambigus (studio.draw.line2d, studio.transform.scale, studio.arch.ladder). Une collision de noms d’affichage n’autorise pas une collision d’identifiants. Les renommages gardent les alias de migration documentés.","kind":"text","block":"P112","id":"technique-5-0-1"},{"label":"EX-028 — Validation à deux niveaux. Les métadonnées et le schéma peuvent être contrôlés au build ; chaque invocation effective fait l’objet des contrôles d’exécution, notamment permission, contexte, paramètres, quotas et révision.","kind":"text","block":"P113","id":"technique-5-0-2"}],"kind":"section","source":"§ 5.1. Mission et séparation des rôles","block":"P110","id":"technique-5-0"},{"label":"5.2. Champs du contrat d’outil","children":[{"label":"Tableau — Groupe / Champs / contraintes minimales","children":[{"label":"Identité","children":[{"label":"Champs / contraintes minimales : toolId stable, contractVersion, provider, domaine propriétaire, famille, libellés, synonymes.","kind":"text","id":"technique-5-1-0-0-0"}],"kind":"row","id":"technique-5-1-0-0"},{"label":"Portée","children":[{"label":"Champs / contraintes minimales : Planches compatibles, types d’objets, spécialités, formats, périmètre utilisateur/projet.","kind":"text","id":"technique-5-1-0-1-0"}],"kind":"row","id":"technique-5-1-0-1"},{"label":"Visibilité","children":[{"label":"Champs / contraintes minimales : Icône, groupe, raccourci par défaut, raccourcis en conflit, aide contextuelle.","kind":"text","id":"technique-5-1-0-2-0"}],"kind":"row","id":"technique-5-1-0-2"},{"label":"Permissions","children":[{"label":"Champs / contraintes minimales : Action métier précise, sujet autorisé, état requis, rôle/règle ; jamais confiance dans l’icône.","kind":"text","id":"technique-5-1-0-3-0"}],"kind":"row","id":"technique-5-1-0-3"},{"label":"Entrées","children":[{"label":"Champs / contraintes minimales : Schéma des paramètres, unités, repères, obligatoires, valeurs par défaut et provenance.","kind":"text","id":"technique-5-1-0-4-0"}],"kind":"row","id":"technique-5-1-0-4"},{"label":"Interaction","children":[{"label":"Champs / contraintes minimales : Machine d’état, événements, étapes, annulation, confirmations, saisie numérique.","kind":"text","id":"technique-5-1-0-5-0"}],"kind":"row","id":"technique-5-1-0-5"},{"label":"Preview","children":[{"label":"Champs / contraintes minimales : Type de prévisualisation, approximation permise, fidélité, retour d’erreur.","kind":"text","id":"technique-5-1-0-6-0"}],"kind":"row","id":"technique-5-1-0-6"},{"label":"Chargement","children":[{"label":"Champs / contraintes minimales : Loader identifié, dépendances partagées, facultatives, masses critiques, stratégie de cache.","kind":"text","id":"technique-5-1-0-7-0"}],"kind":"row","id":"technique-5-1-0-7"},{"label":"Exécution","children":[{"label":"Champs / contraintes minimales : Phases locales, workers, WASM, serveur ; tâches annulables, version des sources.","kind":"text","id":"technique-5-1-0-8-0"}],"kind":"row","id":"technique-5-1-0-8"},{"label":"Résultat","children":[{"label":"Champs / contraintes minimales : Commande(s) métier, modèle cible, effets et dépendances à invalider.","kind":"text","id":"technique-5-1-0-9-0"}],"kind":"row","id":"technique-5-1-0-9"},{"label":"Historique","children":[{"label":"Champs / contraintes minimales : Stratégie inverse/delta/snapshot et compatibilité de révisions.","kind":"text","id":"technique-5-1-0-10-0"}],"kind":"row","id":"technique-5-1-0-10"},{"label":"Résilience","children":[{"label":"Champs / contraintes minimales : Délais, relance, signalement, résultat périmé, absence de corruption partielle.","kind":"text","id":"technique-5-1-0-11-0"}],"kind":"row","id":"technique-5-1-0-11"},{"label":"Performance","children":[{"label":"Champs / contraintes minimales : Profil cible, mesures p50/p95/p99, mémoire, taille initiale, coût d’activation.","kind":"text","id":"technique-5-1-0-12-0"}],"kind":"row","id":"technique-5-1-0-12"},{"label":"Vérification","children":[{"label":"Champs / contraintes minimales : Tests unitaires, contractuels, d’intégrité, sécurité, accessibilité et non-régression.","kind":"text","id":"technique-5-1-0-13-0"}],"kind":"row","id":"technique-5-1-0-13"},{"label":"Gouvernance","children":[{"label":"Champs / contraintes minimales : État expérimental/autorisé/déprécié, support, migration et règles d’extension.","kind":"text","id":"technique-5-1-0-14-0"}],"kind":"row","id":"technique-5-1-0-14"}],"kind":"table","block":"T115","id":"technique-5-1-0"}],"kind":"section","source":"§ 5.2. Champs du contrat d’outil","block":"P114","id":"technique-5-1"},{"label":"5.3. Contrat de manifeste illustratif","children":[{"label":"{\n  \"toolId\": \"studio.draw.line2d\",\n  \"contractVersion\": \"1.0.0\",\n  \"ownerDomain\": \"drawing\",\n  \"contexts\": [\"planche2d\"],\n  \"permission\": \"design.geometry.write\",\n  \"inputSchemaRef\": \"schemas/line2d.v1\",\n  \"loaderId\": \"drawing-primitives-2d\",\n  \"sharedDependencies\": [\"geometry-core\", \"snapping-2d\"],\n  \"optionalDependencies\": [],\n  \"preview\": {\"mode\": \"local\", \"canonicalWrite\": false},\n  \"commandType\": \"drawing.createLine\",\n  \"offline\": {\"prepare\": true, \"commit\": \"sync-dependent\"},\n  \"qualityProfile\": \"interactive-2d\",\n  \"lifecycle\": \"approved-proposal\"\n}","kind":"code","block":"P118","id":"technique-5-2-0"},{"label":"Les noms de permission, chemins et états du fragment sont exemplaires et non implémentés. Ils doivent être alignés sur le système d’autorisations existant avant adoption. Le contrat n’embarque aucun code arbitraire exécuté sur la foi d’un simple manifeste.","kind":"text","block":"P119","id":"technique-5-2-1"}],"kind":"section","source":"§ 5.3. Contrat de manifeste illustratif","block":"P117","id":"technique-5-2"},{"label":"5.4. Qualité du registre et découverte","children":[{"label":"EX-029 — Recherche. Requête par nom, synonymes, famille, domaine, contexte et identifiant ; la recherche ne lance pas le moteur. Pour chaque outil, l’interface expose : découvert, non disponible, incompatible, interdit, non installé hors ligne, en chargement, prêt, erreur.","kind":"text","block":"P121","id":"technique-5-3-0"},{"label":"EX-030 — Versions. Un changement majeur du contrat exige un plan de compatibilité avec profils enregistrés, commandes hors ligne en attente et documents réouvrables. Un module marqué « déprécié » reste résoluble tant que sa présence est nécessaire à la lecture d’un travail existant, ou fournit une migration sûre.","kind":"text","block":"P122","id":"technique-5-3-1"},{"label":"EX-031 — Extensibilité sûre. La déclaration d’extension indique provenance, version, signature ou mécanisme de confiance choisi, permissions demandées, dépendances, mises à jour et support. « Trouvé dans le Registry » ne signifie pas « autorisé à charger/écrire ». Les extensions tierces restent une décision ouverte.","kind":"text","block":"P123","id":"technique-5-3-2"}],"kind":"section","source":"§ 5.4. Qualité du registre et découverte","block":"P120","id":"technique-5-3"}],"kind":"chapter","source":"§ 5. Tool Registry — spécification du catalogue","block":"P109","id":"technique-5","number":"05","title":"Tool Registry — spécification du catalogue","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#176CAE","bullets":["Mission et séparation des rôles","Champs du contrat d’outil","Contrat de manifeste illustratif","Qualité du registre et découverte","Contrats versionnés, métadonnées et dépendances"]},{"label":"6. Tool Manager — sélection, profils et ergonomie","children":[{"label":"6.1. Séparation gestion / exécution","children":[{"label":"EX-032 — Manager. Le Tool Manager construit les barres, réconcilie les préférences et le contexte, résout les loaders, active/désactive les machines d’outil et expédie les événements. Il n’effectue pas lui-même de booléens, de tessellation ou de validation canonique.","kind":"text","block":"P126","id":"technique-6-0-0"},{"label":"IF-005 — Cycle d’activation. découvert → vérification de contexte/droits → résolution des dépendances → chargement du code → initialisation → prêt → actif → suspendu/désactivé ; erreurs incompatible, permission refusée, hors ligne, échec de chargement, échec du noyau. La transition ne doit pas perdre un geste inachevé sans retour visible.","kind":"text","block":"P127","id":"technique-6-0-1"}],"kind":"section","source":"§ 6.1. Séparation gestion / exécution","block":"P125","id":"technique-6-0"},{"label":"6.2. Profils utilisateur","children":[{"label":"Tableau — Profil / Création / Règles","children":[{"label":"Standard Studio","children":[{"label":"Création : Fourni par Fadi.","kind":"text","id":"technique-6-1-0-0-0"},{"label":"Règles : Quatre domaines stables et commandes de base disponibles.","kind":"text","id":"technique-6-1-0-0-1"}],"kind":"row","id":"technique-6-1-0-0"},{"label":"Métier","children":[{"label":"Création : Préconfiguré par spécialité.","kind":"text","id":"technique-6-1-0-1-0"},{"label":"Règles : Sélection de capacités existantes, pas de nouvelles autorisations.","kind":"text","id":"technique-6-1-0-1-1"}],"kind":"row","id":"technique-6-1-0-1"},{"label":"Personnel","children":[{"label":"Création : Créé par l’utilisateur.","kind":"text","id":"technique-6-1-0-2-0"},{"label":"Règles : Favoris, groupes, barres, raccourcis et panneaux personnels.","kind":"text","id":"technique-6-1-0-2-1"}],"kind":"row","id":"technique-6-1-0-2"},{"label":"Équipe (option)","children":[{"label":"Création : Distribué avec droits de gestion.","kind":"text","id":"technique-6-1-0-3-0"},{"label":"Règles : Référence partageable, application volontaire ou administrée selon contrat, sans changement du modèle.","kind":"text","id":"technique-6-1-0-3-1"}],"kind":"row","id":"technique-6-1-0-3"}],"kind":"table","block":"T129","id":"technique-6-1-0"},{"label":"EX-033 — Personnalisation sûre. Retirer un bouton ne désinstalle ni l’outil ni les objets créés avec lui. Importer un profil ne confère pas de permissions. Le passage d’un profil à l’autre ne produit pas de révision du bâtiment.","kind":"text","block":"P131","id":"technique-6-1-1"},{"label":"EX-034 — Persistance des profils. Un profil possède profileId, propriétaire, version, ordre des capacités, raccourcis, visibilité, réglages et contexte. Les conflits de raccourcis sont détectés, explicités et résolus sans effacer la configuration source.","kind":"text","block":"P132","id":"technique-6-1-2"},{"label":"EX-035 — Commande de recherche. Le catalogue complet reste accessible indépendamment de la barre active. Un outil interdit ou incompatible peut être recherché à des fins d’information, mais n’est pas offert comme action exécutable.","kind":"text","block":"P133","id":"technique-6-1-3"}],"kind":"section","source":"§ 6.2. Profils utilisateur","block":"P128","id":"technique-6-1"},{"label":"6.3. Interaction clavier, stylet et mobile","children":[{"label":"EX-036 — Accessibilité. Chaque commande affichée possède un nom compréhensible, un état actif/chargement/interdit, un parcours clavier et un retour d’erreur. Les gestes impossibles au seul clavier possèdent un chemin alternatif adapté au contexte, à définir dans les spécifications UX. Le changement de focus entre Planche 2D et 3D est visible.","kind":"text","block":"P135","id":"technique-6-2-0"},{"label":"EX-037 — Continuité des gestes. La palette contextuelle ne doit pas perturber les séquences de dessin, la saisie numérique ni les modificateurs de contraintes. Les préférences de présentation sont distinctes des paramètres de géométrie enregistrés.","kind":"text","block":"P136","id":"technique-6-2-1"}],"kind":"section","source":"§ 6.3. Interaction clavier, stylet et mobile","block":"P134","id":"technique-6-2"},{"label":"6.4. Indicateurs d’usage","children":[{"label":"Les indicateurs pertinents sont : délai de première action, délai d’activation d’un outil favori, nombre de commandes recherchées, problèmes de raccourcis, succès des tâches représentatives et coût réseau/mémoire du profil. Les journaux ne doivent pas exposer le contenu confidentiel d’une étude sans nécessité et autorisation.","kind":"text","block":"P138","id":"technique-6-3-0"}],"kind":"section","source":"§ 6.4. Indicateurs d’usage","block":"P137","id":"technique-6-3"}],"kind":"chapter","source":"§ 6. Tool Manager — sélection, profils et ergonomie","block":"P124","id":"technique-6","number":"06","title":"Tool Manager — sélection, profils et ergonomie","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#176CAE","bullets":["Séparation gestion / exécution","Profils utilisateur","Interaction clavier, stylet et mobile","Indicateurs d’usage","Personnaliser ne modifie ni droits ni données"]},{"label":"7. Chargement modulaire, cache et mode hors connexion","children":[{"label":"7.1. Chargement en trois temps","children":[{"label":"EX-038 — Démarrage léger. À l’ouverture du Studio : interface minimale, identité/profil, contexte d’étude, métadonnées du registre et commandes essentielles. Aucune initialisation systématique de tous les outils spécialisés, d’OCCT, des moteurs 3D non sollicités ou de leurs workers.","kind":"text","block":"P141","id":"technique-7-0-0"},{"label":"EX-039 — Ouverture de planche. La première Planche 2D initialise uniquement les composants nécessaires à sa représentation et à ses commandes usuelles. La Planche 3D initialise son renderer et les machines utiles. Les deux peuvent cohabiter lorsque l’utilisateur les ouvre, sans forcer le téléchargement de tout le catalogue.","kind":"text","block":"P142","id":"technique-7-0-1"},{"label":"EX-040 — Activation rare. Une opération particulière déclenche le chargement de son module et de ses dépendances manquantes, puis conserve ou libère les ressources selon une politique documentée. Un moteur déjà initialisé et compatible ne doit pas être réinitialisé sans raison.","kind":"text","block":"P143","id":"technique-7-0-2"},{"label":"EX-041 — Partage de dépendances. Les modules d’outils mutualisent la géométrie fondamentale, les bibliothèques graphiques et les noyaux exacts. Un découpage en un fichier par bouton est interdit comme obligation universelle : la granularité est choisie à partir des coûts de chargement, des dépendances et du comportement réel de l’utilisateur.","kind":"text","block":"P144","id":"technique-7-0-3"},{"label":"Tableau — Moment / Autorisé par défaut / À éviter","children":[{"label":"Démarrage","children":[{"label":"Autorisé par défaut : Registre textuel léger et préférences.","kind":"text","id":"technique-7-0-4-0-0"},{"label":"À éviter : Import statique du code lourd non nécessaire.","kind":"text","id":"technique-7-0-4-0-1"}],"kind":"row","id":"technique-7-0-4-0"},{"label":"Ouvrir Planche 2D","children":[{"label":"Autorisé par défaut : Socle 2D, accrochage, outils favoris.","kind":"text","id":"technique-7-0-4-1-0"},{"label":"À éviter : Démarrage forcé de Three.js/OCCT si non employés.","kind":"text","id":"technique-7-0-4-1-1"}],"kind":"row","id":"technique-7-0-4-1"},{"label":"Ouvrir Planche 3D","children":[{"label":"Autorisé par défaut : Rendu, navigation, machines utilisées.","kind":"text","id":"technique-7-0-4-2-0"},{"label":"À éviter : Chargement du rendu de présentation et de toutes les spécialités.","kind":"text","id":"technique-7-0-4-2-1"}],"kind":"row","id":"technique-7-0-4-2"},{"label":"Activer outil lourd","children":[{"label":"Autorisé par défaut : Worker/WASM spécifique, après préconditions.","kind":"text","id":"technique-7-0-4-3-0"},{"label":"À éviter : Copies indépendantes du même noyau par outil.","kind":"text","id":"technique-7-0-4-3-1"}],"kind":"row","id":"technique-7-0-4-3"},{"label":"Devenir hors ligne","children":[{"label":"Autorisé par défaut : Contenu explicitement présent dans le cache.","kind":"text","id":"technique-7-0-4-4-0"},{"label":"À éviter : Promesse de disponibilité d’un outil non téléchargé.","kind":"text","id":"technique-7-0-4-4-1"}],"kind":"row","id":"technique-7-0-4-4"}],"kind":"table","block":"T145","id":"technique-7-0-4"}],"kind":"section","source":"§ 7.1. Chargement en trois temps","block":"P140","id":"technique-7-0"},{"label":"7.2. Politique du service worker et cache","children":[{"label":"EX-042 — Cache différencié. Le service worker gère séparément : (a) shell minimal, (b) ressources essentielles d’un profil, (c) modules facultatifs, (d) données métier et file de commandes. Le préchargement complet du build n’est pas considéré comme équivalent au chargement différé, même si le code n’est pas encore exécuté.","kind":"text","block":"P148","id":"technique-7-1-0"},{"label":"EX-043 — Offline véridique. Une capacité n’est annoncée utilisable hors réseau que si les modules, dépendances et données de référence indispensables sont présents et compatibles. Une action exigeant l’autorité centrale peut être préparée localement selon contrat, mais n’est jamais marquée « publiée/approuvée » avant validation centrale.","kind":"text","block":"P149","id":"technique-7-1-1"},{"label":"EX-044 — Versions du cache. Le système conserve la correspondance buildId ↔ toolContractVersion ↔ schemaVersion, protège les commandes en attente et évite qu’une mise à jour invalide une opération locale sans explication. Les politiques d’éviction doivent respecter les limites de quota et préserver prioritairement les données non synchronisées.","kind":"text","block":"P150","id":"technique-7-1-2"}],"kind":"section","source":"§ 7.2. Politique du service worker et cache","block":"P147","id":"technique-7-1"},{"label":"7.3. Éviction, mémoire et énergie","children":[{"label":"Les ressources peuvent être non téléchargées, téléchargées, en mémoire, initialisées, utilisées, inactives, libérées. Les conditions de libération comprennent inactivité, fermeture de vue, pression mémoire, changement de profil et fin de tâche. Un worker OCCT persistant est un coût mémoire distinct de sa taille compressée sur réseau ; il ne doit pas être multiplié par outil.","kind":"text","block":"P152","id":"technique-7-2-0"},{"label":"AC-002. Une barre contenant environ vingt outils de dessin usuels peut être ouverte sans initialiser tous les modules spécialisés. Le test compare les requêtes réseau, la taille transférée, les chunks exécutés et l’empreinte mémoire à une référence, en distinguant cache froid et chaud. Aucun taux de réduction n’est présumé avant mesure.","kind":"text","block":"P153","id":"technique-7-2-1"}],"kind":"section","source":"§ 7.3. Éviction, mémoire et énergie","block":"P151","id":"technique-7-2"}],"kind":"chapter","source":"§ 7. Chargement modulaire, cache et mode hors connexion","block":"P139","id":"technique-7","number":"07","title":"Chargement modulaire, cache et mode hors connexion","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#176CAE","bullets":["Chargement en trois temps","Politique du service worker et cache","Éviction, mémoire et énergie","Socle, outils courants, capacités spécialisées","Cache d’outils ≠ données métier"]},{"label":"8. Contrat des commandes, transactions, historique et collaboration","children":[{"label":"8.1. Enveloppe d’intention proposée","children":[{"label":"IF-006 — Commande métier. Le contrat de transport doit exprimer les attributs logiques suivants ; l’objet est une proposition de schéma et non une API actuellement exposée.","kind":"text","block":"P156","id":"technique-8-0-0"},{"label":"{\n  \"requestId\": \"idempotency-uuid\",\n  \"toolId\": \"studio.arch.wall\",\n  \"contractVersion\": \"1.0.0\",\n  \"actorId\": \"actor-ref\",\n  \"scope\": {\n    \"projectId\": \"p\", \"studyId\": \"s\", \"variantId\": \"v\",\n    \"baseRevisionId\": \"R12\"\n  },\n  \"targetIds\": [\"wall-42\"],\n  \"operation\": \"architecture.updateWall\",\n  \"parameters\": {\"height\": 3.0, \"unit\": \"m\"},\n  \"mode\": \"commit\"\n}","kind":"code","block":"P157","id":"technique-8-0-1"},{"label":"Le serveur établit lui-même l’identité authentifiée et vérifie sa concordance avec l’enveloppe ; un actorId fourni par le navigateur ne crée aucun droit. Les identifiants de contexte doivent être autorisés et la version de base vérifiée. Les coordonnées, tolérances et unités appartiennent au contrat de chaque opération.","kind":"text","block":"P158","id":"technique-8-0-2"}],"kind":"section","source":"§ 8.1. Enveloppe d’intention proposée","block":"P155","id":"technique-8-0"},{"label":"8.2. Résultat d’opération et refus","children":[{"label":"Tableau — Issue / Données de retour exigées / Effet autorisé","children":[{"label":"accepted","children":[{"label":"Données de retour exigées : Révision issue, objets affectés, effets métier, référence d’historique.","kind":"text","id":"technique-8-1-0-0-0"},{"label":"Effet autorisé : Actualiser la projection et les contenus dépendants.","kind":"text","id":"technique-8-1-0-0-1"}],"kind":"row","id":"technique-8-1-0-0"},{"label":"rejected","children":[{"label":"Données de retour exigées : Code, validation échouée, détail utile et non sensible.","kind":"text","id":"technique-8-1-0-1-0"},{"label":"Effet autorisé : Aucune mutation canonique.","kind":"text","id":"technique-8-1-0-1-1"}],"kind":"row","id":"technique-8-1-0-1"},{"label":"conflict","children":[{"label":"Données de retour exigées : Révision courante, objets divergents, motif, option de résolution.","kind":"text","id":"technique-8-1-0-2-0"},{"label":"Effet autorisé : Aucun écrasement automatique.","kind":"text","id":"technique-8-1-0-2-1"}],"kind":"row","id":"technique-8-1-0-2"},{"label":"pending","children":[{"label":"Données de retour exigées : Job, source, état, annulation et mode de récupération.","kind":"text","id":"technique-8-1-0-3-0"},{"label":"Effet autorisé : Aucun statut de réussite anticipé.","kind":"text","id":"technique-8-1-0-3-1"}],"kind":"row","id":"technique-8-1-0-3"},{"label":"duplicate","children":[{"label":"Données de retour exigées : Référence au premier résultat d’un même requestId.","kind":"text","id":"technique-8-1-0-4-0"},{"label":"Effet autorisé : Aucune deuxième application.","kind":"text","id":"technique-8-1-0-4-1"}],"kind":"row","id":"technique-8-1-0-4"}],"kind":"table","block":"T160","id":"technique-8-1-0"},{"label":"EX-045 — Prévisualisation distincte. Un appel d’essai ne produit pas de mutation permanente. La réponse peut fournir géométrie, contraintes et avertissements, avec portée de validité de révision. Un calcul prévisualisé et non confirmé est révoqué sans effets de référence.","kind":"text","block":"P162","id":"technique-8-1-1"},{"label":"EX-046 — Journal d’audit. Les engagements persistants exposent qui a demandé, sur quoi, quand, à partir de quelle révision, avec quel résultat et quelles identités touchées. Les événements sensibles suivent une politique de minimisation et de conservation explicite.","kind":"text","block":"P163","id":"technique-8-1-2"}],"kind":"section","source":"§ 8.2. Résultat d’opération et refus","block":"P159","id":"technique-8-1"},{"label":"8.3. Annulation et rétablissement","children":[{"label":"EX-047 — Historique hybride. Le Studio conserve les mécanismes éprouvés de Fadi lorsque l’audit démontre leur adéquation : commandes métier, deltas de Planche, états immuables/instantanés locaux. Les inverses, deltas et snapshots sont choisis selon exactitude, volume mémoire et concurrence ; aucune promesse générale d’annulation en O(1) n’est émise.","kind":"text","block":"P165","id":"technique-8-2-0"},{"label":"EX-048 — Annulation collaborative. Annuler une commande acceptée peut nécessiter une nouvelle commande inverse sur la révision actuelle. Le serveur revalide les objets modifiés entre-temps ; l’historique ou la publication précédente n’est pas réécrit.","kind":"text","block":"P166","id":"technique-8-2-1"},{"label":"EX-049 — Reprise de session. Au retour après interruption, l’interface distingue opérations confirmées, en attente de synchronisation, rejetées/conflictuelles, prévisualisations abandonnées. Les opérations locales possèdent une identité de déduplication et une version de contrat compatibles avec la file de synchronisation.","kind":"text","block":"P167","id":"technique-8-2-2"}],"kind":"section","source":"§ 8.3. Annulation et rétablissement","block":"P164","id":"technique-8-2"},{"label":"8.4. Contraintes et erreurs métier","children":[{"label":"Pour une modification de mur, la validation porte notamment sur l’épaisseur et son axe de référence, la hauteur/rattachement vertical, les hôtes et ouvertures, les jonctions, le maintien des identités, les contraintes de pièces et les cotations associées. Un objet dépendant devenu incompatible engendre soit un rejet atomique soit une résolution explicite par utilisateur autorisé, jamais une suppression silencieuse.","kind":"text","block":"P169","id":"technique-8-3-0"},{"label":"AC-003. Deux utilisateurs modifiant un mur de manière incompatible obtiennent un conflit traçable, une révision de référence préservée et aucune application implicite du dernier enregistrement. La restauration fonctionne après coupure simulée sans duplication de la commande.","kind":"text","block":"P170","id":"technique-8-3-1"}],"kind":"section","source":"§ 8.4. Contraintes et erreurs métier","block":"P168","id":"technique-8-3"}],"kind":"chapter","source":"§ 8. Contrat des commandes, transactions, historique et collaboration","block":"P154","id":"technique-8","number":"08","title":"Contrat des commandes, transactions, historique et collaboration","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#52647C","bullets":["Enveloppe d’intention proposée","Résultat d’opération et refus","Annulation et rétablissement","Contraintes et erreurs métier","Préconditions de révision et idempotence"]},{"label":"9. Projection de scène, invalidation et indexation spatiale","children":[{"label":"9.1. Frontière canonique / représentation","children":[{"label":"EX-050 — Projection reconstructible. La scène de chaque planche contient uniquement des données dérivées : traces visibles, maillages, positions GPU, styles de sélection, poignées, boîtes englobantes et index. Les identités des objets canoniques sont conservées dans une table de correspondance stable, y compris lorsque plusieurs objets partagent un lot de rendu.","kind":"text","block":"P173","id":"technique-9-0-0"},{"label":"EX-051 — Projection en état identifié. La projection affiche son sourceRevisionId et les domaines de données périmées. Une modification de géométrie acceptée invalide les dépendances graphiques correspondantes ; un résultat de worker calculé sur une autre révision ne peut la modifier comme s’il était courant.","kind":"text","block":"P174","id":"technique-9-0-1"}],"kind":"section","source":"§ 9.1. Frontière canonique / représentation","block":"P172","id":"technique-9-0"},{"label":"9.2. Stratégie d’invalidation","children":[{"label":"Tableau — Événement / Travail requis / Recalcul inutile à éviter","children":[{"label":"Orbit, pan, zoom","children":[{"label":"Travail requis : Mise à jour caméra, repères écran, rendu.","kind":"text","id":"technique-9-1-0-0-0"},{"label":"Recalcul inutile à éviter : Recalcul de tous les solides.","kind":"text","id":"technique-9-1-0-0-1"}],"kind":"row","id":"technique-9-1-0-0"},{"label":"Sélection/survol","children":[{"label":"Travail requis : Surimpression et informations contextuelles.","kind":"text","id":"technique-9-1-0-1-0"},{"label":"Recalcul inutile à éviter : Réassemblage des maillages canoniques.","kind":"text","id":"technique-9-1-0-1-1"}],"kind":"row","id":"technique-9-1-0-1"},{"label":"Ligne 2D créée","children":[{"label":"Travail requis : Mise à jour primitive, index local, cotes dépendantes.","kind":"text","id":"technique-9-1-0-2-0"},{"label":"Recalcul inutile à éviter : Régénération de toutes les feuilles.","kind":"text","id":"technique-9-1-0-2-1"}],"kind":"row","id":"technique-9-1-0-2"},{"label":"Porte déplacée","children":[{"label":"Travail requis : Porte, mur hôte et relations/coupes/métrés affectés.","kind":"text","id":"technique-9-1-0-3-0"},{"label":"Recalcul inutile à éviter : Reconstruction des niveaux non touchés.","kind":"text","id":"technique-9-1-0-3-1"}],"kind":"row","id":"technique-9-1-0-3"},{"label":"Style de présentation","children":[{"label":"Travail requis : Lots ou attributs graphiques affecté
