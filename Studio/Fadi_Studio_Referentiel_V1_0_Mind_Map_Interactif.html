:"technique-20-1-1-12-3"}],"kind":"row","id":"technique-20-1-1-12"},{"label":"EX-083–086","children":[{"label":"Objet : Workflow, rôles et observations.","kind":"text","id":"technique-20-1-1-13-0"},{"label":"Composants Fadi candidats : Collaboration et API.","kind":"text","id":"technique-20-1-1-13-1"},{"label":"Tests : 018, 029–031.","kind":"text","id":"technique-20-1-1-13-2"},{"label":"Décision : DEC-16.","kind":"text","id":"technique-20-1-1-13-3"}],"kind":"row","id":"technique-20-1-1-13"},{"label":"EX-087–096","children":[{"label":"Objet : API, sécurité, migration, récupération.","kind":"text","id":"technique-20-1-1-14-0"},{"label":"Composants Fadi candidats : apps/api, Docker, workflows CI et sauvegardes.","kind":"text","id":"technique-20-1-1-14-1"},{"label":"Tests : 013, 034–036.","kind":"text","id":"technique-20-1-1-14-2"},{"label":"Décision : DEC-03/18.","kind":"text","id":"technique-20-1-1-14-3"}],"kind":"row","id":"technique-20-1-1-14"},{"label":"EX-097–101","children":[{"label":"Objet : Benchmarks et preuves.","kind":"text","id":"technique-20-1-1-15-0"},{"label":"Composants Fadi candidats : scripts/bench, CI, tests du dépôt.","kind":"text","id":"technique-20-1-1-15-1"},{"label":"Tests : 022–025, 037.","kind":"text","id":"technique-20-1-1-15-2"},{"label":"Décision : DEC-13.","kind":"text","id":"technique-20-1-1-15-3"}],"kind":"row","id":"technique-20-1-1-15"}],"kind":"table","block":"T336","id":"technique-20-1-1"},{"label":"EX-103 — Couverture des preuves. Aucune exigence critique n’est marquée conforme si l’un des champs test, résultat, build, preuve ou décision applicable est absent. Les exceptions sont documentées comme non applicables avec justification vérifiable.","kind":"text","block":"P338","id":"technique-20-1-2"}],"kind":"section","source":"§ 20.2. Matrice initiale de correspondance","block":"P334","id":"technique-20-1"},{"label":"20.3. Structure des décisions d’architecture (ADR)","children":[{"label":"Une fiche décision contient : ADR-ID, problème, contexte et sources, exigence/risque, alternatives, critères éliminatoires, comparaison, mesures, conséquence données/sécurité, décision proposée, approbateur habilité, date, effets sur la migration, stratégie de retour arrière et réévaluation. Une décision ouverte n’est pas un choix provisoirement implémenté par défaut.","kind":"text","block":"P340","id":"technique-20-2-0"},{"label":"EX-104 — Auditabilité. La matrice doit permettre de remonter d’un défaut observé au test, au composant, à l’exigence et au principe produit ; inversement, elle doit montrer pour chaque principe les composants candidats et preuves correspondants.","kind":"text","block":"P341","id":"technique-20-2-1"}],"kind":"section","source":"§ 20.3. Structure des décisions d’architecture (ADR)","block":"P339","id":"technique-20-2"}],"kind":"chapter","source":"§ 20. Traçabilité bidirectionnelle des exigences et décisions","block":"P329","id":"technique-20","number":"20","title":"Traçabilité bidirectionnelle des exigences et décisions","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#52647C","bullets":["Modèle du registre de traçabilité","Matrice initiale de correspondance","Structure des décisions d’architecture (ADR)","Exigence ↔ contrat ↔ composant ↔ test ↔ preuve","Une correspondance n’est pas une conformité"]},{"label":"21. Analyse d’écarts, migration et plan de réalisation conditionnel","children":[{"label":"21.1. Étapes de décision","children":[{"label":"Étape A — Cible indépendante de l’existant. Valider domaines, deux planches, sources de vérité, contrats, profils et invariants sans dégrader la cible en fonction de la forme actuelle du code.","kind":"text","block":"P344","id":"technique-21-0-0"},{"label":"Étape B — Audit versionné. Examiner le dépôt sur le commit retenu ; constater comportements, tests réellement exécutés, imports/bundles, transactions, caches, workers, données historiques et installations. Classer chaque exigence : conforme vérifié, partiel, défectueux, incompatible, absent, non vérifié.","kind":"text","block":"P345","id":"technique-21-0-1"},{"label":"Étape C — Consolidation. Qualifier les écarts et traitements possibles : conserver, compléter, corriger, isoler, remplacer ou retirer. Rattacher tests et preuves, risques et coûts, dépendances et migrations.","kind":"text","block":"P346","id":"technique-21-0-2"},{"label":"Étape D — Architecture autorisée. Décider composants retenus, interfaces, pilotes techniques, jalons de livraison, migrations, tests de bascule et rollback. Un POC approuvé n’autorise pas la mise en œuvre générale.","kind":"text","block":"P347","id":"technique-21-0-3"}],"kind":"section","source":"§ 21.1. Étapes de décision","block":"P343","id":"technique-21-0"},{"label":"21.2. Lots conditionnels et dépendances","children":[{"label":"Tableau — Priorité indicative / Lot / Résultat exigé avant acceptation","children":[{"label":"P0 / A","children":[{"label":"Lot : Modèles indépendants, associés, identité, propagation et transactions.","kind":"text","id":"technique-21-1-0-0-0"},{"label":"Résultat exigé avant acceptation : Trois parcours 2D/3D/associé sans double autorité.","kind":"text","id":"technique-21-1-0-0-1"}],"kind":"row","id":"technique-21-1-0-0"},{"label":"P0 / B","children":[{"label":"Lot : Registry, Manager, profils, chargement réel et cache cohérent.","kind":"text","id":"technique-21-1-0-1-0"},{"label":"Résultat exigé avant acceptation : Outils favoris accessibles sans tous les moteurs spécialisés.","kind":"text","id":"technique-21-1-0-1-1"}],"kind":"row","id":"technique-21-1-0-1"},{"label":"P0 transversal","children":[{"label":"Lot : Corpus, instrumentation et tests de non-régression.","kind":"text","id":"technique-21-1-0-2-0"},{"label":"Résultat exigé avant acceptation : Mesures de référence et critères vérifiables avant optimisation.","kind":"text","id":"technique-21-1-0-2-1"}],"kind":"row","id":"technique-21-1-0-2"},{"label":"P1 / C","children":[{"label":"Lot : Index spatial et projection de scène incrémentale.","kind":"text","id":"technique-21-1-0-3-0"},{"label":"Résultat exigé avant acceptation : Sélections exactes et réduction mesurée du coût sur scènes concernées.","kind":"text","id":"technique-21-1-0-3-1"}],"kind":"row","id":"technique-21-1-0-3"},{"label":"P1 / D","children":[{"label":"Lot : Workers, gestion de mémoire, tâches, invalidations et résilience.","kind":"text","id":"technique-21-1-0-4-0"},{"label":"Résultat exigé avant acceptation : Échec/reprise sans corruption ni fuite détectée selon critères retenus.","kind":"text","id":"technique-21-1-0-4-1"}],"kind":"row","id":"technique-21-1-0-4"},{"label":"P1 / E","children":[{"label":"Lot : BIM, documentation, métrés, contrôles et workflow.","kind":"text","id":"technique-21-1-0-5-0"},{"label":"Résultat exigé avant acceptation : Dossier cohérent approuvé et publié sur versions coordonnées.","kind":"text","id":"technique-21-1-0-5-1"}],"kind":"row","id":"technique-21-1-0-5"},{"label":"P2 / F","children":[{"label":"Lot : Rendu alternatif, accélérations supplémentaires, extensions/MCP si validés.","kind":"text","id":"technique-21-1-0-6-0"},{"label":"Résultat exigé avant acceptation : Mesures positives et respect intégral des permissions.","kind":"text","id":"technique-21-1-0-6-1"}],"kind":"row","id":"technique-21-1-0-6"}],"kind":"table","block":"T349","id":"technique-21-1-0"},{"label":"Les lots ne créent pas de droit d’implémentation. Chaque lot dépend de critères et d’une autorisation explicite. Un composant conforme n’est pas réécrit sans bénéfice prouvé.","kind":"text","block":"P351","id":"technique-21-1-1"}],"kind":"section","source":"§ 21.2. Lots conditionnels et dépendances","block":"P348","id":"technique-21-1"},{"label":"21.3. Principaux risques de livraison","children":[{"label":"Tableau — Risque / Gravité initiale / Mesure de maîtrise","children":[{"label":"RISK-01 — Double autorité 2D/3D","children":[{"label":"Gravité initiale : Critique","kind":"text","id":"technique-21-2-0-0-0"},{"label":"Mesure de maîtrise : Protocole d’associations, objets canoniques, tests 001–010.","kind":"text","id":"technique-21-2-0-0-1"}],"kind":"row","id":"technique-21-2-0-0"},{"label":"RISK-02 — Snapping différent après indexation","children":[{"label":"Gravité initiale : Critique","kind":"text","id":"technique-21-2-0-1-0"},{"label":"Mesure de maîtrise : Oracle de géométrie + tests densité et ambiguïtés.","kind":"text","id":"technique-21-2-0-1-1"}],"kind":"row","id":"technique-21-2-0-1"},{"label":"RISK-03 — Commande rejouée ou conflit perdu","children":[{"label":"Gravité initiale : Critique","kind":"text","id":"technique-21-2-0-2-0"},{"label":"Mesure de maîtrise : Idempotence, transaction et E2E concurrent.","kind":"text","id":"technique-21-2-0-2-1"}],"kind":"row","id":"technique-21-2-0-2"},{"label":"RISK-04 — Publication sur mauvais contenu","children":[{"label":"Gravité initiale : Critique","kind":"text","id":"technique-21-2-0-3-0"},{"label":"Mesure de maîtrise : Manifeste immuable, empreintes, garde d’approbation.","kind":"text","id":"technique-21-2-0-3-1"}],"kind":"row","id":"technique-21-2-0-3"},{"label":"RISK-05 — Profil personnalisable mais tous moteurs chargés","children":[{"label":"Gravité initiale : Élevée","kind":"text","id":"technique-21-2-0-4-0"},{"label":"Mesure de maîtrise : Contrôle bundles/service worker et mesure cache froid.","kind":"text","id":"technique-21-2-0-4-1"}],"kind":"row","id":"technique-21-2-0-4"},{"label":"RISK-06 — Memory leak OCCT/Three","children":[{"label":"Gravité initiale : Élevée","kind":"text","id":"technique-21-2-0-5-0"},{"label":"Mesure de maîtrise : Bench fermeture/réouverture + limites/concurrence.","kind":"text","id":"technique-21-2-0-5-1"}],"kind":"row","id":"technique-21-2-0-5"},{"label":"RISK-07 — Extension/MCP contournant les droits","children":[{"label":"Gravité initiale : Critique","kind":"text","id":"technique-21-2-0-6-0"},{"label":"Mesure de maîtrise : Même bus de commandes et validation serveur.","kind":"text","id":"technique-21-2-0-6-1"}],"kind":"row","id":"technique-21-2-0-6"},{"label":"RISK-08 — Migration détruisant références et historique","children":[{"label":"Gravité initiale : Critique","kind":"text","id":"technique-21-2-0-7-0"},{"label":"Mesure de maîtrise : Corpus historique, dry-run, sauvegarde restaurable, rollback.","kind":"text","id":"technique-21-2-0-7-1"}],"kind":"row","id":"technique-21-2-0-7"},{"label":"RISK-09 — Mesures GPU non transférables","children":[{"label":"Gravité initiale : Moyenne/élevée","kind":"text","id":"technique-21-2-0-8-0"},{"label":"Mesure de maîtrise : Profils appareils réels + séparation CPU/GPU.","kind":"text","id":"technique-21-2-0-8-1"}],"kind":"row","id":"technique-21-2-0-8"},{"label":"RISK-10 — Formats annoncés au-delà de la couverture","children":[{"label":"Gravité initiale : Élevée","kind":"text","id":"technique-21-2-0-9-0"},{"label":"Mesure de maîtrise : Matrice par entité/sens, rapports de perte et tests aller-retour.","kind":"text","id":"technique-21-2-0-9-1"}],"kind":"row","id":"technique-21-2-0-9"}],"kind":"table","block":"T353","id":"technique-21-2-0"}],"kind":"section","source":"§ 21.3. Principaux risques de livraison","block":"P352","id":"technique-21-2"},{"label":"21.4. Définition de prêt à développer / prêt à livrer","children":[{"label":"Un sous-ensemble est prêt à développer lorsque : (a) propriétaire du domaine identifié ; (b) invariants et contrats complets ; (c) dépendances et interfaces résolues ; (d) décision d’architecture et de sécurité enregistrée ; (e) critères de test et sources de vérité définis ; (f) migrations envisagées. Il est prêt à livrer lorsqu’un build précis a passé ses scénarios, tests de non-régression, mesures et procédures de reprise, et que ses décisions de dérogation éventuelles sont approuvées.","kind":"text","block":"P356","id":"technique-21-3-0"},{"label":"Aucune capacité marquée « à tester » ou « planifiée » ne doit être présentée comme déjà disponible dans le produit.","kind":"text","block":"P357","id":"technique-21-3-1"}],"kind":"section","source":"§ 21.4. Définition de prêt à développer / prêt à livrer","block":"P355","id":"technique-21-3"}],"kind":"chapter","source":"§ 21. Analyse d’écarts, migration et plan de réalisation conditionnel","block":"P342","id":"technique-21","number":"21","title":"Analyse d’écarts, migration et plan de réalisation conditionnel","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#52647C","bullets":["Étapes de décision","Lots conditionnels et dépendances","Principaux risques de livraison","Définition de prêt à développer / prêt à livrer","Réalisation conditionnée par les preuves"]},{"label":"Annexe A. État observé de Fadi — non normatif","children":[{"label":"Référence d’observation : RachEma-ux/Fadi, main, commit 3bcda9296eaa0a0376ca5d2279dd71f52a75184b, 14 octobre 2026. Cette annexe réutilise l’audit documentaire antérieur, sans nouvel essai d’exécution ni nouvelle mesure du déploiement. La conformité du Studio ne s’en déduit pas.","kind":"text","block":"P359","id":"technique-22-0"},{"label":"Tableau — ID / Composant/fonction / Constat borné au commit audité / Conséquence d’architecture","children":[{"label":"OBS-01","children":[{"label":"Composant/fonction : plan2d/Plan2D.tsx, rendu.tsx","kind":"text","id":"technique-22-1-0-0"},{"label":"Constat borné au commit audité : Plan 2D rendu via SVG/React.","kind":"text","id":"technique-22-1-0-1"},{"label":"Conséquence d’architecture : Candidat pour document 2D autonome, sous tests.","kind":"text","id":"technique-22-1-0-2"}],"kind":"row","id":"technique-22-1-0"},{"label":"OBS-02","children":[{"label":"Composant/fonction : plan2d/accrochage.ts","kind":"text","id":"technique-22-1-1-0"},{"label":"Constat borné au commit audité : Recherches sur collections de segments, intersections par paires proches.","kind":"text","id":"technique-22-1-1-1"},{"label":"Conséquence d’architecture : Index spatial candidat, avec non-régression.","kind":"text","id":"technique-22-1-1-2"}],"kind":"row","id":"technique-22-1-1"},{"label":"OBS-03","children":[{"label":"Composant/fonction : vue3d/scene3d.ts","kind":"text","id":"technique-22-1-2-0"},{"label":"Constat borné au commit audité : Three.js WebGL2 et WebGPU optionnel avec repli ; batching et rendu à la demande.","kind":"text","id":"technique-22-1-2-1"},{"label":"Conséquence d’architecture : Préserver acquis et instrumenter coûts.","kind":"text","id":"technique-22-1-2-2"}],"kind":"row","id":"technique-22-1-2"},{"label":"OBS-04","children":[{"label":"Composant/fonction : scene3d.ts","kind":"text","id":"technique-22-1-3-0"},{"label":"Constat borné au commit audité : Cache par objet et reconstruction de lots en majModele().","kind":"text","id":"technique-22-1-3-1"},{"label":"Conséquence d’architecture : Mises à jour incrémentales à instruire.","kind":"text","id":"technique-22-1-3-2"}],"kind":"row","id":"technique-22-1-3"},{"label":"OBS-05","children":[{"label":"Composant/fonction : planche/vue-planche.ts","kind":"text","id":"technique-22-1-4-0"},{"label":"Constat borné au commit audité : Vue Planche Three.js et couches de sélection, annotations, aperçu ; rendu sur demande.","kind":"text","id":"technique-22-1-4-1"},{"label":"Conséquence d’architecture : Candidat Planche 3D, sous conformité des objets.","kind":"text","id":"technique-22-1-4-2"}],"kind":"row","id":"technique-22-1-4"},{"label":"OBS-06","children":[{"label":"Composant/fonction : planche-model/src/outils/index.ts","kind":"text","id":"technique-22-1-5-0"},{"label":"Constat borné au commit audité : Familles de machines importées statiquement.","kind":"text","id":"technique-22-1-5-1"},{"label":"Conséquence d’architecture : Démontrer un vrai chargement sélectif.","kind":"text","id":"technique-22-1-5-2"}],"kind":"row","id":"technique-22-1-5"},{"label":"OBS-07","children":[{"label":"Composant/fonction : exact/moteur-exact.ts et worker","kind":"text","id":"technique-22-1-6-0"},{"label":"Constat borné au commit audité : OCCT/WASM sur worker persistant, chargé au premier usage ; récupération d’erreur function syncHash(){
 const hash=current().key+(panelMode==='chapter'?'/'+selected:panelMode==='outline'?'/plan':panelMode==='source'?'/source':'');
 try{history.replaceState(null,'','#'+hash);}catch(_){/* Sandboxed previews can deny History API; navigation still works. */}
}
function clearGestures(){pointers.clear();previous=null;gestureOrigin=null;gestureMoved=false;stage.classList.remove('dragging');}
function renderMap(p,reset=true){
 const d=current();pageIndex=Math.max(0,Math.min(p,d.pages.length-1));clearGestures();
 surface.innerHTML=d.maps[pageIndex];svg=surface.querySelector('svg');
 $('mapSelect').value=String(pageIndex);$('pagePrev').disabled=pageIndex===0;$('pageNext').disabled=pageIndex===d.pages.length-1;
 svg.querySelectorAll('.chapter').forEach(c=>c.classList.toggle('selected',selected!==null&&Number(c.dataset.section)===selected));
 if(reset)view={...VB};draw();
 $('hint').textContent=d.pages.length>1?`Vue ${pageIndex+1}/${d.pages.length} · cliquer pour lire · glisser / zoomer`:'Cliquer pour lire · glisser pour déplacer · zoomer';
}
function configureDocument(index){
 docIndex=index;const d=current();selected=null;panelMode='closed';panel.hidden=true;main.classList.remove('panel-open');panel.classList.remove('source-only');
 $('search').value='';$('scope').value='section';
 document.title=`Fadi Studio — ${d.title} ${d.version} · carte interactive`;
 $('brandSubtitle').textContent=d.short;
 $('sourceName').textContent=d.source;$('sourceStatus').textContent=d.status;
 $('sourceName').title=d.source;
 $('chapterSelect').replaceChildren();const first=new Option('Choisir un chapitre…','');$('chapterSelect').add(first);
 d.children.forEach((n,i)=>$('chapterSelect').add(new Option(`${n.number} · ${n.title}`,String(i))));
 $('mapSelect').replaceChildren();d.pageLabels.forEach((s,i)=>$('mapSelect').add(new Option(s,String(i))));
 $('mapPicker').hidden=d.pages.length===1;
 document.querySelectorAll('.doc-tab').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));
 $('outline').title=`Ouvrir les ${d.children.length} sections et annexes du document`;
 renderMap(0);syncHash();
}
function updateSelection(){
 if(svg)svg.querySelectorAll('.chapter').forEach(c=>c.classList.toggle('selected',selected!==null&&Number(c.dataset.section)===selected));
}
function renderTree(){
 const d=current(),q=$('search').value.trim(),normalized=canon(q);
 tree.replaceChildren();
 const all=panelMode==='outline'||(q&&$('scope').value==='all');
 const nodes=all?d.children:(selected!==null?d.children[selected].children:[]);
 if(!q&&all){const p=document.createElement('p');p.className='first-note';p.textContent=d.note;tree.append(p);}
 if(q&&all&&panelMode!=='outline'){const p=document.createElement('p');p.className='summary-note';p.textContent='Recherche dans tout le document (tous les chapitres et annexes).';tree.append(p);}
 let shown=0,matches=0;
 for(const n of nodes){if(!normalized||contains(n,normalized)){tree.append(createNode(n,all?1:0,q));shown++;}if(normalized)matches+=countMatching(n,normalized);}
 if(!shown){const p=document.createElement('p');p.id='empty';p.textContent='Aucun contenu correspondant.';tree.append(p);}
 $('matchCount').textContent=q?`${matches} résultat${matches>1?'s':''}`:`${nodes.length} ${all?'sections':'rubriques'}`;
}
function openDetails(index,{retainSearch=false,focus=false}={}){
 if(index!==null&&(!Number.isInteger(index)||index<0||index>=current().children.length))return;
 lastFocused=document.activeElement;
 selected=index;panelMode=index===null?'outline':'chapter';panel.hidden=false;panel.classList.remove('source-only');main.classList.add('panel-open');
 $('panelTitle').textContent=index===null?'Plan complet du document':current().children[index].label;
 $('scope').hidden=index===null;
 if(!retainSearch){$('search').value='';$('scope').value='section';}
 if(index!==null){const p=current().pages.findIndex(indices=>indices.includes(index));if(p!==pageIndex)renderMap(p);}
 $('chapterSelect').value=index===null?'':String(index);
 updateSelection();renderTree();tree.scrollTop=0;syncHash();
 announce(index===null?'Plan complet ouvert.':current().children[index].label+' : détails ouverts.');
 if(focus)$('search').focus();
}
function closeDetails(restoreFocus=true){
 panel.hidden=true;main.classList.remove('panel-open');panelMode='closed';selected=null;$('chapterSelect').value='';updateSelection();syncHash();
 if(restoreFocus){if(lastFocused&&lastFocused.isConnected&&lastFocused!==document.body&&!panel.contains(lastFocused))lastFocused.focus({preventScroll:true});else stage.focus({preventScroll:true});}
 announce('Retour à la carte.');
}
function downloadBlob(raw,name,type){
 const blob=new Blob([raw],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function downloadWord(){
 const d=current(),raw=atob(d.sourceBase64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
 downloadBlob(bytes,d.source,'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
 announce('Document Word source exporté.');
}
function openSource(){
 lastFocused=document.activeElement;selected=null;panelMode='source';panel.hidden=false;panel.classList.add('source-only');main.classList.add('panel-open');
 $('panelTitle').textContent='Document source et lecture';$('chapterSelect').value='';updateSelection();tree.replaceChildren();
 const p=document.createElement('p');p.className='first-note';p.textContent=current().note;tree.append(p);
 const h=document.createElement('h3');h.className='subtle-title';h.textContent='Fichier Word original intégré';tree.append(h);
 const t=document.createElement('p');t.className='summary-note';t.textContent='Le panneau de détail reprend le texte et les tableaux du Word. Les cartes affichent une synthèse. Les numéros et identifiants du document source sont conservés. Le téléchargement ci-dessous restitue le fichier original, sans modification.';tree.append(t);
 const actions=document.createElement('div');actions.className='source-actions';const b=document.createElement('button');b.textContent='Télécharger le Word source';b.onclick=downloadWord;actions.append(b);tree.append(actions);
 const ht=document.createElement('h3');ht.className='subtle-title';ht.textContent='Empreinte SHA-256 du document source';tree.append(ht);
 const code=document.createElement('p');code.className='reference-hash';code.textContent=current().sha256;tree.append(code);
 const hp=document.createElement('h3');hp.className='subtle-title';hp.textContent='Portée et préambule du document';tree.append(hp);
 for(const n of current().preamble)tree.append(createNode(n,0,''));
 const ref=document.createElement('p');ref.className='ref';ref.textContent='Modèle visuel et interactions : Studio_Concept_Mind_Map.html fourni. Cette page est une aide de lecture, pas un outil de validation du code ni un suivi d’implémentation automatiquement synchronisé.';tree.append(ref);
 tree.scrollTop=0;syncHash();announce('Document source affiché.');
}
function setPage(p){if(p<0||p>=current().pages.length)return;closeDetails(false);renderMap(p);announce(`Vue ${p+1} sur ${current().pages.length}.`);}
function showFromHash(hash){
 const parts=hash.replace(/^#/,'').split('/'),di=DOCS.findIndex(d=>d.key===parts[0]);
 if(di<0)return;configureDocument(di);
 if(parts[1]==='plan')openDetails(null);else if(parts[1]==='source')openSource();
 else if(parts[1]!==undefined&&/^\d+$/.test(parts[1]))openDetails(Number(parts[1]));
}
DOCS.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.className='doc-tab';b.textContent=d.short;b.setAttribute('aria-pressed',String(i===0));b.onclick=()=>configureDocument(i);$('docTabs').append(b);});
if(DOCS.length===1)document.body.classList.add('single-doc');
$('chapterSelect').onchange=e=>{if(e.target.value==='')closeDetails();else openDetails(Number(e.target.value));};
$('outline').onclick=()=>openDetails(null);
$('close').onclick=()=>closeDetails();$('backMap').onclick=()=>closeDetails();
$('fit').onclick=()=>{fit();announce('Carte ajustée.');};$('in').onclick=()=>zoom(1.35);$('out').onclick=()=>zoom(1/1.35);
$('mapSelect').onchange=e=>setPage(Number(e.target.value));$('pagePrev').onclick=()=>setPage(pageIndex-1);$('pageNext').onclick=()=>setPage(pageIndex+1);
$('search').oninput=renderTree;$('scope').onchange=renderTree;
$('expand').onclick=()=>{tree.querySelectorAll('details').forEach(d=>{d.open=true;openNodes.set(d.dataset.node,true);});announce('Branches dépliées.');};
$('collapse').onclick=()=>{tree.querySelectorAll('details').forEach(d=>{d.open=false;openNodes.set(d.dataset.node,false);});announce('Branches repliées.');};
$('sourceButton').onclick=openSource;
$('download').onclick=()=>{downloadBlob(current().maps[pageIndex],`Fadi_Studio_${current().key}_Mind_Map_vue_${pageIndex+1}.svg`,'image/svg+xml;charset=utf-8');announce('Carte vectorielle exportée.');};
// Pointer input: keep the tap target separate from pointer capture to avoid double activation.
function gesture(){const a=[...pointers.values()];if(!a.length)return null;if(a.length===1)return {x:a[0].x,y:a[0].y,d:0};return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};}
stage.addEventListener('pointerdown',e=>{
 if(e.button!==0)return;
 if(!pointers.size){gestureMoved=false;const hit=e.target.closest('.chapter');gestureOrigin={x:e.clientX,y:e.clientY,section:hit?Number(hit.dataset.section):null};}
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>1)gestureMoved=true;previous=gesture();
 try{stage.setPointerCapture(e.pointerId);}catch(_){}stage.classList.add('dragging');
});
stage.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const g=gesture();
 if(gestureOrigin&&Math.hypot(e.clientX-gestureOrigin.x,e.clientY-gestureOrigin.y)>6)gestureMoved=true;
 const matrix=svg?.getScreenCTM();
 if(previous&&matrix&&gestureMoved){
  const inv=matrix.inverse(),dx=g.x-previous.x,dy=g.y-previous.y;
  view.x-=dx*inv.a+dy*inv.c;view.y-=dx*inv.b+dy*inv.d;draw();
  if(g.d&&previous.d)zoom(g.d/previous.d,g.x,g.y);
 }
 previous=g;
});
function endPointer(e,cancelled){
 if(!pointers.has(e.pointerId))return;
 const origin=gestureOrigin,wasMoved=gestureMoved;
 pointers.delete(e.pointerId);previous=gesture();
 try{if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId);}catch(_){}
 if(!pointers.size){
  stage.classList.remove('dragging');ignoreClickUntil=performance.now()+400;
  const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.chapter');
  if(!cancelled&&!wasMoved&&origin?.section!==null&&hit&&Number(hit.dataset.section)===origin.section)openDetails(origin.section);
  gestureOrigin=null;
 }
}
stage.addEventListener('pointerup',e=>endPointer(e,false));
stage.addEventListener('pointercancel',e=>{gestureMoved=true;endPointer(e,true);});
stage.addEventListener('lostpointercapture',e=>{if(pointers.has(e.pointerId)){pointers.delete(e.pointerId);previous=gesture();if(!pointers.size)stage.classList.remove('dragging');}});
stage.addEventListener('click',e=>{if(performance.now()<ignoreClickUntil)return;const c=e.target.closest('.chapter');if(c)openDetails(Number(c.dataset.section));});
stage.addEventListener('keydown',e=>{
 const c=e.target.closest('.chapter');
 if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDetails(Number(c.dataset.section));return;}
 if(e.key==='+'||e.key==='='){e.preventDefault();zoom(1.35);}else if(e.key==='-'){e.preventDefault();zoom(1/1.35);}else if(e.key==='0'){e.preventDefault();fit();}
 else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
  e.preventDefault();const s=view.w*.06;if(e.key==='ArrowLeft')view.x-=s;if(e.key==='ArrowRight')view.x+=s;if(e.key==='ArrowUp')view.y-=s;if(e.key==='ArrowDown')view.y+=s;draw();
 }
});
stage.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0014),e.clientX,e.clientY);},{passive:false});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&panelMode!=='closed'){e.preventDefault();closeDetails();}
 if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();openDetails(null,{focus:true});}
});
window.addEventListener('hashchange',()=>showFromHash(location.hash));
const initialHash=location.hash;configureDocument(0);if(initialHash)showFromHash(initialHash);

</script></body></html>
