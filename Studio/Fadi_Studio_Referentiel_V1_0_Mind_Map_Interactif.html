s.","kind":"text","id":"technique-9-1-0-4-0"},{"label":"Recalcul inutile à éviter : Recalcul des volumes et métrés métier.","kind":"text","id":"technique-9-1-0-4-1"}],"kind":"row","id":"technique-9-1-0-4"},{"label":"Référence externe changée","children":[{"label":"Travail requis : Caches dépendants, observations et documents périmés.","kind":"text","id":"technique-9-1-0-5-0"},{"label":"Recalcul inutile à éviter : Mise à jour silencieuse d’un dossier publié.","kind":"text","id":"technique-9-1-0-5-1"}],"kind":"row","id":"technique-9-1-0-5"},{"label":"Objet supprimé","children":[{"label":"Travail requis : Suppression de géométrie et index + contrôle des liens.","kind":"text","id":"technique-9-1-0-6-0"},{"label":"Recalcul inutile à éviter : Maintien d’un segment orphelin sélectionnable.","kind":"text","id":"technique-9-1-0-6-1"}],"kind":"row","id":"technique-9-1-0-6"}],"kind":"table","block":"T176","id":"technique-9-1-0"},{"label":"Les effets d’une commande doivent être traduits en « dirty flags » explicites par couche et par objet ; un repli conservateur vers un recalcul plus large est acceptable si nécessaire pour la correction. Toute stratégie incrémentale est testée contre une reconstruction complète de référence.","kind":"text","block":"P178","id":"technique-9-1-1"}],"kind":"section","source":"§ 9.2. Stratégie d’invalidation","block":"P175","id":"technique-9-1"},{"label":"9.3. Index de recherche spatiale","children":[{"label":"EX-052 — Broad phase. Les requêtes de sélection, accrochage et intersection filtrent les candidats par emprise spatiale à l’échelle de la vue avant de lancer les tests précis. Pour une petite scène, le balayage simple reste admissible lorsqu’il est plus efficace et correct.","kind":"text","block":"P180","id":"technique-9-2-0"},{"label":"EX-053 — Narrow phase. Les primitives retenues sont testées avec les règles géométriques de référence : extrémité, milieu, intersection, centre, tangente, perpendiculaire, point proche, ortho, parallèle, priorités et tolérances. Une accélération ne change pas les règles de classement et de départage.","kind":"text","block":"P181","id":"technique-9-2-1"},{"label":"EX-054 — Maintien. L’index est cohérent avec la révision source et les états de calques, références et sélections autorisées. Insert/remove/update ciblés sont privilégiés si prouvés efficaces ; reconstruction en worker possible pour grands changements. La requête temps réel peut rester sur le fil principal si elle respecte les mesures de latence.","kind":"text","block":"P182","id":"technique-9-2-2"},{"label":"Tableau — Contexte / Structure candidate / À mesurer / vérifier","children":[{"label":"Traits et rectangles 2D","children":[{"label":"Structure candidate : R-tree, quadtree ou partition plane.","kind":"text","id":"technique-9-2-3-0-0"},{"label":"À mesurer / vérifier : Construction, densité locale, insertions, intersections.","kind":"text","id":"technique-9-2-3-0-1"}],"kind":"row","id":"technique-9-2-3-0"},{"label":"Points d’accrochage","children":[{"label":"Structure candidate : Grille spatiale ou ensemble indexé.","kind":"text","id":"technique-9-2-3-1-0"},{"label":"À mesurer / vérifier : Recherche de voisins, tolérances en pixels.","kind":"text","id":"technique-9-2-3-1-1"}],"kind":"row","id":"technique-9-2-3-1"},{"label":"Meshes et raycasting 3D","children":[{"label":"Structure candidate : BVH local, hiérarchie de boîtes/instances.","kind":"text","id":"technique-9-2-3-2-0"},{"label":"À mesurer / vérifier : Refit/rebuild après changement, correspondance triangle-objet.","kind":"text","id":"technique-9-2-3-2-1"}],"kind":"row","id":"technique-9-2-3-2"},{"label":"Bâtiments multi-niveaux","children":[{"label":"Structure candidate : Partitionnement par niveau/discipline/cellule.","kind":"text","id":"technique-9-2-3-3-0"},{"label":"À mesurer / vérifier : Culling, coût mémoire et mises à jour locales.","kind":"text","id":"technique-9-2-3-3-1"}],"kind":"row","id":"technique-9-2-3-3"}],"kind":"table","block":"T183","id":"technique-9-2-3"},{"label":"Une BVH n’implique pas automatiquement une occlusion fiable : le filtrage de visibilité derrière les faces relève d’un traitement distinct. Aucun objectif « moins de 1 ms pour 100 000 objets » n’est admis sans profil et mesure.","kind":"text","block":"P185","id":"technique-9-2-4"},{"label":"AC-004. Sur un corpus comportant objets superposés, densités variables, intersections et références liées, l’index accéléré doit fournir les mêmes cibles et points d’accrochage (dans la tolérance déclarée) que l’algorithme de référence, avec traces des cas ambigus.","kind":"text","block":"P186","id":"technique-9-2-5"}],"kind":"section","source":"§ 9.3. Index de recherche spatiale","block":"P179","id":"technique-9-2"}],"kind":"chapter","source":"§ 9. Projection de scène, invalidation et indexation spatiale","block":"P171","id":"technique-9","number":"09","title":"Projection de scène, invalidation et indexation spatiale","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#176CAE","bullets":["Frontière canonique / représentation","Stratégie d’invalidation","Index de recherche spatiale","Correspondance entre géométries et objets sources","Index spatiaux maintenus avec la révision"]},{"label":"10. Moteurs de rendu 2D/3D, précision et qualité adaptative","children":[{"label":"10.1. Pipeline de la Planche 2D","children":[{"label":"EX-055 — Fidélité. Le renderer 2D reproduit lignes, arcs, splines, cercles, contours, hachures, cotations, légendes, textes, symboles, calques, transparences, sélection et aperçu, avec un comportement identique des coordonnées et accrochages.","kind":"text","block":"P189","id":"technique-10-0-0"},{"label":"DEC-08 — Technologie ouverte. Le rendu initial SVG/React peut être conservé, optimisé ou remplacé après benchmarks par Canvas2D, OffscreenCanvas ou GPU. Il n’existe pas de seuil universel à partir duquel Canvas2D serait inadmissible. Les critères comprennent fidélité vectorielle, consommation CPU/GPU, mémoire, latence, export, accessibilité et qualité d’impression.","kind":"text","block":"P190","id":"technique-10-0-1"},{"label":"Le pipeline peut découpler : fond/grille, objets, annotations, cotes, sélection, pointeur/aperçu et références. Une couche peut être invalidée indépendamment quand cette granularité est démontrée correcte. Les grands tracés peuvent employer regroupement des segments, partitionnement et tuilage conditionnés par la fidélité.","kind":"text","block":"P191","id":"technique-10-0-2"}],"kind":"section","source":"§ 10.1. Pipeline de la Planche 2D","block":"P188","id":"technique-10-0"},{"label":"10.2. Pipeline de la Planche 3D","children":[{"label":"EX-056 — Réutilisation contrôlée. La cible conserve par défaut les capacités fonctionnelles utiles déjà observées (rendu à la demande, batching, WebGL2, WebGPU optionnel, machines de Planche), sous réserve d’audit de conformité. Aucun nouveau moteur 3D n’est présumé nécessaire.","kind":"text","block":"P193","id":"technique-10-1-0"},{"label":"Les mécanismes candidats comprennent :","kind":"text","block":"P194","id":"technique-10-1-1"},{"label":"Batching : combiner les faces compatibles par lot tout en conservant une table de sélection triangle → identifiant d’objet ; mesurer le coût des réassemblages.","kind":"text","block":"P195","id":"technique-10-1-2"},{"label":"Instancing : géométries identiques répétées, transformations par instance et traçabilité des occurrences ; éviter l’instanciation universelle des formes uniques.","kind":"text","block":"P196","id":"technique-10-1-3"},{"label":"Frustum culling : ignorer la géométrie hors du champ ; séparer les besoins de sélection et les éléments cachés selon leur contrat.","kind":"text","block":"P197","id":"technique-10-1-4"},{"label":"LOD / partitionnement : réduire la complexité graphique des objets lointains sans modifier les coordonnées de référence ni les cotes.","kind":"text","block":"P198","id":"technique-10-1-5"},{"label":"Occlusion : seulement si le gain dépasse le coût et si l’affichage reste exact en modes filaires/coupes.","kind":"text","block":"P199","id":"technique-10-1-6"},{"label":"Dirty flags : modifier le plus petit lot correct, avec traitement spécifique des objets hôtes/dépendants.","kind":"text","block":"P200","id":"technique-10-1-7"},{"label":"Rendu sur invalidation : ne pas tourner en permanence lorsque rien ne change ; rester continu pendant animation ou interaction active.","kind":"text","block":"P201","id":"technique-10-1-8"},{"label":"DEC-10 — Mises à jour de lots. Le cache des maillages par objet ne suffit pas si tous les buffers GPU sont réassemblés à chaque changement de modèle. Comparer reconstruction totale, mise à jour par lot et buffers à segments réservés. Les stratégies sont soumises à l’absence d’objets fantômes et à la fidélité du picking.","kind":"text","block":"P202","id":"technique-10-1-9"}],"kind":"section","source":"§ 10.2. Pipeline de la Planche 3D","block":"P192","id":"technique-10-1"},{"label":"10.3. Qualité adaptative et précision","children":[{"label":"EX-057 — Dégradation sûre. En cas de surcharge, réduire d’abord ombres, effets, anti-crénelage et résolution de présentation. Ne jamais désactiver silencieusement un accrochage indispensable, modifier l’objet enregistré ou assouplir une tolérance géométrique métier pour augmenter le FPS.","kind":"text","block":"P204","id":"technique-10-2-0"},{"label":"EX-058 — Transparence des previews. Un aperçu approximatif (ex. offset ou booléen simplifié) doit rester identifié comme provisoire. La géométrie exacte est calculée et validée avant engagement ; le décalage entre preview et résultat final, s’il dépasse la tolérance, doit être expliqué ou la commande refusée.","kind":"text","block":"P205","id":"technique-10-2-1"},{"label":"AC-005. Les opérations sélection, orbite, zoom, poussé/tiré et changement de matériau passent les tests de fidélité géométrique avant et après toute optimisation. Les profils GPU sont évalués séparément de mesures faites sous SwiftShader.","kind":"text","block":"P206","id":"technique-10-2-2"}],"kind":"section","source":"§ 10.3. Qualité adaptative et précision","block":"P203","id":"technique-10-2"}],"kind":"chapter","source":"§ 10. Moteurs de rendu 2D/3D, précision et qualité adaptative","block":"P187","id":"technique-10","number":"10","title":"Moteurs de rendu 2D/3D, précision et qualité adaptative","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#176CAE","bullets":["Pipeline de la Planche 2D","Pipeline de la Planche 3D","Qualité adaptative et précision","Batching, instancing et rendu à la demande","Aucune performance au prix de la précision"]},{"label":"11. Workers, WASM, ordonnanceur et résilience","children":[{"label":"11.1. Principes d’ordonnancement","children":[{"label":"EX-059 — Isolation du calcul lourd. Le fil principal assure événements, retours immédiats et rendu. Les opérations susceptibles de bloquer durablement l’interaction (géométrie exacte, reconstruction d’index volumineux, tessellation massive, export) sont candidates à un worker ou au serveur, à choisir sur mesure.","kind":"text","block":"P209","id":"technique-11-0-0"},{"label":"EX-060 — Ordonnanceur commun. Chaque tâche possède jobId, domaine, priorité, révision source, empreinte d’entrée, limite de concurrence, état, stratégie d’annulation, journal d’erreur et pointeur de résultat. L’ordonnanceur ne doit pas supposer qu’un worker par cœur logique est optimal.","kind":"text","block":"P210","id":"technique-11-0-1"},{"label":"Tableau — Classe de tâche / Exécution candidate / Exigence spéciale","children":[{"label":"Pointeur/snapping simple","children":[{"label":"Exécution candidate : Synchrone local si borné.","kind":"text","id":"technique-11-0-2-0-0"},{"label":"Exigence spéciale : Préserver ordre et cohérence des gestes.","kind":"text","id":"technique-11-0-2-0-1"}],"kind":"row","id":"technique-11-0-2-0"},{"label":"Index volumineux","children":[{"label":"Exécution candidate : Worker.","kind":"text","id":"technique-11-0-2-1-0"},{"label":"Exigence spéciale : Versionner l’index avant publication en scène.","kind":"text","id":"technique-11-0-2-1-1"}],"kind":"row","id":"technique-11-0-2-1"},{"label":"Tessellation","children":[{"label":"Exécution candidate : Worker.","kind":"text","id":"technique-11-0-2-2-0"},{"label":"Exigence spéciale : Transferables si mesurés utiles ; réception sur bonne révision.","kind":"text","id":"technique-11-0-2-2-1"}],"kind":"row","id":"technique-11-0-2-2"},{"label":"OCCT/WASM","children":[{"label":"Exécution candidate : Worker spécialisé persistant chargé au besoin.","kind":"text","id":"technique-11-0-2-3-0"},{"label":"Exigence spéciale : Mémoire limitée ; échec et remise en service contrôlés.","kind":"text","id":"technique-11-0-2-3-1"}],"kind":"row","id":"technique-11-0-2-3"},{"label":"Manifold lourds","children":[{"label":"Exécution candidate : Worker si nécessaire.","kind":"text","id":"technique-11-0-2-4-0"},{"label":"Exigence spéciale : Même invariants géométriques et calcul référence.","kind":"text","id":"technique-11-0-2-4-1"}],"kind":"row","id":"technique-11-0-2-4"},{"label":"Documents et quantités","children":[{"label":"Exécution candidate : Worker ou serveur selon taille et droits.","kind":"text","id":"technique-11-0-2-5-0"},{"label":"Exigence spéciale : Résultat versionné ; aucun export orphelin.","kind":"text","id":"technique-11-0-2-5-1"}],"kind":"row","id":"technique-11-0-2-5"},{"label":"Transaction centrale","children":[{"label":"Exécution candidate : API/DB autoritaire Fadi.","kind":"text","id":"technique-11-0-2-6-0"},{"label":"Exigence spéciale : Validation serveur obligatoire.","kind":"text","id":"technique-11-0-2-6-1"}],"kind":"row","id":"technique-11-0-2-6"}],"kind":"table","block":"T211","id":"technique-11-0-2"}],"kind":"section","source":"§ 11.1. Principes d’ordonnancement","block":"P208","id":"technique-11-0"},{"label":"11.2. État des jobs et concurrence","children":[{"label":"IF-007 — Statuts des jobs. queued → loading → running → completed, avec branches cancel_requested, cancelled, failed, superseded, timed_out. Une demande d’annulation n’équivaut pas immédiatement à un arrêt matériel ; le résultat d’une tâche finalement terminée après annulation ne peut être engagé sans nouvelle vérification.","kind":"text","block":"P214","id":"technique-11-1-0"},{"label":"EX-061 — Échec worker. L’échec rejette les tâches affectées, libère le worker défaillant, préserve le modèle et propose la relance sous contrôle. Un mécanisme de recréation du worker spécialisé doit être spécifié et testé ; les requêtes pending ne restent pas bloquées indéfiniment.","kind":"text","block":"P215","id":"technique-11-1-1"},{"label":"EX-062 — Mémoire WASM. Suivre taille compressée transférée, instance compilée, allocations WASM et mémoire résidente après traitement ; conserver un noyau chargé tant que le coût de maintien est justifié. L’initialisation simultanée de plusieurs OCCT requiert une preuve de gain et de mémoire acceptable.","kind":"text","block":"P216","id":"technique-11-1-2"},{"label":"EX-063 — Transfert d’objets. Les grands tableaux typés peuvent être transférés sans copie seulement lorsque le protocole établit la propriété du tampon et sa durée de vie. Les messages applicatifs restent validés même s’ils proviennent d’un worker « interne ».","kind":"text","block":"P217","id":"technique-11-1-3"}],"kind":"section","source":"§ 11.2. État des jobs et concurrence","block":"P213","id":"technique-11-1"},{"label":"11.3. Règles de priorité","children":[{"label":"L’interaction immédiate prime sur les aperçus lourds ; un job ancien lié à une révision dépassée peut être interrompu ou classé obsolète. Une exportation approuvée ne doit pas être annulée tacitement par un survol de pointeur. Prévoir équité entre tâches, limites de mémoire, quotas par étude et messages de progression lorsque la fonction peut en produire.","kind":"text","block":"P219","id":"technique-11-2-0"},{"label":"AC-006. Échec forcé d’OCCT/WASM pendant une opération : aucune mutation partielle, retour d’erreur intelligible, tâches en attente résolues explicitement, possibilité de relance sans doublons et sans perte de la révision courante.","kind":"text","block":"P220","id":"technique-11-2-1"}],"kind":"section","source":"§ 11.3. Règles de priorité","block":"P218","id":"technique-11-2"}],"kind":"chapter","source":"§ 11. Workers, WASM, ordonnanceur et résilience","block":"P207","id":"technique-11","number":"11","title":"Workers, WASM, ordonnanceur et résilience","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#52647C","bullets":["Principes d’ordonnancement","État des jobs et concurrence","Règles de priorité","Jobs : priorité, annulation et résultats périmés","Relance contrôlée après erreur de worker"]},{"label":"12. BIM, coordination, exigences et contrôles","children":[{"label":"12.1. Sémantique architecturale","children":[{"label":"EX-064 — Identité BIM. Un objet architectural possède type, paramètres, niveau, hôtes, relations, propriétés et provenance. Les paramètres de conception (épaisseur, implantation), les propriétés techniques (composition, performances) et les styles de représentation (couleur, texture) sont trois catégories indépendantes.","kind":"text","block":"P223","id":"technique-12-0-0"},{"label":"EX-065 — Exigence vs mesure. Une exigence versionnée (ex. surface programmée de 28 m²) ne change pas lorsque la surface modélisée devient 26 m² ; l’interface présente explicitement l’écart. La modification d’exigence passe par sa propre commande, avec permission et provenance.","kind":"text","block":"P224","id":"technique-12-0-1"}],"kind":"section","source":"§ 12.1. Sémantique architecturale","block":"P222","id":"technique-12-0"},{"label":"12.2. Références et fédération","children":[{"label":"EX-066 — Sources partenaires. Chaque modèle externe conserve auteur, discipline, format, version, unité, transformation et état d’acceptation. Le remplacement d’une référence suit réception → vérification → comparaison → acceptation/rejet, et n’efface pas la référence d’une publication passée.","kind":"text","block":"P226","id":"technique-12-1-0"},{"label":"EX-067 — Éditabilité explicite. Un modèle consulté, fédéré ou utilisé comme référence n’est pas déclaré natif et paramétrique sans conversion validée. Les éléments ignorés, simplifiés ou non convertibles sont signalés.","kind":"text","block":"P227","id":"technique-12-1-1"}],"kind":"section","source":"§ 12.2. Références et fédération","block":"P225","id":"technique-12-1"},{"label":"12.3. Moteur de règles et conclusions","children":[{"label":"Tableau — Dimension de contrôle / Question / Traçabilité minimale","children":[{"label":"Géométrie","children":[{"label":"Question : Solide fermé, absence de géométrie invalide, références stables ?","kind":"text","id":"technique-12-2-0-0-0"},{"label":"Traçabilité minimale : Révision, objet, règle, tolérance.","kind":"text","id":"technique-12-2-0-0-1"}],"kind":"row","id":"technique-12-2-0-0"},{"label":"Information BIM","children":[{"label":"Question : Type, unité, identifiant, propriété requise présents ?","kind":"text","id":"technique-12-2-0-1-0"},{"label":"Traçabilité minimale : Version de règle et source.","kind":"text","id":"technique-12-2-0-1-1"}],"kind":"row","id":"technique-12-2-0-1"},{"label":"Coordination","children":[{"label":"Question : Incompatibilité entre disciplines / réseaux / structure ?","kind":"text","id":"technique-12-2-0-2-0"},{"label":"Traçabilité minimale : Modèles, versions, positionnement, exceptions.","kind":"text","id":"technique-12-2-0-2-1"}],"kind":"row","id":"technique-12-2-0-2"},{"label":"Cohérence de conception","children":[{"label":"Question : Résultat conforme à une exigence et à ses hypothèses ?","kind":"text","id":"technique-12-2-0-3-0"},{"label":"Traçabilité minimale : Exigence versionnée, valeur mesurée, calcul.","kind":"text","id":"technique-12-2-0-3-1"}],"kind":"row","id":"technique-12-2-0-3"}],"kind":"table","block":"T229","id":"technique-12-2-0"},{"label":"EX-068 — Conclusion normative. Les valeurs de contrôle sont conforme, non conforme, non testé, non applicable justifié. Le statut d’exécution (en attente, échec technique) ne doit jamais être interprété comme conforme.","kind":"text","block":"P231","id":"technique-12-2-1"},{"label":"EX-069 — Observation unique. Une anomalie issue d’un contrôle possède un issueId réutilisé par le suivi documentaire. Le réexamen d’une même anomalie sur une nouvelle révision rapproche les observations existantes selon une règle explicite, pas par création systématique de doublons.","kind":"text","block":"P232","id":"technique-12-2-2"},{"label":"EX-070 — Clôture. La déclaration de correction par un concepteur ne clôt pas à elle seule une observation. Un recontrôle par le rôle autorisé produit une conclusion liée à une nouvelle révision. La suppression de l’objet problématique ne prouve pas à elle seule la résolution.","kind":"text","block":"P233","id":"technique-12-2-3"}],"kind":"section","source":"§ 12.3. Moteur de règles et conclusions","block":"P228","id":"technique-12-2"}],"kind":"chapter","source":"§ 12. BIM, coordination, exigences et contrôles","block":"P221","id":"technique-12","number":"12","title":"BIM, coordination, exigences et contrôles","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#218471","bullets":["Sémantique architecturale","Références et fédération","Moteur de règles et conclusions","Exigences et résultats de conception distincts","Constats rattachés à la révision examinée"]},{"label":"13. Visualisation, rendu, immersion et IA","children":[{"label":"13.1. Séparation des trois modes","children":[{"label":"Tableau — Mode / Entrée principale / Nature du résultat / Effet autorisé","children":[{"label":"Rendu issu du modèle","children":[{"label":"Entrée principale : Modèle et scène sur révision identifiée.","kind":"text","id":"technique-13-0-0-0-0"},{"label":"Nature du résultat : Média de présentation référencé au modèle.","kind":"text","id":"technique-13-0-0-0-1"},{"label":"Effet autorisé : Aucune mutation implicite de géométrie.","kind":"text","id":"technique-13-0-0-0-2"}],"kind":"row","id":"technique-13-0-0-0"},{"label":"Illustration IA contrainte","children":[{"label":"Entrée principale : Images, vues ou paramètres de référence.","kind":"text","id":"technique-13-0-0-1-0"},{"label":"Nature du résultat : Illustration à vérifier par comparaison.","kind":"text","id":"technique-13-0-0-1-1"},{"label":"Effet autorisé : Proposition visuelle, pas métrés.","kind":"text","id":"technique-13-0-0-1-2"}],"kind":"row","id":"technique-13-0-0-1"},{"label":"Exploration IA libre","children":[{"label":"Entrée principale : Brief créatif, styles et inspirations.","kind":"text","id":"technique-13-0-0-2-0"},{"label":"Nature du résultat : Exploration sans fidélité géométrique garantie.","kind":"text","id":"technique-13-0-0-2-1"},{"label":"Effet autorisé : Intention pouvant être traduite par décision explicite.","kind":"text","id":"technique-13-0-0-2-2"}],"kind":"row","id":"technique-13-0-0-2"}],"kind":"table","block":"T236","id":"technique-13-0-0"},{"label":"EX-071 — Provenance des médias. Les rendus conservent modèle/variante/révision source, caméra, paramètres, auteur, date et empreintes si disponibles. Les traitements IA ajoutent service/fournisseur, version si connue, sources envoyées, restrictions de droits, consentement ou autorisation de transfert lorsque requis, coûts/quotas et résultat.","kind":"text","block":"P238","id":"technique-13-0-1"},{"label":"EX-072 — Reproductibilité honnête. Conserver les paramètres et une image historique ne garantit pas la reproduction identique d’une génération IA. Les inconnues du fournisseur sont signalées comme telles.","kind":"text","block":"P239","id":"technique-13-0-2"},{"label":"EX-073 — Séparation visuel/technique. Les quantités, performances et règles métier se calculent sur les objets et données de référence, jamais sur les pixels d’une illustration. Un matériau apparent ne change pas automatiquement la composition constructive.","kind":"text","block":"P240","id":"technique-13-0-3"}],"kind":"section","source":"§ 13.1. Séparation des trois modes","block":"P235","id":"technique-13-0"},{"label":"13.2. Gouvernance externe","children":[{"label":"Avant appel externe, contrôler la confidentialité des modèles, le droit de transmettre la donnée, la durée de conservation, l’identité du prestataire, ses restrictions de traitement et un budget de coût ou quota. Une intégration non encore évaluée reste non disponible ; le référentiel n’attribue pas une fonctionnalité IA à Fadi sans preuve.","kind":"text","block":"P242","id":"technique-13-1-0"},{"label":"AC-007. Générer une illustration ne change ni les dimensions, ni les propriétés BIM, ni la révision du modèle source. La publication d’une illustration indique son statut de vérification et sa source.","kind":"text","block":"P243","id":"technique-13-1-1"}],"kind":"section","source":"§ 13.2. Gouvernance externe","block":"P241","id":"technique-13-1"}],"kind":"chapter","source":"§ 13. Visualisation, rendu, immersion et IA","block":"P234","id":"technique-13","number":"13","title":"Visualisation, rendu, immersion et IA","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#8E59A6","bullets":["Séparation des trois modes","Gouvernance externe","Rendu du modèle · IA contrainte · exploration libre","Sources, droits, confidentialité et coût","Aucune modification technique depuis des pixels"]},{"label":"14. Documentation, métrés, interopérabilité et publication","children":[{"label":"14.1. Chaîne de production documentaire","children":[{"label":"EX-074 — Chaîne documentaire. Vue → Feuille → Dossier → Publication constitue le cycle des livrables. Une Planche est un environnement de travail ; une feuille est un assemblage de représentations et annotations à une échelle et un format déclarés.","kind":"text","block":"P246","id":"technique-14-0-0"},{"label":"EX-075 — Sources des vues. Chaque vue conserve les révisions sources, niveau/repère, cadrage, échelle de présentation, visibilité, styles et annotations propres. Une vue dérivée du 3D peut devenir périmée après modification du modèle ; ses annotations propres ne deviennent pas des paramètres de l’objet source.","kind":"text","block":"P247","id":"technique-14-0-1"},{"label":"EX-076 — Documents indépendants. Un dessin de détail créé directement en 2D peut être publié conjointement avec des documents dérivés d’une maquette sans être présenté comme un extrait automatiquement synchronisé.","kind":"text","block":"P248","id":"technique-14-0-2"}],"kind":"section","source":"§ 14.1. Chaîne de production documentaire","block":"P245","id":"technique-14-0"},{"label":"14.2. Métrés, quantités et nomenclatures","children":[{"label":"EX-077 — Traçabilité des calculs. Chaque quantité comprend identifiant du jeu de sources, révision, règle et sa version, unité, objets inclus, exclusions, déductions, précision interne, arrondi de présentation et date. Un override manuel constitue une donnée distincte motivée, jamais le remplacement silencieux d’un calcul.","kind":"text","block":"P250","id":"technique-14-1-0"},{"label":"EX-078 — Cohérence des totaux. Une somme ne mélange pas sans signalement des quantités de règles incompatibles, d’unités différentes ou de révisions hétérogènes. Les totaux distinguent brut, net, déductions, quantités non testées et corrections manuelles.","kind":"text","block":"P251","id":"technique-14-1-1"},{"label":"IF-008 — Résultat quantitatif. quantityId + sourceRevisionSet + ruleId + ruleVersion + sourceObjectIds + unit + rawValue + deductions + displayValue + freshnessStatus ; manualAdjustment est facultatif, distinct, motivé et attribué. La décision de structure physique reste ouverte.","kind":"text","block":"P252","id":"technique-14-1-2"},{"label":"AC-008. Dans le test de référence du mur, les objets et révisions permettent de retrouver exactement les déductions 0,420 m³ puis 0,504 m³ et les volumes nets 3,180 m³ puis 3,096 m³. Les résultats historiques conservent leur source initiale.","kind":"text","block":"P253","id":"technique-14-1-3"}],"kind":"section","source":"§ 14.2. Métrés, quantités et nomenclatures","block":"P249","id":"technique-14-1"},{"label":"14.3. Contrat d’interopérabilité par format","children":[{"label":"Tableau — Format / Opérations cibles à spécifier / Contrôles et limites","children":[{"label":"Natif Studio","children":[{"label":"Opérations cibles à spécifier : Enregistrer, versionner, réouvrir, migrer.","kind":"text","id":"technique-14-2-0-0-0"},{"label":"Contrôles et limites : Version de schéma, identités, topologie, historique, conflits.","kind":"text","id":"technique-14-2-0-0-1"}],"kind":"row","id":"technique-14-2-0-0"},{"label":"PDF / SVG","children":[{"label":"Opérations cibles à spécifier : Générer vues, feuilles et documents.","kind":"text","id":"technique-14-2-0-1-0"},{"label":"Contrôles et limites : Échelles, polices, vectoriel/raster, contenu manquant et conservation.","kind":"text","id":"technique-14-2-0-1-1"}],"kind":"row","id":"technique-14-2-0-1"},{"label":"DXF","children":[{"label":"Opérations cibles à spécifier : Import/export du sous-ensemble explicitement accepté.","kind":"text","id":"technique-14-2-0-2-0"},{"label":"Contrôles et limites : Unitless, INSUNITS, calques, blocs, courbes, textes, hachures et attributs.","kind":"text","id":"technique-14-2-0-2-1"}],"kind":"row","id":"technique-14-2-0-2"},{"label":"DWG","children":[{"label":"Opérations cibles à spécifier : Échange seulement après choix d’une solution validée.","kind":"text","id":"technique-14-2-0-3-0"},{"label":"Contrôles et limites : Licence, fidélité, versions, pertes et limites légales.","kind":"text","id":"technique-14-2-0-3-1"}],"kind":"row","id":"technique-14-2-0-3"},{"label":"IFC","children":[{"label":"Opérations cibles à spécifier : Références, fédération et export sémantique selon couverture déclarée.","kind":"text","id":"technique-14-2-0-4-0"},{"label":"Contrôles et limites : Version/schéma, classes, propriétés, relations, placements et conversion éditable.","kind":"text","id":"technique-14-2-0-4-1"}],"kind":"row","id":"technique-14-2-0-4"},{"label":"BCF","children":[{"label":"Opérations cibles à spécifier : Échange d’observations contextualisées.","kind":"text","id":"technique-14-2-0-5-0"},{"label":"Contrôles et limites : Identifiants, statuts, vues, versions, correspondance des objets.","kind":"text","id":"technique-14-2-0-5-1"}],"kind":"row","id":"technique-14-2-0-5"},{"label":"STEP / OBJ / STL","children":[{"label":"Opérations cibles à spécifier : Géométrie selon outils retenus et formats supportés.","kind":"text","id":"technique-14-2-0-6-0"},{"label":"Contrôles et limites : Topologie, unités, précision, maillage vs solide et pertes sémantiques.","kind":"text","id":"technique-14-2-0-6-1"}],"kind":"row","id":"technique-14-2-0-6"},{"label":"CSV / tableaux","children":[{"label":"Opérations cibles à spécifier : Métrés et nomenclatures.","kind":"text","id":"technique-14-2-0-7-0"},{"label":"Contrôles et limites : Méthode, unités, identifiants sources et arrondis.","kind":"text","id":"technique-14-2-0-7-1"}],"kind":"row","id":"technique-14-2-0-7"}],"kind":"table","block":"T255","id":"technique-14-2-0"},{"label":"EX-079 — Capacité par sens d’échange. lecture, consultation, édition, export, aller-retour sont évalués séparément. Aucun simple export IFC ou DXF ne suffit à prouver un round-trip fidèle ; aucune certification n’est affirmée sans audit correspondant.","kind":"text","block":"P257","id":"technique-14-2-1"},{"label":"EX-080 — Rapport de transformation. Import et export signalent unités et repères, primitives non prises en charge, propriétés perdues, simplifications, conflits d’identifiants et éléments ignorés. Une source non prise en charge ne disparaît pas sans information.","kind":"text","block":"P258","id":"technique-14-2-2"}],"kind":"section","source":"§ 14.3. Contrat d’interopérabilité par format","block":"P254","id":"technique-14-2"},{"label":"14.4. Dossiers et manifestes immuables","children":[{"label":"IF-009 — Publication. Le manifeste contient : identifiant, intention/usage, date, auteur, état d’approbation, liste ordonnée de documentId + version + empreinte, références de modèles et de règles, rapports de contrôle et observations bloquantes résolues ou dérogées, ainsi que la décision d’approbation sur cet ensemble exact.","kind":"text","block":"P260","id":"technique-14-3-0"},{"label":"EX-081 — Ensemble coordonné. Plusieurs disciplines peuvent avoir des numéros de révision différents ; l’ensemble doit être explicitement coordonné et figé. Une modification après approbation remet en question l’éligibilité du nouveau dossier, pas l’intégrité de la publication historique.","kind":"text","block":"P261","id":"technique-14-3-1"},{"label":"EX-082 — Publication non réécrite. Retrait, remplacement ou nouvelle diffusion sont de nouveaux événements journalisés ; la publication antérieure demeure identifiable.","kind":"text","block":"P262","id":"technique-14-3-2"},{"label":"AC-009. Modifier un document après approbation puis tenter de publier sous l’ancienne décision provoque un blocage ou une demande de nouvel examen, avec comparaison explicite des empreintes concernées.","kind":"text","block":"P263","id":"technique-14-3-3"}],"kind":"section","source":"§ 14.4. Dossiers et manifestes immuables","block":"P259","id":"technique-14-3"}],"kind":"chapter","source":"§ 14. Documentation, métrés, interopérabilité et publication","block":"P244","id":"technique-14","number":"14","title":"Documentation, métrés, interopérabilité et publication","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#B26A31","bullets":["Chaîne de production documentaire","Métrés, quantités et nomenclatures","Contrat d’interopérabilité par format","Dossiers et manifestes immuables","Manifeste des versions et approbations"]},{"label":"15. Workflow, collaboration et permissions","children":[{"label":"15.1. Trois dimensions d’état indépendantes","children":[{"label":"Tableau — Dimension / Valeurs proposées / Objet concerné","children":[{"label":"Travail","children":[{"label":"Valeurs proposées : En cours, à contrôler, corrections demandées, à recontrôler, soumis, approuvé.","kind":"text","id":"technique-15-0-0-0-0"},{"label":"Objet concerné : Révision ou dossier candidat figé.","kind":"text","id":"technique-15-0-0-0-1"}],"kind":"row","id":"technique-15-0-0-0"},{"label":"Diffusion","children":[{"label":"Valeurs proposées : Non publié, publié, remplacé, retiré.","kind":"text","id":"technique-15-0-0-1-0"},{"label":"Objet concerné : Publication ou ensemble de livrables.","kind":"text","id":"technique-15-0-0-1-1"}],"kind":"row","id":"technique-15-0-0-1"},{"label":"Actualité du dérivé","children":[{"label":"Valeurs proposées : À jour pour la source, à recalculer, calcul en cours, échec.","kind":"text","id":"technique-15-0-0-2-0"},{"label":"Objet concerné : Vue, métrés, image ou rapport dérivé.","kind":"text","id":"technique-15-0-0-2-1"}],"kind":"row","id":"technique-15-0-0-2"}],"kind":"table","block":"T266","id":"technique-15-0-0"},{"label":"Une variante R12 peut être en cours pendant que sa publication R11 reste la dernière publication approuvée. Un bouton visible « Approuver » ne modifie aucun état sans transition autorisée côté serveur.","kind":"text","block":"P268","id":"technique-15-0-1"}],"kind":"section","source":"§ 15.1. Trois dimensions d’état indépendantes","block":"P265","id":"technique-15-0"},{"label":"15.2. Transitions et garde-fous","children":[{"label":"Tableau — Transition / Acteur/permission / Conditions minimales","children":[{"label":"En cours → À contrôler","children":[{"label":"Acteur/permission : Concepteur / responsable.","kind":"text","id":"technique-15-1-0-0-0"},{"label":"Conditions minimales : Contenu et sources soumis identifiés et figés pour revue.","kind":"text","id":"technique-15-1-0-0-1"}],"kind":"row","id":"technique-15-1-0-0"},{"label":"À contrôler → Corrections demandées","children":[{"label":"Acteur/permission : Contrôleur.","kind":"text","id":"technique-15-1-0-1-0"},{"label":"Conditions minimales : Constat(s), objet(s), preuve et décisions nécessaires.","kind":"text","id":"technique-15-1-0-1-1"}],"kind":"row","id":"technique-15-1-0-1"},{"label":"Corrections demandées → À recontrôler","children":[{"label":"Acteur/permission : Concepteur.","kind":"text","id":"technique-15-1-0-2-0"},{"label":"Conditions minimales : Nouvelle révision, description et preuves de correction.","kind":"text","id":"technique-15-1-0-2-1"}],"kind":"row","id":"technique-15-1-0-2"},{"label":"Contrôle satisfaisant → Soumis à approbation","children":[{"label":"Acteur/permission : Responsable habilité.","kind":"text","id":"technique-15-1-0-3-0"},{"label":"Conditions minimales : Tests et observations bloquantes traités selon le protocole.","kind":"text","id":"technique-15-1-0-3-1"}],"kind":"row","id":"technique-15-1-0-3"},{"label":"Soumis → Approuvé","children":[{"label":"Acteur/permission : Approbateur.","kind":"text","id":"technique-15-1-0-4-0"},{"label":"Conditions minimales : Ensemble inchangé, rôle autorisé, usage déclaré, journal.","kind":"text","id":"technique-15-1-0-4-1"}],"kind":"row","id":"technique-15-1-0-4"},{"label":"Soumis → Corrections demandées","children":[{"label":"Acteur/permission : Approbateur.","kind":"text","id":"technique-15-1-0-5-0"},{"label":"Conditions minimales : Motifs consignés, soumission conservée.","kind":"text","id":"technique-15-1-0-5-1"}],"kind":"row","id":"technique-15-1-0-5"},{"label":"Approuvé → Publié","children":[{"label":"Acteur/permission : Publieur.","kind":"text","id":"technique-15-1-0-6-0"},{"label":"Conditions minimales : Manifeste conforme à l’approbation, droits valides.","kind":"text","id":"technique-15-1-0-6-1"}],"kind":"row","id":"technique-15-1-0-6"},{"label":"Publié → Remplacé/Retiré","children":[{"label":"Acteur/permission : Rôle habilité.","kind":"text","id":"technique-15-1-0-7-0"},{"label":"Conditions minimales : Nouvelle action traçable, sans réécriture de l’historique.","kind":"text","id":"technique-15-1-0-7-1"}],"kind":"row","id":"technique-15-1-0-7"}],"kind":"table","block":"T270","id":"technique-15-1-0"},{"label":"EX-083 — Séparation des décisions. Approuver et publier sont deux permissions différentes. Un administrateur technique n’obtient pas automatiquement la fonction d’approbateur métier. Un cumul de rôles peut être autorisé selon taille d’équipe, mais un autocontrôle doit rester identifié comme tel.","kind":"text","block":"P272","id":"technique-15-1-1"},{"label":"EX-084 — Observations/tâches/décisions. Une annotation est une note ; une observation décrit un constat ; une tâche attribue une action à un responsable ; une décision enregistre un arbitrage. Ces objets sont reliables mais ne se substituent pas l’un à l’autre.","kind":"text","block":"P273","id":"technique-15-1-2"},{"label":"EX-085 — Délégation contrôlée. L’absence d’un approbateur ne vaut pas accord. Une délégation, si permise, possède portée, période, délégant/délégué, justification et événement d’audit.","kind":"text","block":"P274","id":"technique-15-1-3"},{"label":"AC-010. Un concepteur sans droit d’approbation peut afficher l’outil par recherche mais reçoit un refus d’exécution. La modification de son profil personnel n’influe pas sur le contrôle serveur.","kind":"text","block":"P275","id":"technique-15-1-4"}],"kind":"section","source":"§ 15.2. Transitions et garde-fous","block":"P269","id":"technique-15-1"},{"label":"15.3. Contrat d’une observation","children":[{"label":"IF-010 — Observation. Champs : issueId, catégorie, source du contrôle, révisions examinées, objets/vues, auteur, gravité selon règles décidées, description et pièces justificatives, responsable éventuel, état, journal de décisions, références des recontrôles et condition de clôture. Les identifiants BCF éventuels sont conservés comme références, non assimilés automatiquement aux identifiants internes.","kind":"text","block":"P277","id":"technique-15-2-0"},{"label":"EX-086 — Réexamen. Un contrôle de nouvelle révision rapproche les observations antérieures par identité/source/règle et produit un statut de suivi ; la fermeture automatique sur simple disparition d’un objet est interdite.","kind":"text","block":"P278","id":"technique-15-2-1"}],"kind":"section","source":"§ 15.3. Contrat d’une observation","block":"P276","id":"technique-15-2"}],"kind":"chapter","source":"§ 15. Workflow, collaboration et permissions","block":"P264","id":"technique-15","number":"15","title":"Workflow, collaboration et permissions","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#52647C","bullets":["Trois dimensions d’état indépendantes","Transitions et garde-fous","Contrat d’une observation","Approbation et publication distinctes","Suivi du travail, diffusion et actualité"]},{"label":"16. Services d’API, persistance et intégration native","children":[{"label":"16.1. Familles d’interfaces cibles","children":[{"label":"Les chemins HTTP ci-dessous sont des domaines de contrat et non des routes existantes promises. Les adaptateurs physiques seront définis à la décision d’architecture en cohérence avec les APIs Fadi.","kind":"text","block":"P281","id":"technique-16-0-0"},{"label":"Tableau — Contrat / Responsabilité / Exemple d’action logique","children":[{"label":"Studies","children":[{"label":"Responsabilité : Études, variantes, révisions, sources.","kind":"text","id":"technique-16-0-1-0-0"},{"label":"Exemple d’action logique : Créer étude, cloner variante, lire révision.","kind":"text","id":"technique-16-0-1-0-1"}],"kind":"row","id":"technique-16-0-1-0"},{"label":"DesignCommands","children":[{"label":"Responsabilité : Commandes, idempotence, conflits, journal.","kind":"text","id":"technique-16-0-1-1-0"},{"label":"Exemple d’action logique : Prévisualiser / confirmer une opération.","kind":"text","id":"technique-16-0-1-1-1"}],"kind":"row","id":"technique-16-0-1-1"},{"label":"ToolCatalogue","children":[{"label":"Responsabilité : Manifests, permissions déclarées, compatibilités.","kind":"text","id":"technique-16-0-1-2-0"},{"label":"Exemple d’action logique : Rechercher capacités et versions.","kind":"text","id":"technique-16-0-1-2-1"}],"kind":"row","id":"technique-16-0-1-2"},{"label":"ToolProfiles","children":[{"label":"Responsabilité : Préférences et synchronisation d’espaces.","kind":"text","id":"technique-16-0-1-3-0"},{"label":"Exemple d’action logique : Enregistrer / partager / restaurer un profil.","kind":"text","id":"technique-16-0-1-3-1"}],"kind":"row","id":"technique-16-0-1-3"},{"label":"Models","children":[{"label":"Responsabilité : Accès contrôlé aux objets canoniques et associations.","kind":"text","id":"technique-16-0-1-4-0"},{"label":"Exemple d’action logique : Lire un objet et ses dépendances.","kind":"text","id":"technique-16-0-1-4-1"}],"kind":"row","id":"technique-16-0-1-4"},{"label":"SpatialServices","children":[{"label":"Responsabilité : Calculs et index dérivés si serveur utile.","kind":"text","id":"technique-16-0-1-5-0"},{"label":"Exemple d’action logique : Calculer une projection liée à une révision.","kind":"text","id":"technique-16-0-1-5-1"}],"kind":"row","id":"technique-16-0-1-5"},{"label":"Checks","children":[{"label":"Responsabilité : Règles, lancement de contrôles et constats.","kind":"text","id":"technique-16-0-1-6-0"},{"label":"Exemple d’action logique : Lancer sur ensemble figé de sources.","kind":"text","id":"technique-16-0-1-6-1"}],"kind":"row","id":"technique-16-0-1-6"},{"label":"Jobs","children":[{"label":"Responsabilité : Tâches longues, statut, annulation, résultat.","kind":"text","id":"technique-16-0-1-7-0"},{"label":"Exemple d’action logique : Soumettre une exportation et suivre son job.","kind":"text","id":"technique-16-0-1-7-1"}],"kind":"row","id":"technique-16-0-1-7"},{"label":"Documents","children":[{"label":"Responsabilité : Vues, feuilles, quantités, rapports, stockage.","kind":"text","id":"technique-16-0-1-8-0"},{"label":"Exemple d’action logique : Composer un dossier et générer un livrable.","kind":"text","id":"technique-16-0-1-8-1"}],"kind":"row","id":"technique-16-0-1-8"},{"label":"Reviews","children":[{"label":"Responsabilité : Observations, tâches, transitions, approbations.","kind":"text","id":"technique-16-0-1-9-0"},{"label":"Exemple d’action logique : Soumettre, demander correction, approuver.","kind":"text","id":"technique-16-0-1-9-1"}],"kind":"row","id":"technique-16-0-1-9"},{"label":"Publications","children":[{"label":"Responsabilité : Manifeste immuable et diffusion.","kind":"text","id":"technique-16-0-1-10-0"},{"label":"Exemple d’action logique : Publier l’ensemble approuvé.","kind":"text","id":"technique-16-0-1-10-1"}],"kind":"row","id":"technique-16-0-1-10"},{"label":"ExternalAdapters","children":[{"label":"Responsabilité : Imports, exports, IFC/DXF/BCF et IA sous contrat.","kind":"text","id":"technique-16-0-1-11-0"},{"label":"Exemple d’action logique : Valider un échange, produire rapport de perte.","kind":"text","id":"technique-16-0-1-11-1"}],"kind":"row","id":"technique-16-0-1-11"}],"kind":"table","block":"T282","id":"technique-16-0-1"},{"label":"EX-087 — Intégration contrôlée. Les modules Fadi existants restent responsables des données transverses qu’ils possèdent. Tout nouvel endpoint nécessite un contrôle de droit tenant/projet, de schéma, de révision, d’idempotence, de taille d’entrée et de journal.","kind":"text","block":"P284","id":"technique-16-0-2"},{"label":"EX-088 — Isolation multi-utilisateurs. Le système interdit l’accès aux documents, profils et variantes d’un autre périmètre sans autorisation. Les URL de blob, résultats de jobs et exports temporairement accessibles sont soumis à l’autorisation de l’objet source.","kind":"text","block":"P285","id":"technique-16-0-3"},{"label":"EX-089 — Persistance et reprise. Une confirmation envoyée au navigateur doit correspondre à un engagement durable conforme au contrat de sauvegarde. Les sauvegardes, restaurations et récupérations d’incident sont testées sur un corpus contenant données de conception, associations et publications.","kind":"text","block":"P286","id":"technique-16-0-4"}],"kind":"section","source":"§ 16.1. Familles d’interfaces cibles","block":"P280","id":"technique-16-0"},{"label":"16.2. Versions, événements et synchronisation","children":[{"label":"IF-011 — Journal de changement. Événement avec eventId, transaction, auteur, étude/variante, révision base/issue, effets, horodatage serveur et relation éventuelle à un job. La diffusion de notifications ne constitue pas une confirmation métier sans engagement préalable.","kind":"text","block":"P288","id":"technique-16-1-0"},{"label":"EX-090 — Reconstruction. Une restauration doit permettre de retrouver le modèle canonique confirmé, les manifestes et leurs pièces, les références, les droits applicables et les identités des documents. Les caches GPU et index spatiaux sont reconstruits, non sauvegardés comme preuve faisant autorité.","kind":"text","block":"P289","id":"technique-16-1-1"}],"kind":"section","source":"§ 16.2. Versions, événements et synchronisation","block":"P287","id":"technique-16-1"},{"label":"16.3. Stratégie de migration de l’Atelier","children":[{"label":"Les composants identifiés dans le dépôt doivent être évalués, non recopiés ni remplacés automatiquement. La migration logique distingue : (a) conversion des dessins actuels ; (b) conservation des objets architecturaux et identités ; (c) découplage des Planche 2D et 3D ; (d) extraction des déclarations d’outils ; (e) conservation de l’historique et de la file hors connexion ; (f) prise en charge des documents approuvés.","kind":"text","block":"P291","id":"technique-16-2-0"},{"label":"EX-091 — Migration non destructrice. Une étude existante ne doit pas perdre une propriété, une cote, une association, un identifiant documentaire, une révision ou un accès sans rapport explicite, procédure d’accord et solution de restauration. Toute bascule définit des jeux d’essai d’avant/après et un point de retour arrière.","kind":"text","block":"P292","id":"technique-16-2-1"}],"kind":"section","source":"§ 16.3. Stratégie de migration de l’Atelier","block":"P290","id":"technique-16-2"}],"kind":"chapter","source":"§ 16. Services d’API, persistance et intégration native","block":"P279","id":"technique-16","number":"16","title":"Services d’API, persistance et intégration native","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#52647C","bullets":["Familles d’interfaces cibles","Versions, événements et synchronisation","Stratégie de migration de l’Atelier","Services autoritaires, versions et reprise","Intégration native sans source concurrente"]},{"label":"17. Sécurité, confidentialité et chaîne d’approvisionnement","children":[{"label":"17.1. Modèle de menaces minimal","children":[{"label":"Tableau — Menace / Contrôle requis / Scénario négatif","children":[{"label":"Manipulation des paramètres outil","children":[{"label":"Contrôle requis : Validation serveur et autorisation par opération.","kind":"text","id":"technique-17-0-0-0-0"},{"label":"Scénario négatif : Épaisseur négative ou objet appartenant à autrui.","kind":"text","id":"technique-17-0-0-0-1"}],"kind":"row","id":"technique-17-0-0-0"},{"label":"Outil découvert mais interdit","children":[{"label":"Contrôle requis : Contrôle effectif et refus journalisé.","kind":"text","id":"technique-17-0-0-1-0"},{"label":"Scénario négatif : Profil importe « Publier » sans droit.","kind":"text","id":"technique-17-0-0-1-1"}],"kind":"row","id":"technique-17-0-0-1"},{"label":"Extension compromise","children":[{"label":"Contrôle requis : Origine, signature/politique de confiance, permissions minimales, isolation.","kind":"text","id":"technique-17-0-0-2-0"},{"label":"Scénario négatif : Manifeste tente de charger un script arbitraire.","kind":"text","id":"technique-17-0-0-2-1"}],"kind":"row","id":"technique-17-0-0-2"},{"label":"Injection via DXF/IFC/BCF/texte","children":[{"label":"Contrôle requis : Validation, limites de taille, sanitation et parsing défensif.","kind":"text","id":"technique-17-0-0-3-0"},{"label":"Scénario négatif : Fichier malformé ou contenu actif injecté.","kind":"text","id":"technique-17-0-0-3-1"}],"kind":"row","id":"technique-17-0-0-3"},{"label":"Fuite de modèle vers un service IA","children":[{"label":"Contrôle requis : Autorisations, confidentialité, minimisation et politique fournisseur.","kind":"text","id":"technique-17-0-0-4-0"},{"label":"Scénario négatif : Transmission sans consentement/contrat adapté.","kind":"text","id":"technique-17-0-0-4-1"}],"kind":"row","id":"technique-17-0-0-4"},{"label":"Rejeu d’une commande","children":[{"label":"Contrôle requis : Idempotence et contexte de révision.","kind":"text","id":"technique-17-0-0-5-0"},{"label":"Scénario négatif : Double création de mur après reconnect.","kind":"text","id":"technique-17-0-0-5-1"}],"kind":"row","id":"technique-17-0-0-5"},{"label":"Résultat de job ancien","children":[{"label":"Contrôle requis : Vérification revisionId/empreinte d’entrée.","kind":"text","id":"technique-17-0-0-6-0"},{"label":"Scénario négatif : BRep ancienne remplace une scène corrigée.","kind":"text","id":"technique-17-0-0-6-1"}],"kind":"row","id":"technique-17-0-0-6"},{"label":"Accès cross-project","children":[{"label":"Contrôle requis : Isolation autoritaire par ressource, test d’accès.","kind":"text","id":"technique-17-0-0-7-0"},{"label":"Scénario négatif : Téléchargement d’un livrable d’un autre projet.","kind":"text","id":"technique-17-0-0-7-1"}],"kind":"row","id":"technique-17-0-0-7"},{"label":"Déni de service par calcul lourd","children":[{"label":"Contrôle requis : Limites, quotas, annulation, suivi mémoire/CPU.","kind":"text","id":"technique-17-0-0-8-0"},{"label":"Scénario négatif : Répétition de booléens coûteux.","kind":"text","id":"technique-17-0-0-8-1"}],"kind":"row","id":"technique-17-0-0-8"}],"kind":"table","block":"T295","id":"technique-17-0-0"},{"label":"EX-092 — Protection par défaut. Chaque mutation et lecture sensible passe par identification de session, autorisation dans le contexte et validation des entrées. La sécurité client sert à guider l’UX, jamais à remplacer le serveur.","kind":"text","block":"P297","id":"technique-17-0-1"},{"label":"EX-093 — Intégrité des modèles. Les commandes et opérations de géométrie vérifient contraintes, types, unités et appartenance. Le serveur refuse les mutations qui violeraient les invariants, même si l’outil client les présente comme valides.","kind":"text","block":"P298","id":"technique-17-0-2"},{"label":"EX-094 — Confidentialité des sources. Les rendus, fichiers importés, modèles de références et images adressés à un service externe ne le sont qu’au terme d’un contrôle de politique, avec conservation de la provenance et signalement des informations inconnues.","kind":"text","block":"P299","id":"technique-17-0-3"}],"kind":"section","source":"§ 17.1. Modèle de menaces minimal","block":"P294","id":"technique-17-0"},{"label":"17.2. Mise en production et exploitation","children":[{"label":"Le périmètre de conception doit préciser : politique CSP compatible avec les composants WASM requis ; durcissement d’API ; journalisation minimale ; alertes sur échecs de workers/jobs ; politique de sauvegarde et test de restauration ; détection de vulnérabilités des dépendances ; version du noyau et licence ; stratégie de rollback des bundles et schémas.","kind":"text","block":"P301","id":"technique-17-1-0"},{"label":"EX-095 — Observabilité. Des mesures agrégées de latence, de mémoire, d’erreurs et de tâches doivent permettre de détecter une dégradation de service sans enregistrer inutilement les géométries confidentielles ou des secrets d’accès. Les traces sont corrélées par identifiants non sensibles de commande/job.","kind":"text","block":"P302","id":"technique-17-1-1"},{"label":"EX-096 — Licence et provenance. L’utilisation de WASM ou moteurs tiers s’accompagne de l’inventaire des versions, licences et obligations de redistribution/remplacement applicables, vérifiées pour l’artefact effectivement distribué.","kind":"text","block":"P303","id":"technique-17-1-2"}],"kind":"section","source":"§ 17.2. Mise en production et exploitation","block":"P300","id":"technique-17-1"}],"kind":"chapter","source":"§ 17. Sécurité, confidentialité et chaîne d’approvisionnement","block":"P293","id":"technique-17","number":"17","title":"Sécurité, confidentialité et chaîne d’approvisionnement","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#52647C","bullets":["Modèle de menaces minimal","Mise en production et exploitation","Contrôles serveur indépendants du Registry","Traçabilité, dépendances et reprise","Gestion des transferts et traitements externes"]},{"label":"18. Performance, profils de charge et protocole de mesure","children":[{"label":"18.1. Mesures séparées, sans seuils inventés","children":[{"label":"Les budgets de performance relèvent du niveau 3 : chaque seuil associe un appareil, une scène, une opération, un environnement, une méthode, une distribution et un critère d’acceptation. Un écran à 60 Hz dispose théoriquement de 16,7 ms pour l’ensemble de la trame, mais cette valeur n’est pas une promesse de délai pour chaque outil.","kind":"text","block":"P306","id":"technique-18-0-0"},{"label":"Tableau — Code / Mesure / Profils à renseigner / Porte de qualité","children":[{"label":"PERF-01","children":[{"label":"Mesure : Ouverture de Studio jusqu’à la première action utile.","kind":"text","id":"technique-18-0-1-0-0"},{"label":"Profils à renseigner : Cache froid/chaud, réseau, CPU, appareil.","kind":"text","id":"technique-18-0-1-0-1"},{"label":"Porte de qualité : p50/p95 avec limite décidée.","kind":"text","id":"technique-18-0-1-0-2"}],"kind":"row","id":"technique-18-0-1-0"},{"label":"PERF-02","children":[{"label":"Mesure : Activation d’outil simple et spécialisé.","kind":"text","id":"technique-18-0-1-1-0"},{"label":"Profils à renseigner : Bundle, dépendances, worker, première réponse.","kind":"text","id":"technique-18-0-1-1-1"},{"label":"Porte de qualité : Temps d’activation + bytes + mémoire.","kind":"text","id":"technique-18-0-1-1-2"}],"kind":"row","id":"technique-18-0-1-1"},{"label":"PERF-03","children":[{"label":"Mesure : Pointeur → preview visible.","kind":"text","id":"technique-18-0-1-2-0"},{"label":"Profils à renseigner : Périphérique, FPS, densité de scène.","kind":"text","id":"technique-18-0-1-2-1"},{"label":"Porte de qualité : Latence de bout en bout.","kind":"text","id":"technique-18-0-1-2-2"}],"kind":"row","id":"technique-18-0-1-2"},{"label":"PERF-04","children":[{"label":"Mesure : Snapping/ciblage correct.","kind":"text","id":"technique-18-0-1-3-0"},{"label":"Profils à renseigner : 100 / 10 000 / 100 000 primitives illustratives, densité variable.","kind":"text","id":"technique-18-0-1-3-1"},{"label":"Porte de qualité : p50/p95/p99 ET conformité géométrique.","kind":"text","id":"technique-18-0-1-3-2"}],"kind":"row","id":"technique-18-0-1-3"},{"label":"PERF-05","children":[{"label":"Mesure : Navigation 2D/3D.","kind":"text","id":"technique-18-0-1-4-0"},{"label":"Profils à renseigner : Plans annotés, modèles BIM mixtes, GPU réel.","kind":"text","id":"technique-18-0-1-4-1"},{"label":"Porte de qualité : CPU/GPU séparés, trames manquées.","kind":"text","id":"technique-18-0-1-4-2"}],"kind":"row","id":"technique-18-0-1-4"},{"label":"PERF-06","children":[{"label":"Mesure : Modif. objet architectural.","kind":"text","id":"technique-18-0-1-5-0"},{"label":"Profils à renseigner : Mur hôte, ouvertures, dépendances, index.","kind":"text","id":"technique-18-0-1-5-1"},{"label":"Porte de qualité : Coût d’invalidation vs reconstruction totale.","kind":"text","id":"technique-18-0-1-5-2"}],"kind":"row","id":"technique-18-0-1-5"},{"label":"PERF-07","children":[{"label":"Mesure : Booléen exact.","kind":"text","id":"technique-18-0-1-6-0"},{"label":"Profils à renseigner : Formes simples, cas dégénérés, BRep fournisseurs.","kind":"text","id":"technique-18-0-1-6-1"},{"label":"Porte de qualité : Chargement, calcul, mémoire, erreurs, précision.","kind":"text","id":"technique-18-0-1-6-2"}],"kind":"row","id":"technique-18-0-1-6"},{"label":"PERF-08","children":[{"label":"Mesure : Génération documentaire.","kind":"text","id":"technique-18-0-1-7-0"},{"label":"Profils à renseigner : Détails, vues, feuilles multi-sources, PDF/DXF.","kind":"text","id":"technique-18-0-1-7-1"},{"label":"Porte de qualité : Temps, annulation, export fidèle.","kind":"text","id":"technique-18-0-1-7-2"}],"kind":"row","id":"technique-18-0-1-7"},{"label":"PERF-09","children":[{"label":"Mesure : Mémoire longue session.","kind":"text","id":"technique-18-0-1-8-0"},{"label":"Profils à renseigner : Changement d’outils, fermer/réouvrir.","kind":"text","id":"technique-18-0-1-8-1"},{"label":"Porte de qualité : Pic, résiduelle, absence de fuite.","kind":"text","id":"technique-18-0-1-8-2"}],"kind":"row","id":"technique-18-0-1-8"},{"label":"PERF-10","children":[{"label":"Mesure : Travail hors ligne.","kind":"text","id":"technique-18-0-1-9-0"},{"label":"Profils à renseigner : Profils en cache, interruption/sync.","kind":"text","id":"technique-18-0-1-9-1"},{"label":"Porte de qualité : Disponibilité réelle et données récupérables.","kind":"text","id":"technique-18-0-1-9-2"}],"kind":"row","id":"technique-18-0-1-9"}],"kind":"table","block":"T307","id":"technique-18-0-1"},{"label":"Les densités chiffrées sont des tailles de jeux d’essai candidates et non des engagements de capacité. Les seuils et appareils seront validés à la décision DEC-13.","kind":"text","block":"P309","id":"technique-18-0-2"}],"kind":"section","source":"§ 18.1. Mesures séparées, sans seuils inventés","block":"P305","id":"technique-18-0"},{"label":"18.2. Scènes représentatives","children":[{"label":"Scène S1 : détail 2D isolé avec cotes, textes, hachures, blocs, entités courbes et contraintes. S2 : plan de niveau avec murs, portes, fenêtres, croisements et références liées. S3 : plan 2D très dense, entités superposées et intersections nombreuses. S4 : immeuble multi-niveaux, structure, réseaux et composants répétitifs. S5 : géométrie 3D libre avec booléens, courbes exactes et surfaces complexes. S6 : étude avec plusieurs variantes, révisions, dossiers et contrôles. S7 : session hors réseau puis reconnectée. Chaque scène a une licence d’utilisation autorisée et une empreinte de corpus conservée.","kind":"text","block":"P311","id":"technique-18-1-0"}],"kind":"section","source":"§ 18.2. Scènes représentatives","block":"P310","id":"technique-18-1"},{"label":"18.3. Méthode","children":[{"label":"EX-097 — Mesure reproductible. Fixer matériel, navigateur/version, mémoire, GPU/driver, taille d’écran, statut des caches, réseau, build, commit, répétitions, opérations, outliers et méthode statistique ; conserver traces et scripts. Les mesures JavaScript renderer.render() ne sont pas assimilées automatiquement au coût GPU, et SwiftShader ne remplace pas un GPU physique.","kind":"text","block":"P313","id":"technique-18-2-0"},{"label":"EX-098 — Double vérification. Tout gain de performance est accompagné d’une comparaison géométrique et fonctionnelle : mêmes cibles de snapping, même sélection, mêmes dimensions/quantités, mêmes objets exportés dans les tolérances, même comportement d’annulation et de conflits.","kind":"text","block":"P314","id":"technique-18-2-1"},{"label":"EX-099 — Adaptativité conditionnée. La dégradation graphique répond aux mesures et aux préférences ; aucune réduction d’effet ne peut affecter les invariants de conception. Le résultat demeure publiable sur données de référence, indépendamment de la qualité instantanée de la prévisualisation.","kind":"text","block":"P315","id":"technique-18-2-2"}],"kind":"section","source":"§ 18.3. Méthode","block":"P312","id":"technique-18-2"}],"kind":"chapter","source":"§ 18. Performance, profils de charge et protocole de mesure","block":"P304","id":"technique-18","number":"18","title":"Performance, profils de charge et protocole de mesure","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#176CAE","bullets":["Mesures séparées, sans seuils inventés","Scènes représentatives","Méthode","Latence, mémoire et fidélité séparées","Aucun seuil inconnu présenté comme conforme"]},{"label":"19. Stratégie d’essais, critères d’acceptation et preuves","children":[{"label":"19.1. Pyramide de validation","children":[{"label":"Tableau — Niveau / But / Livrable/preuve attendue","children":[{"label":"Test unitaire","children":[{"label":"But : Géométrie, calculs, contrats purs, invariants locaux.","kind":"text","id":"technique-19-0-0-0-0"},{"label":"Livrable/preuve attendue : Corpus, résultats attendus, tolérances et rapport machine.","kind":"text","id":"technique-19-0-0-0-1"}],"kind":"row","id":"technique-19-0-0-0"},{"label":"Test de contrat","children":[{"label":"But : Manifests, schemas, permissions, messages workers, versioning.","kind":"text","id":"technique-19-0-0-1-0"},{"label":"Livrable/preuve attendue : Vérifications positives/négatives et compatibilité.","kind":"text","id":"technique-19-0-0-1-1"}],"kind":"row","id":"technique-19-0-0-1"},{"label":"Test d’intégration","children":[{"label":"But : Commandes ↔ modèle ↔ scènes ↔ documents ↔ API.","kind":"text","id":"technique-19-0-0-2-0"},{"label":"Livrable/preuve attendue : Tests reproductibles et versions source/sortie.","kind":"text","id":"technique-19-0-0-2-1"}],"kind":"row","id":"technique-19-0-0-2"},{"label":"Test E2E métier","children":[{"label":"But : Trois parcours 2D, 3D, associé ; revue et publication.","kind":"text","id":"technique-19-0-0-3-0"},{"label":"Livrable/preuve attendue : Scénarios utilisateur, captures/provenance et décision.","kind":"text","id":"technique-19-0-0-3-1"}],"kind":"row","id":"technique-19-0-0-3"},{"label":"Test de non-régression","children":[{"label":"But : Ancien vs nouveau rendu ou calcul.","kind":"text","id":"technique-19-0-0-4-0"},{"label":"Livrable/preuve attendue : Équivalence géométrique et fonctionnelle dans tolérances.","kind":"text","id":"technique-19-0-0-4-1"}],"kind":"row","id":"technique-19-0-0-4"},{"label":"Benchmark contrôlé","children":[{"label":"But : Latence, chargement, mémoire, GPU, offline.","kind":"text","id":"technique-19-0-0-5-0"},{"label":"Livrable/preuve attendue : Profils S1–S7, distributions, scripts et décision DEC-13.","kind":"text","id":"technique-19-0-0-5-1"}],"kind":"row","id":"technique-19-0-0-5"},{"label":"Test de résilience","children":[{"label":"But : Worker crash, réseau interrompu, quotas/cache, restauration.","kind":"text","id":"technique-19-0-0-6-0"},{"label":"Livrable/preuve attendue : Récupération, absence de doublons et audit.","kind":"text","id":"technique-19-0-0-6-1"}],"kind":"row","id":"technique-19-0-0-6"},{"label":"Test de sécurité","children":[{"label":"But : Accès inter-projet, permissions, mutations, extensions, imports.","kind":"text","id":"technique-19-0-0-7-0"},{"label":"Livrable/preuve attendue : Scénarios de refus et contrôles serveur.","kind":"text","id":"technique-19-0-0-7-1"}],"kind":"row","id":"technique-19-0-0-7"}],"kind":"table","block":"T318","id":"technique-19-0-0"},{"label":"EX-100 — Critère de preuve. Une preuve est rattachée à build, commit, version du contrat, jeu de données/empreinte, environnement, auteur/exécutant, horodatage, verdict, logs utiles et référence stable. « La CI est verte » ne prouve pas qu’un scénario non présent dans la CI a été testé.","kind":"text","block":"P320","id":"technique-19-0-1"},{"label":"EX-101 — Gestion des régressions. Un correctif modifiant la géométrie, les projections, les workers ou le Registry déclenche les tests pertinents d’exactitude, d’historique, de permissions, de persistance et de compatibilité des profils.","kind":"text","block":"P321","id":"technique-19-0-2"}],"kind":"section","source":"§ 19.1. Pyramide de validation","block":"P317","id":"technique-19-0"},{"label":"19.2. Tableau des scénarios vérifiables","children":[{"label":"Les tests suivants sont prescrits et non exécutés dans la préparation de ce document. Leur état initial est à réaliser ; le dossier de validation consignera les résultats et dérogations.","kind":"text","block":"P323","id":"technique-19-1-0"},{"label":"Tableau — TEST / Situation / Attendu / critère discriminant","children":[{"label":"TEST-001","children":[{"label":"Situation : Nouvelle étude, Planche 2D seule.","kind":"text","id":"technique-19-1-1-0-0"},{"label":"Attendu / critère discriminant : Dessiner, coter, enregistrer, fermer, rouvrir et publier sans modèle 3D.","kind":"text","id":"technique-19-1-1-0-1"}],"kind":"row","id":"technique-19-1-1-0"},{"label":"TEST-002","children":[{"label":"Situation : Nouvelle étude, Planche 3D seule.","kind":"text","id":"technique-19-1-1-1-0"},{"label":"Attendu / critère discriminant : Construire volume, éditer faces, sauvegarder et dériver une vue plane.","kind":"text","id":"technique-19-1-1-1-1"}],"kind":"row","id":"technique-19-1-1-1"},{"label":"TEST-003","children":[{"label":"Situation : Modifier un mur associé depuis 2D puis 3D.","kind":"text","id":"technique-19-1-1-2-0"},{"label":"Attendu / critère discriminant : Même objectId, paramètres et hôtes cohérents dans les deux planches.","kind":"text","id":"technique-19-1-1-2-1"}],"kind":"row","id":"technique-19-1-1-2"},{"label":"TEST-004","children":[{"label":"Situation : Copie indépendante d’un profil et d’un objet.","kind":"text","id":"technique-19-1-1-3-0"},{"label":"Attendu / critère discriminant : Nouvelles identités ; aucune propagation vers la source d’origine.","kind":"text","id":"technique-19-1-1-3-1"}],"kind":"row","id":"technique-19-1-1-3"},{"label":"TEST-005","children":[{"label":"Situation : Extruder un profil 2D.","kind":"text","id":"technique-19-1-1-4-0"},{"label":"Attendu / critère discriminant : Demande explicite de hauteur/direction et relation de suivi.","kind":"text","id":"technique-19-1-1-4-1"}],"kind":"row","id":"technique-19-1-1-4"},{"label":"TEST-006","children":[{"label":"Situation : Modifier profil source lié.","kind":"text","id":"technique-19-1-1-5-0"},{"label":"Attendu / critère discriminant : Volume dépendant recalculé ou invalidé sans réponse ancienne.","kind":"text","id":"technique-19-1-1-5-1"}],"kind":"row","id":"technique-19-1-1-5"},{"label":"TEST-007","children":[{"label":"Situation : Diviser une face cotée en deux.","kind":"text","id":"technique-19-1-1-6-0"},{"label":"Attendu / critère discriminant : Rattachement prouvé ou statut « à résoudre » ; aucune approximation silencieuse.","kind":"text","id":"technique-19-1-1-6-1"}],"kind":"row","id":"technique-19-1-1-6"},{"label":"TEST-008","children":[{"label":"Situation : Porte déplacée hors du mur hôte.","kind":"text","id":"technique-19-1-1-7-0"},{"label":"Attendu / critère discriminant : Refus atomique ou résolution explicite, sans géométrie partielle.","kind":"text","id":"technique-19-1-1-7-1"}],"kind":"row","id":"technique-19-1-1-7"},{"label":"TEST-009","children":[{"label":"Situation : Mur 6 × 3 × 0,2 et ouverture 1 × 2,1.","kind":"text","id":"technique-19-1-1-8-0"},{"label":"Attendu / critère discriminant : 3,600 m³ brut, 0,420 m³ déduit, 3,180 m³ net.","kind":"text","id":"technique-19-1-1-8-1"}],"kind":"row","id":"technique-19-1-1-8"},{"label":"TEST-010","children":[{"label":"Situation : Agrandir l’ouverture à 1,2 m depuis l’autre planche.","kind":"text","id":"technique-19-1-1-9-0"},{"label":"Attendu / critère discriminant : Nouveau volume net 3,096 m³ ; révision historique inchangée.","kind":"text","id":"technique-19-1-1-9-1"}],"kind":"row","id":"technique-19-1-1-9"},{"label":"TEST-011","children":[{"label":"Situation : Annuler/rétablir l’opération associée.","kind":"text","id":"technique-19-1-1-10-0"},{"label":"Attendu / critère discriminant : Références stables, métrés/affichage corrects, aucune perte de publication.","kind":"text","id":"technique-19-1-1-10-1"}],"kind":"row","id":"technique-19-1-1-10"},{"label":"TEST-012","children":[{"label":"Situation : Modifier simultanément même mur sur deux sessions.","kind":"text","id":"technique-19-1-1-11-0"},{"label":"Attendu / critère discriminant : Conflit revalidé, pas d’écrasement P326","id":"technique-19-2"}],"kind":"chapter","source":"§ 19. Stratégie d’essais, critères d’acceptation et preuves","block":"P316","id":"technique-19","number":"19","title":"Stratégie d’essais, critères d’acceptation et preuves","tag":"RÉFÉRENTIEL · CHAPITRE","color":"#218471","bullets":["Pyramide de validation","Tableau des scénarios vérifiables","Tests spécifiques des outils","Trois parcours métiers distincts à démontrer","Scénarios, critères et résultats documentés"]},{"label":"20. Traçabilité bidirectionnelle des exigences et décisions","children":[{"label":"20.1. Modèle du registre de traçabilité","children":[{"label":"EX-102 — Lien bidirectionnel. Toute exigence de niveau 2 dispose au minimum d’un identifiant, d’une source de niveau 1, d’un propriétaire métier, d’un contrat, d’un composant candidat, de tests, de preuves, d’un état et d’une décision si un arbitrage est requis. Les composants existants sont des candidats jusqu’à leur audit. Un test identifie l’exigence qu’il vérifie ; un composant identifie les exigences qu’il satisfait.","kind":"text","block":"P331","id":"technique-20-0-0"},{"label":"Tableau — Champ / Objet / Exemple indicatif","children":[{"label":"requirementId","children":[{"label":"Objet : Identifiant stable.","kind":"text","id":"technique-20-0-1-0-0"},{"label":"Exemple indicatif : EX-025","kind":"text","id":"technique-20-0-1-0-1"}],"kind":"row","id":"technique-20-0-1-0"},{"label":"level1Anchor","children":[{"label":"Objet : Principe de charte.","kind":"text","id":"technique-20-0-1-1-0"},{"label":"Exemple indicatif : « Non-régression géométrique ».","kind":"text","id":"technique-20-0-1-1-1"}],"kind":"row","id":"technique-20-0-1-1"},{"label":"ownerDomain","children":[{"label":"Objet : Responsable fonctionnel.","kind":"text","id":"technique-20-0-1-2-0"},{"label":"Exemple indicatif : D1.","kind":"text","id":"technique-20-0-1-2-1"}],"kind":"row","id":"technique-20-0-1-2"},{"label":"contractId","children":[{"label":"Objet : Interface/outil/alg
