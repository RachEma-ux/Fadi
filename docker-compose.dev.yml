# Fadi — services de développement local (jamais en production) : PostGIS et Mailpit, le serveur SMTP de test qui
# capture tous les courriels (aucun n'est remis). Interface Mailpit : http://localhost:8025.
#
#   docker compose -f docker-compose.dev.yml up -d
#   # apps/api/.env : DATABASE_URL=postgresql://fadi:fadi_dev_password@localhost:5432/fadi
#   #                 MAIL_TRANSPORT=smtp SMTP_HOST=localhost SMTP_PORT=1025 SMTP_SECURE=false
#   #                 SMTP_USER=noreply@fadi.test MAIL_FROM="Fadi <noreply@fadi.test>" APP_PUBLIC_URL=http://localhost:5173
#   #                 MAIL_ALLOW_RESERVED_DOMAINS=true   # comptes @example.test capturés par Mailpit (UM-28)

services:
  db:
    image: postgis/postgis:16-3.4
    # BD-6 (chantier bases-de-donnees) : statistiques des requêtes (pg_stat_statements, extension créée par la migration)
    # et journal des instructions de plus d'une seconde, sans les valeurs des paramètres (aucune donnée personnelle).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_parameter_max_length=0
    environment:
      POSTGRES_USER: fadi
      POSTGRES_PASSWORD: fadi_dev_password
      POSTGRES_DB: fadi
    ports:
      - "5432:5432"
    volumes:
      - fadi-dev-db:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.20.4
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  fadi-dev-db:
