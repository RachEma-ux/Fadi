name: Builder Deploy

# Inspired by the "Builder Deploy" workflow pattern (run the app, publish a
# temporary public URL via a Cloudflare quick tunnel, tear it down after a
# fixed duration). Rewritten for what Fadi actually is: two apps (apps/web,
# apps/api) talking to a real PostgreSQL+PostGIS database, with Fadi's own
# auth — not Builder's WASM pack / OAuth portal / Ollama / OpenCode
# machinery, which has no equivalent here and would just fail or do nothing
# useful against this codebase.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Combien de temps garder l'application accessible (minutes)"
        required: true
        default: "15"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
          - "30"

permissions:
  contents: read
  # L'URL du tunnel est aussi publiée comme « deployment status » (environment_url) : lisible par l'API GitHub
  # pendant que le job tourne, sans attendre la fin du run ni ouvrir les journaux.
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ≈ 5 min (installation, tests, build) + publication au pire ≈ 30 min (3 tunnels × 90 s d'enregistrement
    # + 24 sondes de ≤ 21 s : dig 2 × 3 s, curl 10 s, pause 5 s) + durée demandée (30 min au plus) : la fenêtre
    # annoncée reste entière et les étapes de fin (statut, arrêt, journaux) ont le temps de tourner.
    timeout-minutes: 75

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fadi
          POSTGRES_PASSWORD: fadi_deploy_password
          POSTGRES_DB: fadi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://fadi:fadi_deploy_password@localhost:5432/fadi
      # Mode de production : l'API sert le build de l'application (WEB_DIST) — un seul port à tunneliser, pas de vite preview.
      WEB_ORIGIN: http://localhost:3001
      WEB_DIST: apps/web/dist
      PORT: "3001"
      # See apps/api/.env.test.example: app.test.ts's authorization scenarios
      # outrun the production auth rate limit within a single test run.
      AUTH_RATE_LIMIT: "500"
      API_RATE_LIMIT: "5000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply database schema
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      # Même séquence que le job `validate` de la CI. La garde DB (#157, DB-1/2) refuse au chargement les suites API
      # qui exigent une base attestée (`TARGET_REQUIRED`, registre d'autorités vide tant que DB-3 n'est pas autorisé) :
      # un `npm test` global échoue donc par construction. Ces suites ne sont ni contournées ni déclarées réussies ;
      # le contrôle exige que seule la liste fermée soit refusée, par la garde seule, et que tout le reste passe.
      # Aucune suite ne touche donc la base de démonstration : elle reste vide (schéma seul) pour la personne qui
      # ouvre l'URL.
      - name: Tests des paquets purs et du web
        run: npm run test --workspace=@parcours/core-geometry --workspace=@parcours/domain-model --workspace=@parcours/atelier-model --workspace=@parcours/planche-model --workspace=@parcours/sandbox-planche-model --workspace=@parcours/geometry-exact --workspace=@fadi/web

      - name: Garde DB-1/2 — tests simulés sans base
        run: npm run test:db-guard

      - name: Tests API hors base — suites DB-3 déclarées non exécutées
        run: |
          npx --workspace=@fadi/api vitest run --reporter=default --reporter=json --outputFile=../../api-vitest.json || true
          node scripts/check-api-tests-db3.mjs api-vitest.json

      - name: Build
        run: npm run build

      - name: Start the API
        run: |
          echo "🚀 Starting apps/api on :3001..."
          node apps/api/dist/server.js > api.log 2>&1 &
          echo $! > api.pid

          for attempt in $(seq 1 18); do
            if ! kill -0 "$(cat api.pid)" 2>/dev/null; then
              echo "❌ API process exited before becoming healthy"
              cat api.log
              exit 1
            fi
            if curl -fsS http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ API healthy on :3001"
              break
            fi
            echo "⌛ Waiting for the API (attempt ${attempt}/18)..."
            sleep 3
          done
          curl -fsS http://localhost:3001/health || { echo "❌ API never became healthy"; cat api.log; exit 1; }

      - name: Check the application is served by the API
        run: |
          # /accueil est une route du client : l'API renvoie index.html (repli SPA) ; /health répond en JSON.
          curl -fsS -H "Accept: text/html" http://localhost:3001/accueil | grep -q '<div id="root"' || { echo "❌ L'API ne sert pas l'application (WEB_DIST)"; cat api.log; exit 1; }
          echo "✅ Application servie par l'API sur :3001"

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared --version

      - name: Publish a public URL
        run: |
          set -uo pipefail

          # cloudflared affiche l'adresse *.trycloudflare.com AVANT d'avoir ouvert sa connexion vers Cloudflare : une
          # adresse affichée n'est donc pas une adresse qui répond (run 39243674363 : 30 essais dns=non http=000, URL
          # publiée quand même, DNS_PROBE_FINISHED_NXDOMAIN sur le téléphone). Une tentative n'est retenue que si la
          # connexion est enregistrée, si le nom répond sur 1.1.1.1 et 8.8.8.8 et si l'application répond (HTTP 200)
          # à travers le tunnel ; sinon le tunnel est arrêté et relancé (nouvelle adresse). Après 3 échecs, le job
          # échoue : aucune adresse morte n'est annoncée.
          # --protocol http2 (TCP 443) : le protocole par défaut, QUIC (UDP 7844), est souvent mal acheminé depuis les
          # runners GitHub et laisse le tunnel sans connexion.
          TUNNEL_URL=""
          TUNNEL_PID=""
          READY=""
          stop_tunnel() {
            if [ -n "$TUNNEL_PID" ] && kill -0 "$TUNNEL_PID" 2>/dev/null; then
              kill "$TUNNEL_PID" 2>/dev/null || true
              wait "$TUNNEL_PID" 2>/dev/null || true
            fi
          }
          for outer in $(seq 1 3); do
            echo "🌐 Starting Cloudflare tunnel (attempt ${outer}/3)..."
            : > tunnel.log
            ./cloudflared tunnel --no-autoupdate --protocol http2 --url http://localhost:3001 >> tunnel.log 2>&1 &
            TUNNEL_PID=$!
            TUNNEL_URL=""

            # 1. Adresse affichée et connexion enregistrée (90 s au plus).
            REGISTERED=""
            for attempt in $(seq 1 18); do
              if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
                echo "⚠️ cloudflared s'est arrêté (tentative ${outer})"
                break
              fi
              TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1 || true)
              grep -q 'Registered tunnel connection' tunnel.log && REGISTERED=1
              if [ -n "$TUNNEL_URL" ] && [ -n "$REGISTERED" ]; then
                echo "✅ Adresse ${TUNNEL_URL} et connexion enregistrée (tentative ${outer}, ${attempt} essai(s))"
                break
              fi
              echo "⌛ Tunnel (tentative ${outer}, essai ${attempt}/18) : adresse=${TUNNEL_URL:-aucune} connexion=${REGISTERED:-non}"
              sleep 5
            done

            # 2. Nom résolu sur des résolveurs publics et application servie à travers le tunnel (120 s au plus).
            # Le nom vient d'être créé : un téléphone qui l'ouvre trop tôt garde quelques minutes une réponse négative
            # (DNS_PROBE_FINISHED_NXDOMAIN). On n'annonce l'adresse qu'une fois qu'elle répond.
            if [ -n "$TUNNEL_URL" ] && [ -n "$REGISTERED" ]; then
              HOST="${TUNNEL_URL#https://}"
              for attempt in $(seq 1 24); do
                DNS_OK=""
                if command -v dig >/dev/null 2>&1; then
                  [ -n "$(dig +short +time=3 +tries=1 "$HOST" @1.1.1.1 2>/dev/null)" ] && [ -n "$(dig +short +time=3 +tries=1 "$HOST" @8.8.8.8 2>/dev/null)" ] && DNS_OK=1
                else
                  getent hosts "$HOST" >/dev/null 2>&1 && DNS_OK=1
                fi
                HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$TUNNEL_URL/" 2>/dev/null || true)
                if [ -n "$DNS_OK" ] && [ "$HTTP_CODE" = "200" ]; then
                  READY=1
                  echo "✅ Nom résolu sur 1.1.1.1 et 8.8.8.8, application servie à travers le tunnel (HTTP ${HTTP_CODE}) après ${attempt} essai(s)"
                  break
                fi
                echo "⌛ Propagation DNS / tunnel (tentative ${outer}, essai ${attempt}/24) : dns=${DNS_OK:-non} http=${HTTP_CODE:-000}"
                sleep 5
              done
            fi

            [ -n "$READY" ] && break
            echo "⚠️ Tentative ${outer} sans adresse joignable — journal de cloudflared :"
            tail -n 40 tunnel.log || true
            stop_tunnel
            [ "$outer" -lt 3 ] && { echo "🔁 Nouveau tunnel dans 10 s..."; sleep 10; }
          done

          if [ -z "$READY" ]; then
            echo "❌ Aucun tunnel joignable après 3 tentatives : aucune URL n'est publiée (voir le journal de cloudflared ci-dessus et l'artefact des journaux)."
            exit 1
          fi

          echo "$TUNNEL_URL" > app_url.txt
          echo "$TUNNEL_PID" > tunnel.pid

          # Annotation du job : l'URL est lisible par l'API GitHub (check-runs) dès cette étape,
          # sans attendre la fin du run ni ouvrir les journaux.
          echo "::notice title=Fadi en ligne::$TUNNEL_URL (disponible ${{ github.event.inputs.duration }} minutes à partir de maintenant). Si le navigateur dit « site inaccessible » / DNS_PROBE_FINISHED_NXDOMAIN : attendez une minute et rechargez, ou passez du Wi-Fi aux données mobiles (le nom vient d'être créé)."

          echo ""
          echo "============================================"
          echo "🎉 Fadi est en ligne"
          echo "============================================"
          echo "🌐 URL : $TUNNEL_URL"
          echo "⏱️  Disponible ${{ github.event.inputs.duration }} minutes à partir de maintenant"
          echo "ℹ️  « Site inaccessible » / DNS_PROBE_FINISHED_NXDOMAIN sur le téléphone : attendez une minute et rechargez,"
          echo "    ou passez du Wi-Fi aux données mobiles — le nom vient d'être créé et certains résolveurs gardent"
          echo "    quelques minutes une première réponse négative."
          echo "============================================"

      - name: Publish the URL as a deployment status (readable through the API)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f app_url.txt ] || exit 0
          TUNNEL_URL=$(cat app_url.txt)
          API="https://api.github.com/repos/${{ github.repository }}"
          DEP_ID=$(curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            "$API/deployments" \
            -d "{\"ref\":\"${{ github.sha }}\",\"environment\":\"recette\",\"auto_merge\":false,\"required_contexts\":[],\"transient_environment\":true,\"description\":\"Builder Deploy #${{ github.run_number }}\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')
          if [ -n "$DEP_ID" ]; then
            curl -sS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
              "$API/deployments/$DEP_ID/statuses" \
              -d "{\"state\":\"success\",\"environment_url\":\"$TUNNEL_URL\",\"description\":\"En ligne ${{ github.event.inputs.duration }} min à partir de la publication\",\"auto_inactive\":true}"
            echo "✅ Deployment status publié : $TUNNEL_URL"
          else
            echo "⚠️ Deployment non créé (droits ?) : l'URL reste dans le résumé et les journaux."
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Fadi — Builder Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f app_url.txt ]; then
            TUNNEL_URL=$(cat app_url.txt)
            echo "### Application en ligne" >> "$GITHUB_STEP_SUMMARY"
            echo "🌐 **[$TUNNEL_URL]($TUNNEL_URL)**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Disponible pendant ${{ github.event.inputs.duration }} minutes à partir de cette étape." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**« Site inaccessible » / DNS_PROBE_FINISHED_NXDOMAIN ?** Le nom vient d'être créé : attendez une minute et rechargez, ou passez du Wi-Fi aux données mobiles (certains résolveurs gardent quelques minutes une première réponse négative)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "C'est une base de données PostgreSQL/PostGIS jetable (service du job) : créez un compte," >> "$GITHUB_STEP_SUMMARY"
            echo "rien n'est conservé après la fin de ce run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Le déploiement a échoué avant de publier une URL — voir les logs du job et les artefacts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the app running
        if: always()
        run: |
          if [ -f app_url.txt ]; then
            DURATION_SECONDS=$(( ${{ github.event.inputs.duration }} * 60 ))
            echo "💤 Maintien en ligne pendant ${DURATION_SECONDS}s..."
            sleep "$DURATION_SECONDS"
          else
            echo "Rien à maintenir en ligne : le déploiement a échoué plus haut."
          fi

      - name: Stop everything
        if: always()
        run: |
          [ -f tunnel.pid ] && kill "$(cat tunnel.pid)" 2>/dev/null || true
          [ -f web.pid ] && kill "$(cat web.pid)" 2>/dev/null || true
          [ -f api.pid ] && kill "$(cat api.pid)" 2>/dev/null || true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: builder-deploy-logs-${{ github.run_id }}
          path: |
            app_url.txt
            api.log
            web.log
            tunnel.log
          retention-days: 7
          if-no-files-found: ignore
