name: Sécurité — analyse de secrets

# SUIVI-10 : le suivi public ne contient ni secret, ni URL sensible, ni géométrie privée de client. Outil sans dépendance
# (scripts/securite/analyse-secrets.mjs : motifs + autorisations motivées). Sur une PR, les lignes ajoutées par chacun de
# ses commits sont aussi lues (un secret ajouté puis retiré reste dans l'historique publié). Toutes les PR : pas de filtre
# de chemins, le job peut être exigé par une règle.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: securite-secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Sécurité — secrets, URL sensibles, géométries privées
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de l'analyse
        run: node --test scripts/securite/analyse-secrets.test.mjs
      - name: Analyse du dépôt (arbre courant ; sur PR, ajouts de chaque commit)
        env:
          BASE_REF: ${{ github.base_ref }}
          AVANT: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF"
            node scripts/securite/analyse-secrets.mjs --historique "origin/$BASE_REF"
          elif [ -n "$AVANT" ] && [ "$AVANT" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$AVANT" 2>/dev/null; then
            node scripts/securite/analyse-secrets.mjs --historique "$AVANT"
          else
            node scripts/securite/analyse-secrets.mjs
          fi
