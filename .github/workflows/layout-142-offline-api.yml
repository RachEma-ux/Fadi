name: Layout 142 offline API dependency
on:
  push:
    branches: [ci/layout-142-diagnostic]
    paths: [.github/workflows/layout-142-offline-api.yml]
permissions:
  contents: read
jobs:
  dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 169c23f12d3c121965e5de90180723f3077fe8cd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: tar -czf /tmp/fadi-api-dependency.tar.gz apps/api/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: layout-142-offline-api
          path: /tmp/fadi-api-dependency.tar.gz
          retention-days: 1
