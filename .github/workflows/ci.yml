name: CI
# Un seul run par commit : les branches de PR passent par `pull_request`, `push` ne couvre que `main`.
# Un nouveau push sur la même branche annule le run dépassé (jamais sur `main`).
on:
  push:
    branches: [main]
  pull_request:
  # Contrôle lourd du corpus Studio (job `corpus-lourd` seul) : à la demande et chaque semaine. Les autres jobs ne
  # tournent que sur `push` / `pull_request` (condition en tête de leur `if`) : leur déclenchement est inchangé.
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-corpus-lourd' || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  # Recette Studio sur profil PostGIS neuf (#166, D-H) : sur chaque push dans `main` et sur toute PR qui touche Studio
  # (API, schéma init.sql, module web, modèle, recette, scripts de validation, ce fichier). Hors périmètre, le job
  # réussit sans exécuter la recette et le dit dans son résumé : il peut donc être un contrôle requis.
  studio-v1-validation:
    name: Studio V1 — API, navigateur et réouverture sur PostGIS neuf
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.repository == 'RachEma-ux/Fadi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      MIGRATE_ON_START: "0"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Périmètre Studio touché ? (push sur main = toujours)
        id: perimetre
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY_SCOPE'
          import os, re, subprocess
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if os.environ["EVENT"] != "pull_request":
              print("push : recette Studio exécutée sans filtre.")
              out.write("studio=true\n")
              raise SystemExit(0)
          base = os.environ.get("BASE_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              raise SystemExit("Refus : SHA de base PR invalide ou absent.")
          result = subprocess.run(["git", "diff", "--name-only", "--no-renames", "-z", f"{base}...HEAD"],
                                  check=True, capture_output=True)
          paths = [p.decode("utf-8") for p in result.stdout.split(b"\0") if p]
          motif = re.compile(r"^(apps/api/src/lib/studio-[^/]*|apps/api/src/routes/studio\.ts|apps/api/src/db/init\.sql"
                             r"|apps/web/src/modules/studio/.*|packages/atelier-model/src/studio/.*|scripts/validation/.*"
                             r"|apps/web/e2e/studio-v1[^/]*\.mjs|\.github/workflows/ci\.yml)$")
          touches = [p for p in paths if motif.match(p)]
          for path in touches:
              print("Studio :", ascii(path))
          out.write(f"studio={'true' if touches else 'false'}\n")
          print(f"{len(touches)} chemin(s) Studio sur {len(paths)} modifiés.")
          PY_SCOPE
      - name: Recette non exécutée (PR hors périmètre Studio)
        if: ${{ steps.perimetre.outputs.studio != 'true' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Studio V1 — recette non exécutée
          Cette PR ne touche aucun chemin du périmètre Studio : aucun profil PostGIS neuf n'a été créé.
          Ce succès ne prouve pas la recette ; elle tourne sur chaque push dans `main`.
          SUMMARY
      - uses: actions/setup-node@v4
        if: ${{ steps.perimetre.outputs.studio == 'true' }}
        with:
          node-version: 22
      - if: ${{ steps.perimetre.outputs.studio == 'true' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Refuser les endpoints de validation étrangers sans connexion
        if: ${{ steps.perimetre.outputs.studio == 'true' }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/validation -p 'test_studio_profile_guard.py' -v
      # Types, tests purs et web : déjà couverts par `validate` sur le même commit ; seul ce qui sert la recette reste ici.
      - if: ${{ steps.perimetre.outputs.studio == 'true' }}
        run: npm run test:db-guard
      - if: ${{ steps.perimetre.outputs.studio == 'true' }}
        run: npm run build
      - name: Installer le Chromium attendu par Playwright
        if: ${{ steps.perimetre.outputs.studio == 'true' }}
        run: npx playwright install --with-deps chromium
      - name: Profil neuf, recette réelle et redémarrage borné
        if: ${{ steps.perimetre.outputs.studio == 'true' }}
        run: python3 scripts/validation/studio-v1-functional.py
      - name: Verdicts expurgés des rapports en cas d'échec
        if: ${{ failure() && steps.perimetre.outputs.studio == 'true' }}
        run: |
          for f in work/studio-v1-proof/report-*.json; do
            [ -f "$f" ] || continue
            python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print(sys.argv[1], r.get('result'), r.get('failure'), r.get('failedResponses'), r.get('browserErrors') or r.get('pageErrors'))" "$f"
          done
          # Journal du serveur web seulement (aucune chaîne de connexion) ; api.log reste protégé.
          for f in ../studio-v1-private/*/vite.log; do [ -f "$f" ] && tail -n 30 "$f"; done || true
      - name: Publier seulement les preuves expurgées
        if: ${{ always() && steps.perimetre.outputs.studio == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-v1-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            work/studio-v1-proof/report-*.json
            work/studio-v1-proof/studio-*.png
            work/studio-v1-proof/existing-atelier-seam.png
          if-no-files-found: error

  mission-docs-pure:
    name: Mission 004 — documentation sans base (intégration non exécutée)
    if: ${{ github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'docs/156-codex-missions-completes' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuser un diff hors du périmètre documentaire avant les contrôles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY_SCOPE'
          import os, re, subprocess
          base = os.environ.get("BASE_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              raise SystemExit("Refus : SHA de base PR invalide ou absent.")
          result = subprocess.run(
              ["git", "diff", "--name-only", "--no-renames", "-z", f"{base}...HEAD"],
              check=True, capture_output=True,
          )
          paths = [p.decode("utf-8") for p in result.stdout.split(b"\0") if p]
          exact = {"AGENTS.md", "CLAUDE.md", "apps/web/src/modules/README.md",
                   ".github/workflows/ci.yml", ".github/workflows/codex-missions.yml"}
          unexpected = [p for p in paths if not (p.startswith(("docs/", "Studio/")) or p in exact)]
          if unexpected:
              print("Refus : le diff contient des fichiers hors du périmètre documentaire :")
              for path in unexpected:
                  print(ascii(path))
              raise SystemExit(1)
          print(f"Périmètre documentaire vérifié : {len(paths)} chemins ; aucune source applicative hors allowlist.")
          PY_SCOPE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests unitaires du validateur documentaire sans base ni réseau
        run: python3 -m unittest discover -s docs/ai-team -p 'test_check_missions.py' -v
      - name: Couverture des 31 missions et 630 affectations
        run: python3 docs/ai-team/check_missions.py --check
      - name: Continuité — tests et structure
        run: |
          node --test scripts/check-continuity.test.mjs
          node scripts/check-continuity.mjs
      - name: Isolation nominale Fadi
        run: node scripts/check-fadi-isolation.mjs
      - name: Déclarer les vérifications d'intégration non effectuées
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Mission 004 — branche documentaire, aucune base réelle
          Tests documentaires, couverture des affectations, continuité et isolation nominale seulement.
          Aucun service PostgreSQL/API, installation npm, migration, test API/E2E ou image applicative exécuté dans ce job.
          Les jobs validate/e2e/image sont intentionnellement skipped sur cette branche exacte ; ils ne sont pas réussis.
          Ce résultat ne valide ni les 630 fonctionnalités, ni l'intégration applicative, ni DB-3, ni une fusion.
          Les autres branches et push sur main conservent les jobs applicatifs ; cette exception est bornée à la préparation documentaire.
          SUMMARY

  db-guard-pure:
    name: DB1/2 — tests simulés sans base (DB3 non validée)
    if: ${{ github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'fix/157-test-database-guard' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ""
      TEST_DATABASE_URL: ""
      MIGRATE_ON_START: "0"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer sans aucun script de cycle de vie
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vérifier les types sans exécuter le serveur
        run: npm run typecheck
      - name: Garde DB — uniquement tests et connexions simulés
        run: npm run test:db-guard
      - name: Construire sans lancer l'application ni appliquer de schéma
        run: npm run build
      - name: Rendre explicite le périmètre non exécuté
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## A3-DB-1/2 : vérifications sans base réelle
          Ce job ne démarre aucun service PostgreSQL/API, n'applique aucun schéma et n'exécute aucun test API/E2E mutateur.
          Les jobs `validate`, `e2e` et `image` sont intentionnellement non exécutés sur cette seule PR de garde DB.
          Leur statut skipped ne prouve aucune réussite d'intégration. DB-3, la recette fonctionnelle et la fusion restent non autorisées.
          Les éventuels échecs des étapes de ce job restent des échecs ; ce résumé n'en modifie pas le verdict.
          SUMMARY

  validate:
    # Exceptions bornées sans base réelle : branches exactes listées ; condition avant création des services.
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (!((github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'docs/156-codex-missions-completes' && github.base_ref == 'main') || (github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'fix/157-test-database-guard' && github.base_ref == 'main'))) && !(github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'feat/156-studio-v1' && (github.base_ref == 'main' || github.base_ref == 'fix/157-test-database-guard')) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fadi
          POSTGRES_PASSWORD: fadi_ci_password
          POSTGRES_DB: fadi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fadi:fadi_ci_password@localhost:5432/fadi_test
      WEB_ORIGIN: http://localhost:5173
      # app.test.ts registers one user per authorization scenario against a
      # single shared Express app (one in-memory rate limiter for the whole
      # file) — see apps/api/.env.test.example for the full explanation.
      AUTH_RATE_LIMIT: "500"
      AUTH_IDENTIFIER_RATE_LIMIT: "500"
      API_RATE_LIMIT: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run db:migrate
      # Gestion des comptes (#253, phase 1) : init.sql rejoué deux fois, défauts des comptes historiques, contraintes
      # CHECK, journal d'audit append-only, conversion des sessions — transactions annulées, base du job seulement.
      - name: Schéma Gestion des comptes — idempotence, contraintes, audit append-only
        run: node scripts/validation/users-migration-check.mjs
      # Organisations, participation et revue externe (#262, phase 1) : reprise de l'existant, miroir des accès par
      # déclencheurs, contraintes, droits fadi_app — transactions annulées, base du job seulement.
      - name: Schéma participations — reprise, miroir des accès, contraintes
        run: node scripts/validation/participations-migration-check.mjs
      - name: Tests des paquets purs et du web
        run: npm run test --workspace=@parcours/core-geometry --workspace=@parcours/domain-model --workspace=@parcours/atelier-model --workspace=@parcours/planche-model --workspace=@parcours/sandbox-planche-model --workspace=@parcours/geometry-exact --workspace=@fadi/web
      - name: Garde DB-1/2 — tests simulés sans base
        run: npm run test:db-guard
      # DB-3 (#157, accord du maître d'ouvrage du 22 octobre 2026) : avec la clé de signature (secret
      # FADI_TEST_DB_SIGNING_KEY, dont la clé publique est enrôlée dans le registre relu approved-test-authorities.ts),
      # la base PostGIS jetable de ce job est préparée et attestée (scripts/db3/preparer-base-test.mjs), et TOUTES les
      # suites API y tournent derrière la garde. Sans le secret (PR d'un fork, clé non installée), la garde reste
      # fermée : le contrôle historique exige que seule la liste fermée soit refusée, par la garde seule.
      - name: Tests API — sur base jetable attestée (DB-3), sinon suites DB-3 déclarées non exécutées
        env:
          FADI_TEST_DB_SIGNING_KEY: ${{ secrets.FADI_TEST_DB_SIGNING_KEY }}
        run: |
          node --test scripts/check-api-tests-db3.test.mjs
          if [ -n "$FADI_TEST_DB_SIGNING_KEY" ]; then
            DB3_ADMIN_URL=postgresql://fadi:fadi_ci_password@127.0.0.1:5432/fadi_test DB3_KEY_ID=fadi-ci-db3 \
              DB3_RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}" DB3_COMMIT_SHA="${{ github.sha }}" \
              DB3_SORTIE="$RUNNER_TEMP/db3" node scripts/db3/preparer-base-test.mjs
            echo "::add-mask::$(sed -n 's|^TEST_DATABASE_URL=postgresql://[^:]*:\([^@]*\)@.*|\1|p' "$RUNNER_TEMP/db3/env")"
            set -a; . "$RUNNER_TEMP/db3/env"; set +a
            unset FADI_TEST_DB_SIGNING_KEY
            npx --workspace=@fadi/api vitest run --reporter=default --reporter=json --outputFile=../../api-vitest.json || true
            node scripts/check-api-tests-db3.mjs --db3-actif api-vitest.json
          else
            echo "DB-3 non exécuté : secret FADI_TEST_DB_SIGNING_KEY absent (PR d'un fork, ou clé non installée)."
            npx --workspace=@fadi/api vitest run --reporter=default --reporter=json --outputFile=../../api-vitest.json || true
            node scripts/check-api-tests-db3.mjs api-vitest.json
          fi
      - run: npm run build
      # Le build échoue déjà sur un découpage non conforme (vite.config.ts) ; cette étape en affiche le verdict.
      - name: Découpage des bundles (B.3-06) — carte des morceaux du build
        run: |
          node -e "const c=require('./apps/web/dist/chargement.json'); for (const [id, m] of Object.entries(c.moteurs)) console.log(id, m.propres.length, 'fichier(s) propre(s),', m.taille, 'octets'); console.log(JSON.stringify(c.verification)); process.exit(c.verification.ok ? 0 : 1)"
      # Corpus IFC (lot 6, D-006 : conformité testée, jamais « certifiée ») : petit modèle comparé à sa référence,
      # P.118 exporté, puis relu par web-ifc, importé en représentations et réexporté ; chaque fichier validé par
      # IfcOpenShell (schéma IFC4X3_ADD2, règles EXPRESS, effectifs, géométrie d'un échantillon).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ifcopenshell==0.9.0 pytest
      - name: Corpus IFC validé par IfcOpenShell (apps/api/test-corpus/ifc/)
        run: |
          npx --workspace=@fadi/api tsx test-corpus/ifc/generer.ts ../../ifc-sortie
          npx --workspace=@fadi/api tsx test-corpus/ifc/generer-studio.ts ../../ifc-sortie
          for f in petit p118 p118-reimporte studio; do python3 apps/api/test-corpus/ifc/valider.py ifc-sortie/$f.ifc ifc-sortie/$f.attendus.json; done
          # Propriétés déclarées de Studio (E.1-01) relues : jeu Fadi_ProprietesDeclarees, types, valeurs, descriptions.
          python3 apps/api/test-corpus/ifc/valider-proprietes.py ifc-sortie/studio.ifc ifc-sortie/studio.proprietes.json

  # Scénario Playwright de bout en bout (apps/web/e2e/parcours-scenario.mjs) :
  # le parcours complet sur P.118 — import, 21 étapes, Atelier, parcelle,
  # Harmonie, bibliothèque, liaisons, documents, collaboration, hors-ligne,
  # partage — contre l'API construite, qui sert elle-même le build de l'application (mode de production).
  # Les captures (docs/migration/captures/webapp/) sont publiées en artefact.
  #
  # Tranches parallèles (#166) : chaque tranche a son propre PostGIS, sa migration, son build et son API ; chaque
  # recette ne tourne que dans sa tranche (`if: matrix.shard == …`), dans l'ordre relatif d'origine. Chaque recette
  # crée son compte et importe elle-même l'exemple P.118 ; la seule dépendance d'état est la sauvegarde / restauration,
  # qui reste dans la tranche du scénario, après lui. Répartition par durées mesurées (run 39159805146, ≈ 7 min par
  # tranche) : parcours (accueils, scénario, Studio, restauration), complements (atelier-complements seul),
  # atelier (Atelier P1, interface anglaise, barre), planche (outils et lots Planche), p2 (P2-0 à P2-8, Planche lot 7,
  # boutons, détachée, barres d'outils). Le job agrégé `e2e` garde le nom du contrôle requis.
  e2e-shard:
    name: e2e (${{ matrix.shard }})
    # Exceptions bornées sans base réelle : branches exactes listées ; condition avant création des services.
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (!((github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'docs/156-codex-missions-completes' && github.base_ref == 'main') || (github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'fix/157-test-database-guard' && github.base_ref == 'main'))) && !(github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'feat/156-studio-v1' && (github.base_ref == 'main' || github.base_ref == 'fix/157-test-database-guard')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [parcours, complements, atelier, planche, p2]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fadi
          POSTGRES_PASSWORD: fadi_ci_password
          POSTGRES_DB: fadi_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Gestion des comptes (D-1) : serveur SMTP de test, aucun courriel n'est remis ; liens lus par son API HTTP.
      mailpit:
        image: axllent/mailpit:v1.20.4
        ports:
          - 1025:1025
          - 8025:8025
    env:
      # D-7 : l'API et les recettes se connectent en fadi_app (aucun DDL) ; `npm run db:migrate` utilise le compte
      # d'administration du conteneur jetable, crée les rôles et applique le mot de passe de fadi_app (propre à la CI).
      DATABASE_URL: postgresql://fadi_app:fadi_app_ci_password@localhost:5432/fadi_e2e
      DATABASE_MIGRATION_URL: postgresql://fadi:fadi_ci_password@localhost:5432/fadi_e2e
      FADI_APP_DB_PASSWORD: fadi_app_ci_password
      # Gestion des comptes : administration activée pour la recette, courriels vers Mailpit, quota large (les recettes
      # inscrivent beaucoup de comptes) ; la recette du garde-fou de quota remplit la file jusqu'à cette valeur.
      FADI_ADMIN_ENABLED: "true"
      MAIL_TRANSPORT: smtp
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: noreply@fadi.test
      MAIL_FROM: "Fadi <noreply@fadi.test>"
      MAIL_DAILY_LIMIT: "3000"
      MAIL_RECIPIENT_HOURLY_LIMIT: "50"
      MAILPIT_URL: http://localhost:8025
      APP_PUBLIC_URL: http://localhost:3001
      # Mode de production : l'API sert le build de l'application (WEB_DIST) — un seul port, même origine, pas de vite preview.
      WEB_ORIGIN: http://localhost:3001
      WEB_DIST: apps/web/dist
      PORT: "3001"
      AUTH_RATE_LIMIT: "500"
      # Limite par adresse (10 / 15 min par défaut) : les recettes reconnectent souvent le même compte.
      AUTH_IDENTIFIER_RATE_LIMIT: "500"
      API_RATE_LIMIT: "5000"
      BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run build
      # Clé de signature des archives propre à l'exécution (jamais écrite dans le dépôt, masquée dans les journaux) :
      # partagée par l'API et la seconde API de la recette de restauration Studio (même « serveur »).
      - name: Clé de signature des archives de l'exécution
        run: |
          k="$(openssl rand -hex 32)"
          echo "::add-mask::$k"
          echo "ARCHIVE_SIGNING_KEY=$k" >> "$GITHUB_ENV"
