name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fadi
          POSTGRES_PASSWORD: fadi_ci_password
          POSTGRES_DB: fadi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fadi:fadi_ci_password@localhost:5432/fadi_test
      WEB_ORIGIN: http://localhost:5173
      # app.test.ts registers one user per authorization scenario against a
      # single shared Express app (one in-memory rate limiter for the whole
      # file) — see apps/api/.env.test.example for the full explanation.
      AUTH_RATE_LIMIT: "500"
      API_RATE_LIMIT: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      # Corpus IFC (lot 6, D-006 : conformité testée, jamais « certifiée ») : petit modèle comparé à sa référence,
      # P.118 exporté, puis relu par web-ifc, importé en représentations et réexporté ; chaque fichier validé par
      # IfcOpenShell (schéma IFC4X3_ADD2, règles EXPRESS, effectifs, géométrie d'un échantillon).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ifcopenshell==0.9.0 pytest
      - name: Corpus IFC validé par IfcOpenShell (apps/api/test-corpus/ifc/)
        run: |
          npx --workspace=@fadi/api tsx test-corpus/ifc/generer.ts ../../ifc-sortie
          for f in petit p118 p118-reimporte; do python3 apps/api/test-corpus/ifc/valider.py ifc-sortie/$f.ifc ifc-sortie/$f.attendus.json; done

  # Scénario Playwright de bout en bout (apps/web/e2e/parcours-scenario.mjs) :
  # le parcours complet sur P.118 — import, 21 étapes, Atelier, parcelle,
  # Harmonie, bibliothèque, liaisons, documents, collaboration, hors-ligne,
  # partage — contre l'API construite, qui sert elle-même le build de l'application (mode de production).
  # Les captures (docs/migration/captures/webapp/) sont publiées en artefact.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fadi
          POSTGRES_PASSWORD: fadi_ci_password
          POSTGRES_DB: fadi_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fadi:fadi_ci_password@localhost:5432/fadi_e2e
      # Mode de production : l'API sert le build de l'application (WEB_DIST) — un seul port, même origine, pas de vite preview.
      WEB_ORIGIN: http://localhost:3001
      WEB_DIST: apps/web/dist
      PORT: "3001"
      AUTH_RATE_LIMIT: "500"
      API_RATE_LIMIT: "5000"
      BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run build
      - name: Démarrer l'API qui sert aussi l'application (WEB_DIST)
        run: |
          nohup node apps/api/dist/server.js > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health > /dev/null && curl -sf -H "Accept: text/html" http://localhost:3001/accueil | grep -q "<div id=\"root\""; then echo "prêts"; break; fi
            sleep 1
          done
          curl -sf http://localhost:3001/health && curl -sf -o /dev/null -H "Accept: text/html" http://localhost:3001/accueil
          : > web.log
      - name: Scénario Playwright
        run: |
          set -o pipefail
          node apps/web/e2e/parcours-scenario.mjs 2>&1 | tee e2e.log
      - name: Recette du nouvel Atelier (apps/web/e2e/atelier-nouveau.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/atelier-nouveau.mjs 2>&1 | tee -a e2e.log
      - name: Recette des documents dérivés et objets du lot 5 (apps/web/e2e/atelier-documents.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/atelier-documents.mjs 2>&1 | tee -a e2e.log
      - name: Recette des échanges du lot 6 (apps/web/e2e/atelier-echanges.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/atelier-echanges.mjs 2>&1 | tee -a e2e.log
      - name: Recette des versions, variantes et publications du lot 7 (apps/web/e2e/atelier-versions.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/atelier-versions.mjs 2>&1 | tee -a e2e.log
      - name: Recette de l'automatisation et de l'assistant du lot 8 (apps/web/e2e/atelier-automatisation.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/atelier-automatisation.mjs 2>&1 | tee -a e2e.log
      - name: Recette des compléments — historique, consultation, reprise, références externes (apps/web/e2e/atelier-complements.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/atelier-complements.mjs 2>&1 | tee -a e2e.log
      - name: Recette de la disposition Canevas — ergonomie SketchUp Web (apps/web/e2e/atelier-canevas.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/atelier-canevas.mjs 2>&1 | tee -a e2e.log
      - name: Recette du mode Planche, lot Planche 2 — dessin, champ Mesures, toucher (apps/web/e2e/planche.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/planche.mjs 2>&1 | tee -a e2e.log
      - name: Recette des outils de modification de la Planche, lot Planche 3 (apps/web/e2e/planche-modification.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/planche-modification.mjs 2>&1 | tee -a e2e.log
      - name: Recette outil par outil de la Planche — 22 machines, caméra, grille sans outil grisé, brouillon (apps/web/e2e/planche-outils.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/planche-outils.mjs 2>&1 | tee -a e2e.log
      - name: Recette des lots 4 à 6 de la Planche — mesure, annotations, caméra, matières, balises, texte 3D, solides (apps/web/e2e/planche-lots-4-6.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/planche-lots-4-6.mjs 2>&1 | tee -a e2e.log
      - name: Recette du lot 5 de la Planche — composants, presse-papiers, menu contextuel, panneaux (apps/web/e2e/planche-lot-5.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/planche-lot-5.mjs 2>&1 | tee -a e2e.log
      - name: Recette du lot 7 de la Planche — persistance par commandes, Planches nommées, IFC, PNG, téléphone, axe-core (apps/web/e2e/planche-lot-7.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/planche-lot-7.mjs 2>&1 | tee -a e2e.log
      - name: Porte P1 réduite (P2-0) — un projet, un écran, bâtiment + esquisse + Planche + feuille + version (apps/web/e2e/porte-p1-reduite.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/porte-p1-reduite.mjs 2>&1 | tee -a e2e.log
      - name: Noyau exact (P2-1, D-177) — Worker OCCT à la demande, révolution, booléen, STEP export / import, IFC (apps/web/e2e/p2-noyau-exact.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-noyau-exact.mjs 2>&1 | tee -a e2e.log
      - name: "Porte P1 → P2 (P2-2) — P.118-M : ontologie mécanique, CTA à 4 pièces et 2 liaisons pilotées, version, feuille éclatée, IFC, collision (apps/web/e2e/porte-p1-p2.mjs)"
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/porte-p1-p2.mjs 2>&1 | tee -a e2e.log
      - name: "Lot P2-3 structure — trame générée après aperçu, catalogue sourcé, assemblages, armatures, coulage, nomenclatures, IFC réimporté (apps/web/e2e/p2-structure.mjs)"
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-structure.mjs 2>&1 | tee -a e2e.log
      - name: "Lot P2-4 bois et tôlerie — ossature générée sur un mur de P.118 après aperçu, CLT, assemblage, tôle pliée et développé, table de pliage, nomenclatures, IFC (apps/web/e2e/p2-bois-tolerie.mjs)"
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-bois-tolerie.mjs 2>&1 | tee -a e2e.log
      - name: "Lot P2-5 réseaux — ontologie activée, catalogue de tubes sourcé et spécification, réseau routé depuis l'inspecteur (deux tronçons + coude connectés), pompe, connectivité vérifiée (refus, rupture signalée, réparation), nomenclature, P&ID, IFC MEP réimporté (apps/web/e2e/p2-reseaux.mjs)"
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-reseaux.mjs 2>&1 | tee -a e2e.log
      - name: "Lot P2-6 coordination — bâtiment P2 (plafond, rampe, mur-rideau, terrain depuis l'inspecteur), gaine × mur signalée puis exemptée par une réservation accordée, mécanisme animé (trajectoire, obstacle), surface libre subdivisée, tableaux rénovation / chantier, IFC natif (apps/web/e2e/p2-coordination.mjs)"
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-coordination.mjs 2>&1 | tee -a e2e.log
      - name: "Lot P2-7 documentation — annotation de fabrication et cote tolérancée depuis l'inspecteur, étiquette intelligente, feuille gabarit production béton, isométrique de tuyauterie, nuage de points LAS lu et posé derrière le plan (apps/web/e2e/p2-documentation.mjs)"
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-documentation.mjs 2>&1 | tee -a e2e.log
      - name: "Lot P2-8 automatisation — graphe de génération dessiné, règle du graphe non tenue (échec nommé), proposition par la même boucle puis accord (4 poteaux), graphe composé dans l'éditeur visuel et déposé dans le projet, règle par ontologie sur les murs (problèmes rattachés, rejugés) (apps/web/e2e/p2-automatisation.mjs)"
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-automatisation.mjs 2>&1 | tee -a e2e.log
      - name: Recette de l'interface anglaise — relevé des textes restés en français (apps/web/e2e/interface-anglais.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/interface-anglais.mjs 2>&1 | tee -a e2e.log
      - name: Recette des boutons de la Planche, ordinateur et téléphone (apps/web/e2e/planche-boutons.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/planche-boutons.mjs 2>&1 | tee -a e2e.log
      - name: Recette de la Planche détachée et de la barre du mode Documents (apps/web/e2e/planche-detachee-documents.mjs)
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/planche-detachee-documents.mjs 2>&1 | tee -a e2e.log
      - name: Sauvegarde puis restauration vérifiées (scripts/verify-restore.sh) sur la base du scénario
        env:
          PGPASSWORD: fadi_ci_password
        run: sh scripts/verify-restore.sh localhost fadi fadi_e2e fadi_restore_check
      - name: Résumé de l'échec (annotations lisibles depuis l'API)
        if: failure()
        run: |
          grep -n "^✗" e2e.log | head -n 8 | while IFS= read -r l; do echo "::error title=e2e::${l:0:900}"; done
          echo "::error title=e2e-fin::$(tail -n 12 e2e.log | tr '\n' '|' | cut -c1-900)"
          grep -n -E "Error|Timeout|exceeded" e2e.log | tail -n 4 | while IFS= read -r l; do echo "::error title=e2e-erreur::${l:0:900}"; done
          echo "::error title=api-log::$(tail -n 15 api.log | tr '\n' '|' | cut -c1-900)"
      - name: Journaux des serveurs
        if: failure()
        run: tail -n 100 api.log web.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-webapp
          path: |
            docs/migration/captures/webapp/
            atelier-captures/
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fadi
          POSTGRES_PASSWORD: fadi_ci_password
          POSTGRES_DB: fadi_image
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image de production (Dockerfile)
        run: docker build -t fadi:ci .
      - name: Démarrer le conteneur (schéma appliqué au démarrage) et sonder /health, /accueil, /projects
        run: |
          docker run -d --name fadi --network host \
            -e DATABASE_URL=postgresql://fadi:fadi_ci_password@localhost:5432/fadi_image \
            -e WEB_ORIGIN=http://localhost:3001 -e TRUST_PROXY=0 fadi:ci
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health | grep -q '"db":"ok"'; then echo "conteneur prêt"; break; fi
            sleep 1
          done
          curl -sf http://localhost:3001/health | grep -q '"db":"ok"'
          curl -sf -H "Accept: text/html" http://localhost:3001/accueil | grep -q '<div id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/projects)" = "401"
          curl -sf -o /dev/null -X POST -H "Content-Type: application/json" -d '{"email":"image@example.com","password":"correct-horse-battery"}' http://localhost:3001/auth/register
      - name: Journal du conteneur
        if: always()
        run: |
          docker logs fadi 2>&1 | tail -n 50
          if [ "${{ job.status }}" != "success" ]; then echo "::error title=image-log::$(docker logs fadi 2>&1 | tail -n 20 | tr '\n' '|' | cut -c1-900)"; fi
