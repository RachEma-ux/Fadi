          OUT=atelier-captures/planche-effilement-loft node apps/web/e2e/planche-effilement-loft.mjs 2>&1 | tee -a e2e.log
      - name: Recette des lots 4 à 6 de la Planche — mesure, annotations, caméra, matières, balises, texte 3D, solides (apps/web/e2e/planche-lots-4-6.mjs)
        if: ${{ matrix.shard == 'planche' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/planche-lots-4-6.mjs 2>&1 | tee -a e2e.log
      - name: Recette du lot 5 de la Planche — composants, presse-papiers, menu contextuel, panneaux (apps/web/e2e/planche-lot-5.mjs)
        if: ${{ matrix.shard == 'planche' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/planche-lot-5.mjs 2>&1 | tee -a e2e.log
      - name: Recette du module Sandbox — /sandbox charge la Planche (vue, barre d'outils), ancienne adresse redirigée, carte 00 en lien, téléphone, aucun appel à l'API d'un projet (apps/web/e2e/sandbox-module.mjs)
        if: ${{ matrix.shard == 'planche' }}
        run: |
          set -o pipefail
          OUT=atelier-captures/sandbox node apps/web/e2e/sandbox-module.mjs 2>&1 | tee -a e2e.log
      - name: Recette du lot 7 de la Planche — persistance par commandes, Planches nommées, IFC, PNG, téléphone, axe-core (apps/web/e2e/planche-lot-7.mjs)
        if: ${{ matrix.shard == 'p2' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/planche-lot-7.mjs 2>&1 | tee -a e2e.log
      - name: Porte P1 réduite (P2-0) — un projet, un écran, bâtiment + esquisse + Planche + feuille + version (apps/web/e2e/porte-p1-reduite.mjs)
        if: ${{ matrix.shard == 'p2' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/porte-p1-reduite.mjs 2>&1 | tee -a e2e.log
      - name: Noyau exact (P2-1, D-177) — Worker OCCT à la demande, révolution, booléen, STEP export / import, IFC (apps/web/e2e/p2-noyau-exact.mjs)
        if: ${{ matrix.shard == 'p2' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-noyau-exact.mjs 2>&1 | tee -a e2e.log
      - name: "Porte P1 → P2 (P2-2) — P.118-M : ontologie mécanique, CTA à 4 pièces et 2 liaisons pilotées, version, feuille éclatée, IFC, collision (apps/web/e2e/porte-p1-p2.mjs)"
        if: ${{ matrix.shard == 'p2' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/porte-p1-p2.mjs 2>&1 | tee -a e2e.log
      - name: "Lot P2-3 structure — trame générée après aperçu, catalogue sourcé, assemblages, armatures, coulage, nomenclatures, IFC réimporté (apps/web/e2e/p2-structure.mjs)"
        if: ${{ matrix.shard == 'p2' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-structure.mjs 2>&1 | tee -a e2e.log
      - name: "Lot P2-4 bois et tôlerie — ossature générée sur un mur de P.118 après aperçu, CLT, assemblage, tôle pliée et développé, table de pliage, nomenclatures, IFC (apps/web/e2e/p2-bois-tolerie.mjs)"
        if: ${{ matrix.shard == 'p2' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-bois-tolerie.mjs 2>&1 | tee -a e2e.log
      - name: "Lot P2-5 réseaux — ontologie activée, catalogue de tubes sourcé et spécification, réseau routé depuis l'inspecteur (deux tronçons + coude connectés), pompe, connectivité vérifiée (refus, rupture signalée, réparation), nomenclature, P&ID, IFC MEP réimporté (apps/web/e2e/p2-reseaux.mjs)"
        if: ${{ matrix.shard == 'p2' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-reseaux.mjs 2>&1 | tee -a e2e.log
      - name: "Lot P2-6 coordination — bâtiment P2 (plafond, rampe, mur-rideau, terrain depuis l'inspecteur), gaine × mur signalée puis exemptée par une réservation accordée, mécanisme animé (trajectoire, obstacle), surface libre subdivisée, tableaux rénovation / chantier, IFC natif (apps/web/e2e/p2-coordination.mjs)"
        if: ${{ matrix.shard == 'p2' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-coordination.mjs 2>&1 | tee -a e2e.log
      - name: "Lot P2-7 documentation — annotation de fabrication et cote tolérancée depuis l'inspecteur, étiquette intelligente, feuille gabarit production béton, isométrique de tuyauterie, nuage de points LAS lu et posé derrière le plan (apps/web/e2e/p2-documentation.mjs)"
        if: ${{ matrix.shard == 'p2' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-documentation.mjs 2>&1 | tee -a e2e.log
      - name: "Lot P2-8 automatisation — graphe de génération dessiné, règle du graphe non tenue (échec nommé), proposition par la même boucle puis accord (4 poteaux), graphe composé dans l'éditeur visuel et déposé dans le projet, règle par ontologie sur les murs (problèmes rattachés, rejugés) (apps/web/e2e/p2-automatisation.mjs)"
        if: ${{ matrix.shard == 'p2' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/p2-automatisation.mjs 2>&1 | tee -a e2e.log
      - name: Recette de l'interface anglaise — relevé des textes restés en français (apps/web/e2e/interface-anglais.mjs)
        if: ${{ matrix.shard == 'atelier' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/interface-anglais.mjs 2>&1 | tee -a e2e.log
      - name: Recette des boutons de la Planche, ordinateur et téléphone (apps/web/e2e/planche-boutons.mjs)
        if: ${{ matrix.shard == 'p2' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/planche-boutons.mjs 2>&1 | tee -a e2e.log
      - name: Recette de la Planche détachée et de la barre du mode Documents (apps/web/e2e/planche-detachee-documents.mjs)
        if: ${{ matrix.shard == 'p2' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/planche-detachee-documents.mjs 2>&1 | tee -a e2e.log
      - name: Recette de la barre de l'Atelier — Plan à deux fonctions, Fichier, ⚙, barre d'actions flottante (apps/web/e2e/atelier-barre.mjs)
        if: ${{ matrix.shard == 'atelier' }}
        run: |
          set -o pipefail
          OUT=atelier-captures node apps/web/e2e/atelier-barre.mjs 2>&1 | tee -a e2e.log
      - name: Recette des barres d'outils de la Planche — bouton « Outils », barres d'opérations flottantes (apps/web/e2e/planche-barre-outils.mjs)
        if: ${{ matrix.shard == 'p2' }}
        run: |
          set -o pipefail
          node apps/web/e2e/planche-barre-outils.mjs 2>&1 | tee -a e2e.log
      - name: Sauvegarde puis restauration vérifiées (scripts/verify-restore.sh) sur la base du scénario
        if: ${{ matrix.shard == 'parcours' }}
        env:
          PGPASSWORD: fadi_ci_password
        run: sh scripts/verify-restore.sh localhost fadi fadi_e2e fadi_restore_check
      # R.1-02 / R.2-01 : section Studio de l'archive JSON restaurée dans une base neuve (seconde API lancée et arrêtée
      # par la recette), documents identiques octet pour octet, droits, immuabilité, réouverture, comparaison 0 anomalie.
      - name: Recette de restauration Studio — archive JSON vers une base neuve, comparaison avant / après (apps/web/e2e/studio-restauration.mjs)
        if: ${{ matrix.shard == 'parcours' }}
        env:
          PGPASSWORD: fadi_ci_password
        run: |
          set -o pipefail
          node --test scripts/validation/studio-compare-lib.test.mjs
          psql -h localhost -U fadi -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS fadi_studio_restore;" -c "CREATE DATABASE fadi_studio_restore;"
          psql -h localhost -U fadi -d fadi_studio_restore -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          DATABASE_MIGRATION_URL=postgresql://fadi:fadi_ci_password@localhost:5432/fadi_studio_restore DATABASE_URL=postgresql://fadi:fadi_ci_password@localhost:5432/fadi_studio_restore npm run db:migrate
          DATABASE_URL_A="$DATABASE_URL" DATABASE_URL_B=postgresql://fadi:fadi_ci_password@localhost:5432/fadi_studio_restore RESTORE_PORT=3002 OUT=atelier-captures/studio-restauration node apps/web/e2e/studio-restauration.mjs 2>&1 | tee -a e2e.log
      - name: Résumé de l'échec (annotations lisibles depuis l'API)
        if: failure()
        run: |
          grep -n "^✗" e2e.log | head -n 8 | while IFS= read -r l; do echo "::error title=e2e::${l:0:900}"; done
          echo "::error title=e2e-fin::$(tail -n 12 e2e.log | tr '\n' '|' | cut -c1-900)"
          grep -n -E "Error|Timeout|exceeded" e2e.log | tail -n 4 | while IFS= read -r l; do echo "::error title=e2e-erreur::${l:0:900}"; done
          echo "::error title=api-log::$(tail -n 15 api.log | tr '\n' '|' | cut -c1-900)"
      - name: Journaux des serveurs
        if: failure()
        run: tail -n 100 api.log web.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-webapp-${{ matrix.shard }}
          path: |
            docs/migration/captures/webapp/
            atelier-captures/
          retention-days: 14

  # Contrôle agrégé : garde le nom `e2e` attendu par la protection de branche ; vert seulement si toutes les tranches
  # ont réussi (une tranche échouée, annulée ou sautée alors que la condition est vraie le fait échouer).
  e2e:
    needs: e2e-shard
    # Même condition que les tranches : sauté exactement quand elles le sont.
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request') && (!((github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'docs/156-codex-missions-completes' && github.base_ref == 'main') || (github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'fix/157-test-database-guard' && github.base_ref == 'main'))) && !(github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'feat/156-studio-v1' && (github.base_ref == 'main' || github.base_ref == 'fix/157-test-database-guard')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Toutes les tranches e2e ont réussi
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "tranches e2e : $RESULT"
          test "$RESULT" = "success"

  image:
    # Exceptions bornées sans base réelle : branches exactes listées ; condition avant création des services.
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (!((github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'docs/156-codex-missions-completes' && github.base_ref == 'main') || (github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'fix/157-test-database-guard' && github.base_ref == 'main'))) && !(github.event_name == 'pull_request' && github.repository == 'RachEma-ux/Fadi' && github.event.pull_request.head.repo.full_name == 'RachEma-ux/Fadi' && github.head_ref == 'feat/156-studio-v1' && (github.base_ref == 'main' || github.base_ref == 'fix/157-test-database-guard')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fadi
          POSTGRES_PASSWORD: fadi_ci_password
          POSTGRES_DB: fadi_image
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image de production (Dockerfile)
        run: docker build --build-arg FADI_COMMIT=${{ github.sha }} --build-arg FADI_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) -t fadi:ci .
      - name: Migrer (service à usage unique), refuser l'identifiant de migration dans l'API, démarrer le conteneur et sonder /health, /accueil, /projects, /version
        run: |
          # D-7 : comme en production (docker-compose) — migration à usage unique avec le compte d'administration de la base
          # (MIGRATE_ONLY=1, s'arrête sans écouter), puis l'API en fadi_app sans l'identifiant de migration.
          docker run --rm --network host -e MIGRATE_ONLY=1 \
            -e DATABASE_URL=postgresql://fadi:fadi_ci_password@localhost:5432/fadi_image \
            -e DATABASE_MIGRATION_URL=postgresql://fadi:fadi_ci_password@localhost:5432/fadi_image \
            -e FADI_APP_DB_PASSWORD=fadi_app_ci_password fadi:ci
          # Revue de la PR #255 : l'API refuse de démarrer en production si l'identifiant de migration lui est donné.
          if timeout 60 docker run --rm --network host -e MIGRATE_ON_START=0 \
            -e DATABASE_URL=postgresql://fadi_app:fadi_app_ci_password@localhost:5432/fadi_image \
            -e DATABASE_MIGRATION_URL=postgresql://fadi:fadi_ci_password@localhost:5432/fadi_image \
            -e WEB_ORIGIN=http://localhost:3001 -e TRUST_PROXY=0 fadi:ci; then
            echo "::error title=image::l'API a démarré avec DATABASE_MIGRATION_URL en production"; exit 1
          fi
          docker run -d --name fadi --network host -e MIGRATE_ON_START=0 \
            -e DATABASE_URL=postgresql://fadi_app:fadi_app_ci_password@localhost:5432/fadi_image \
            -e WEB_ORIGIN=http://localhost:3001 -e TRUST_PROXY=0 fadi:ci
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health | grep -q '"db":"ok"'; then echo "conteneur prêt"; break; fi
            sleep 1
          done
          curl -sf http://localhost:3001/health | grep -q '"db":"ok"'
          curl -sf -H "Accept: text/html" http://localhost:3001/accueil | grep -q '<div id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/projects)" = "401"
          # /version : le commit construit est celui de la CI, la date est renseignée.
          curl -sf http://localhost:3001/version | tee /dev/stderr | grep -q '"commit":"${{ github.sha }}"'
          curl -sf http://localhost:3001/version | grep -Eq '"buildDate":"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z"'
          curl -sf -o /dev/null -X POST -H "Content-Type: application/json" -d '{"email":"image@example.com","password":"correct-horse-battery"}' http://localhost:3001/auth/register
      - name: Journal du conteneur
        if: always()
        run: |
          docker logs fadi 2>&1 | tail -n 50
          if [ "${{ job.status }}" != "success" ]; then echo "::error title=image-log::$(docker logs fadi 2>&1 | tail -n 20 | tr '\n' '|' | cut -c1-900)"; fi

  # Contrôle lourd du corpus de qualification Studio (X.1-10) : références visuelles à 10 000 et tout à 100 000
  # primitives (`STUDIO_CORPUS_LOURD=1`), hors du chemin des PR. À la demande (workflow_dispatch) et chaque semaine.
  corpus-lourd:
    name: Corpus Studio lourd (10 000 / 100 000 primitives)
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'RachEma-ux/Fadi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Corpus S1–S7 lourd — empreintes, oracles et références visuelles (npm run test:corpus-lourd)
        run: npm run test:corpus-lourd
