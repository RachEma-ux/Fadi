name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fadi
          POSTGRES_PASSWORD: fadi_ci_password
          POSTGRES_DB: fadi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fadi:fadi_ci_password@localhost:5432/fadi_test
      WEB_ORIGIN: http://localhost:5173
      # app.test.ts registers one user per authorization scenario against a
      # single shared Express app (one in-memory rate limiter for the whole
      # file) — see apps/api/.env.test.example for the full explanation.
      AUTH_RATE_LIMIT: "500"
      API_RATE_LIMIT: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
