name: Fadi — isolation des autres applications

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-foreign-app-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier que le code Fadi n'importe pas de références nominales externes
        run: |
          node --check scripts/check-fadi-isolation.mjs
          node scripts/check-fadi-isolation.mjs
