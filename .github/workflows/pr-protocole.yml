name: PR — protocole Studio

# PR-01 à PR-06 et PR-09 (Checklist Studio V1.0 §9.2) : toute PR qui touche le chantier Studio suit le modèle
# `.github/PULL_REQUEST_TEMPLATE.md` (section « Unité de travail ») et une branche du protocole ; ses Issues liées existent.
# Hors du chantier Studio, le contrôle se déclare non applicable (le job reste vert, donc exigible par une règle).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-protocole-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  protocole:
    name: PR — protocole Studio (PR-01 à PR-06, PR-09)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du contrôle de PR
        run: node --test scripts/registre/controle-pr.test.mjs
      - name: Corps, branche et revalidation de la PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          AUTEUR: ${{ github.event.pull_request.user.login }}
          TETE: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE_REF"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/corps.md"
          node scripts/registre/controle-pr.mjs --corps "$RUNNER_TEMP/corps.md" --branche "$HEAD_REF" \
            --base "origin/$BASE_REF" --tete "$TETE" --auteur "$AUTEUR" --sortie-issues "$RUNNER_TEMP/issues.txt"
      - name: Issues liées existantes (PR-01)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s "$RUNNER_TEMP/issues.txt" ] || { echo "Aucune Issue à vérifier (contrôle non applicable)."; exit 0; }
          while read -r n; do
            [ -n "$n" ] || continue
            nature=$(gh api "repos/${{ github.repository }}/issues/$n" --jq 'if .pull_request then "pr" else "issue" end') \
              || { echo "PR-01 : Issue #$n introuvable"; exit 1; }
            [ "$nature" = "issue" ] || { echo "PR-01 : #$n est une PR, pas une Issue"; exit 1; }
            echo "Issue #$n : existe."
          done < "$RUNNER_TEMP/issues.txt"
