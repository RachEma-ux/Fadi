# Fadi — préproduction isolée (projet Docker Compose « fadi-preprod »).
# Même image que la production (Dockerfile racine), base PostGIS propre, volumes et réseaux propres, aucune ressource de
# la production référencée, aucun montage de l'hôte. Ne se pilote que par `fadi-preprod` (deploy/preprod/fadi-preprod),
# qui fournit FADI_SRC (copie de travail figée sur le commit approuvé), FADI_COMMIT et le fichier d'environnement.
#
# Exposition : 127.0.0.1:3101 seulement (hôte). L'accès public preprod.fadimmo.com passe par proxy/ (phase 4, sur accord).
# Migrations : service à usage unique `migrate` (D-7), lancé par `fadi-preprod migrate` seulement ; `app` se connecte en
# fadi_app, toujours avec MIGRATE_ON_START=0, et ne reçoit jamais l'identifiant de migration.

name: fadi-preprod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: fadi
      POSTGRES_PASSWORD: ${PREPROD_POSTGRES_PASSWORD:?PREPROD_POSTGRES_PASSWORD manquant}
      POSTGRES_DB: fadi
    volumes:
      - fadi-preprod-db:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fadi -d fadi"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1536m
    cpus: 1.5
    logging: *logging

  # D-7 (Gestion des comptes, PR #255) : migration à usage unique avec le superutilisateur de la base de préproduction
  # (schéma, rôles, mot de passe de fadi_app), puis arrêt. Même image que `app` ; lancée seulement par
  # `fadi-preprod migrate`. Cet identifiant n'est jamais donné à l'application.
  migrate:
    image: fadi-preprod-app:${FADI_COMMIT:?FADI_COMMIT manquant}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATE_ONLY: "1"
      NODE_ENV: production
      DATABASE_URL: postgresql://fadi:${PREPROD_POSTGRES_PASSWORD}@db:5432/fadi
      DATABASE_MIGRATION_URL: postgresql://fadi:${PREPROD_POSTGRES_PASSWORD}@db:5432/fadi
      FADI_APP_DB_PASSWORD: ${PREPROD_FADI_APP_DB_PASSWORD:?PREPROD_FADI_APP_DB_PASSWORD manquant (fadi-preprod init-env)}
    networks:
      - internal
    mem_limit: 1g
    cpus: 1
    logging: *logging

  app:
    image: fadi-preprod-app:${FADI_COMMIT:?FADI_COMMIT manquant}
    build:
      context: ${FADI_SRC:?FADI_SRC manquant}
      dockerfile: Dockerfile
      # GET /version : commit et date de construction (fournis par `fadi-preprod build`).
      args:
        FADI_COMMIT: ${FADI_BUILD_COMMIT:-inconnu}
        FADI_BUILD_DATE: ${FADI_BUILD_DATE:-inconnu}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # D-7 : l'API se connecte en fadi_app (aucun DDL), sans l'identifiant de migration ; elle refuse de démarrer en
      # production sinon. Gestion des comptes : administration désactivée par défaut, clé de chiffrement des secrets de
      # double authentification.
      DATABASE_URL: postgresql://fadi_app:${PREPROD_FADI_APP_DB_PASSWORD:?PREPROD_FADI_APP_DB_PASSWORD manquant (fadi-preprod init-env)}@db:5432/fadi
      WEB_ORIGIN: ${PREPROD_WEB_ORIGIN:-http://localhost:3001}
      APP_PUBLIC_URL: ${PREPROD_WEB_ORIGIN:-http://localhost:3001}
      NODE_ENV: production
      TRUST_PROXY: "1"
      MIGRATE_ON_START: "0"
      FADI_ADMIN_ENABLED: ${PREPROD_FADI_ADMIN_ENABLED:-false}
      FADI_ENCRYPTION_KEY: ${PREPROD_FADI_ENCRYPTION_KEY:-}
      ARCHIVE_SIGNING_KEY: ${PREPROD_ARCHIVE_SIGNING_KEY:?PREPROD_ARCHIVE_SIGNING_KEY manquant}
      AUTH_RATE_LIMIT: ${PREPROD_AUTH_RATE_LIMIT:-500}
      API_RATE_LIMIT: ${PREPROD_API_RATE_LIMIT:-5000}
      # Courriel (D-1, UM-28) : tout est facultatif. Sans PREPROD_MAIL_TRANSPORT, aucun envoi (liens à copier affichés).
      # Avec PREPROD_MAIL_TRANSPORT=smtp (SMTP Infomaniak, MAIL_FROM = SMTP_USER), l'API envoie ; les destinataires de
      # domaine réservé (comptes @example.com / @example.test des recettes) ne sont jamais envoyés. Quota prudent : 50 / 24 h.
      # SMTP_PASS n'est transmis qu'à ce service (garde : refusé ailleurs, jamais au service recette).
      MAIL_TRANSPORT: ${PREPROD_MAIL_TRANSPORT:-}
      SMTP_HOST: ${PREPROD_SMTP_HOST:-mail.infomaniak.com}
      SMTP_PORT: ${PREPROD_SMTP_PORT:-465}
      SMTP_SECURE: ${PREPROD_SMTP_SECURE:-true}
      SMTP_USER: ${PREPROD_SMTP_USER:-}
      SMTP_PASS: ${PREPROD_SMTP_PASS:-}
      MAIL_FROM: ${PREPROD_MAIL_FROM:-}
      MAIL_DAILY_LIMIT: ${PREPROD_MAIL_DAILY_LIMIT:-50}
      MAIL_RECIPIENT_HOURLY_LIMIT: ${PREPROD_MAIL_RECIPIENT_HOURLY_LIMIT:-5}
      # Organisations-participation (OP-5) : effacement automatique des contacts sans compte 2 ans après la clôture de
      # tous leurs projets — réserve d'OP-2 levée par le maître d'ouvrage ; activé en préproduction (données synthétiques).
      CONTACT_RETENTION_ENABLED: ${PREPROD_CONTACT_RETENTION_ENABLED:-1}
    ports:
      - "127.0.0.1:3101:3001"
    networks:
      - internal
      - front
    mem_limit: 2g
    cpus: 2
    logging: *logging

  # Recette : image Playwright (navigateurs et Node du même numéro que le dépôt), dépendances de développement, build,
  # psql / pg_dump 16. Partage l'espace réseau de `app` : http://localhost:3001 (cookies « secure » acceptés par Chromium
  # sur localhost) et la base `db`. Sert aussi aux contrôles du dépôt (typecheck, tests) et à la sauvegarde / restauration.
  recette:
    image: fadi-preprod-recette:${FADI_COMMIT:?FADI_COMMIT manquant}
    build:
      context: ${FADI_SRC:?FADI_SRC manquant}
      dockerfile: deploy/preprod/recette.Dockerfile
      # Builds copiés de l'image applicative du même commit (`COPY --from=app`) : Compose construit `app` d'abord.
      additional_contexts:
        app: service:app
    profiles: ["recette"]
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_started
    environment:
      BASE_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:3001
      WEB_DIST: apps/web/dist
      DATABASE_URL: postgresql://fadi:${PREPROD_POSTGRES_PASSWORD}@db:5432/fadi
      PGHOST: db
      PGUSER: fadi
      PGPASSWORD: ${PREPROD_POSTGRES_PASSWORD}
      ARCHIVE_SIGNING_KEY: ${PREPROD_ARCHIVE_SIGNING_KEY}
      AUTH_RATE_LIMIT: ${PREPROD_AUTH_RATE_LIMIT:-500}
      API_RATE_LIMIT: ${PREPROD_API_RATE_LIMIT:-5000}
    # Rapports et sauvegardes dans des volumes nommés (jamais l'hôte) ; `fadi-preprod` en extrait les fichiers ordinaires.
    volumes:
      - fadi-preprod-out:/out
      - fadi-preprod-backups:/backups
    mem_limit: 3g
    cpus: 2
    logging: *logging

volumes:
  fadi-preprod-db:
    name: fadi-preprod-db
  fadi-preprod-backups:
    name: fadi-preprod-backups
  fadi-preprod-out:
    name: fadi-preprod-out

networks:
  internal:
    name: fadi-preprod-internal
    internal: true
  front:
    name: fadi-preprod-front
