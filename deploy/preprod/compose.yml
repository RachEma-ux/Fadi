# Fadi — préproduction isolée (projet Docker Compose « fadi-preprod »).
# Même image que la production (Dockerfile racine), base PostGIS propre, volumes et réseaux propres, aucune ressource de
# la production référencée. Ne se pilote que par `fadi-preprod` (deploy/preprod/fadi-preprod), qui fournit FADI_SRC
# (copie de travail figée sur un commit), FADI_COMMIT, FADI_PREPROD_OUT et le fichier d'environnement de la préproduction.
#
# Exposition : 127.0.0.1:3101 seulement (hôte). L'accès public preprod.fadimmo.com passe par proxy/ (phase 4, sur accord).
# Migrations : MIGRATE_ON_START=0 ; `fadi-preprod migrate` applique init.sql une fois, sur cette base seulement.

name: fadi-preprod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: fadi
      POSTGRES_PASSWORD: ${PREPROD_POSTGRES_PASSWORD:?PREPROD_POSTGRES_PASSWORD manquant}
      POSTGRES_DB: fadi
    volumes:
      - fadi-preprod-db:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fadi -d fadi"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1536m
    cpus: 1.5
    logging: *logging

  app:
    image: fadi-preprod-app:${FADI_COMMIT:?FADI_COMMIT manquant}
    build:
      context: ${FADI_SRC:?FADI_SRC manquant}
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fadi:${PREPROD_POSTGRES_PASSWORD}@db:5432/fadi
      WEB_ORIGIN: ${PREPROD_WEB_ORIGIN:-http://localhost:3001}
      NODE_ENV: production
      TRUST_PROXY: "1"
      MIGRATE_ON_START: ${MIGRATE_ON_START:-0}
      ARCHIVE_SIGNING_KEY: ${PREPROD_ARCHIVE_SIGNING_KEY:?PREPROD_ARCHIVE_SIGNING_KEY manquant}
      AUTH_RATE_LIMIT: ${PREPROD_AUTH_RATE_LIMIT:-500}
      API_RATE_LIMIT: ${PREPROD_API_RATE_LIMIT:-5000}
    ports:
      - "127.0.0.1:3101:3001"
    networks:
      - internal
      - front
    mem_limit: 2g
    cpus: 2
    logging: *logging

  # Recette : image Playwright (navigateurs et Node du même numéro que le dépôt), dépendances de développement, build,
  # psql / pg_dump 16. Partage l'espace réseau de `app` : http://localhost:3001 (cookies « secure » acceptés par Chromium
  # sur localhost) et la base `db`. Sert aussi aux contrôles du dépôt (typecheck, tests) et à la sauvegarde / restauration.
  recette:
    image: fadi-preprod-recette:${FADI_COMMIT:?FADI_COMMIT manquant}
    build:
      context: ${FADI_SRC:?FADI_SRC manquant}
      dockerfile: deploy/preprod/recette.Dockerfile
    profiles: ["recette"]
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_started
    environment:
      BASE_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:3001
      WEB_DIST: apps/web/dist
      DATABASE_URL: postgresql://fadi:${PREPROD_POSTGRES_PASSWORD}@db:5432/fadi
      PGHOST: db
      PGUSER: fadi
      PGPASSWORD: ${PREPROD_POSTGRES_PASSWORD}
      ARCHIVE_SIGNING_KEY: ${PREPROD_ARCHIVE_SIGNING_KEY}
      AUTH_RATE_LIMIT: ${PREPROD_AUTH_RATE_LIMIT:-500}
      API_RATE_LIMIT: ${PREPROD_API_RATE_LIMIT:-5000}
    volumes:
      - ${FADI_PREPROD_OUT:?FADI_PREPROD_OUT manquant}:/out
      - fadi-preprod-backups:/backups
    mem_limit: 3g
    cpus: 2
    logging: *logging

volumes:
  fadi-preprod-db:
    name: fadi-preprod-db
  fadi-preprod-backups:
    name: fadi-preprod-backups

networks:
  internal:
    name: fadi-preprod-internal
    internal: true
  front:
    name: fadi-preprod-front
