# Fadi — hébergement durable sur une machine (VPS, serveur de l'agence) : application + base PostGIS persistante +
# sauvegardes quotidiennes + relais HTTPS automatique. Voir docs/deploiement.md (mise en route, restauration).
#
#   cp .env.deploy.example .env.deploy   # puis renseigner FADI_DOMAIN et POSTGRES_PASSWORD
#   docker compose --env-file .env.deploy up -d --build

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: fadi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant (.env.deploy)}
      POSTGRES_DB: fadi
    volumes:
      - fadi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fadi -d fadi"]
      interval: 10s
      timeout: 5s
      retries: 10

  # D-7 : migration à usage unique avec le compte d'administration de la base (crée les rôles, applique le schéma et les
  # mots de passe des rôles, hors dépôt : .env.deploy), puis s'arrête. Cet identifiant n'est jamais donné à l'API.
  migrate:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATE_ONLY: "1"
      DATABASE_URL: postgresql://fadi:${POSTGRES_PASSWORD}@db:5432/fadi
      DATABASE_MIGRATION_URL: postgresql://fadi:${POSTGRES_PASSWORD}@db:5432/fadi
      FADI_APP_DB_PASSWORD: ${FADI_APP_DB_PASSWORD:?FADI_APP_DB_PASSWORD manquant (.env.deploy, D-7)}
      FADI_RETENTION_DB_PASSWORD: ${FADI_RETENTION_DB_PASSWORD:-}
      NODE_ENV: production

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # D-7 : l'API se connecte en fadi_app (aucun DDL) et ne reçoit ni l'identifiant de migration ni les mots de passe
      # des autres rôles (revue de la PR #255) ; elle refuse de démarrer en production si DATABASE_MIGRATION_URL lui est donné.
      DATABASE_URL: postgresql://fadi_app:${FADI_APP_DB_PASSWORD:?FADI_APP_DB_PASSWORD manquant (.env.deploy, D-7)}@db:5432/fadi
      WEB_ORIGIN: https://${FADI_DOMAIN:?FADI_DOMAIN manquant (.env.deploy)}
      APP_PUBLIC_URL: https://${FADI_DOMAIN}
      NODE_ENV: production
      TRUST_PROXY: "1"
      MIGRATE_ON_START: "0"
      # Gestion des comptes (docs/workstreams/users-management/RUNBOOK.md) : administration désactivée par défaut ;
      # courriel absent = aucun envoi (liens à copier affichés) ; clé de chiffrement des secrets TOTP.
      FADI_ADMIN_ENABLED: ${FADI_ADMIN_ENABLED:-false}
      FADI_ENCRYPTION_KEY: ${FADI_ENCRYPTION_KEY:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-150}
    expose:
      - "3001"

  # HTTPS automatique (Let's Encrypt) et relais vers l'application : le domaine doit pointer sur cette machine (ports 80 / 443).
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    command: caddy reverse-proxy --from ${FADI_DOMAIN} --to app:3001
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - fadi-caddy:/data

  # Sauvegarde quotidienne de la base (format pg_dump « custom », 14 jours conservés) dans un volume dédié ;
  # copier ce volume hors de la machine (rclone, rsync, S3…) fait partie de la procédure (docs/deploiement.md).
  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - fadi-backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/fadi-backup:ro
    entrypoint: ["sh", "-c", "while true; do fadi-backup db fadi fadi /backups; sleep 86400; done"]

volumes:
  fadi-db:
  fadi-backups:
  fadi-caddy:
